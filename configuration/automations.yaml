- id: '1700242260035'
  alias: Grid power above 600 W
  description: ''
  triggers:
  - trigger: time_pattern
    seconds: /40
  conditions: []
  actions:
  - action: script.power_load_disable_device_duplicate
    data: {}
  mode: single
- id: '1731862602452'
  alias: Update switches state on startup
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.1562_heating_main
      - switch.1561_boiler_ten_1_2_kwh
      - switch.1563_heating_ten_1_5_kwh
      - switch.1564_heating_ten_3_kwh
      - switch.1560_boiler_ten_0_8_kwh
  mode: single
- id: '1746509513994'
  alias: Grid power above 600 W restart
  description: ''
  triggers:
  - at: 07:30:00
    trigger: time
  - at: '18:00:00'
    trigger: time
  - type: power
    device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
    entity_id: 0124cde1985f8caf83b525ca9de4902c
    domain: sensor
    trigger: device
    below: -3800
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - target:
      entity_id: automation.grid_power_above_600_w
    action: automation.turn_on
  mode: single
- id: '1765279087359'
  alias: Boiler night charge
  description: ''
  triggers:
  - trigger: time
    at: '23:30:00'
    enabled: false
  - trigger: time
    at: 00:30:00
    enabled: true
  - trigger: time
    at: 01:30:00
    enabled: true
  - trigger: time
    at: 02:30:00
  - trigger: time
    at: 03:30:00
  - trigger: time
    at: 04:30:00
  - trigger: time
    at: 05:30:00
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.my_flag3
      state:
      - 'on'
    - type: is_powered
      condition: device
      device_id: f6c638d30b7111c48069aa655490cd8a
      entity_id: 896ca39ef0b07128ebb845a4562bee48
      domain: binary_sensor
    - type: is_power
      condition: device
      device_id: f6c638d30b7111c48069aa655490cd8a
      entity_id: 208069ecbf43d1c4d2a5d5d78c319f87
      domain: sensor
      above: -900
  actions:
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.1560_boiler_ten_0_8_kwh
      - switch.1561_boiler_ten_1_2_kwh
  mode: single
- id: '1772115229688'
  alias: Deye 5KW 1 Sync Discharge SOC
  description: ''
  triggers:
  - entity_id:
    - input_number.1_discharge_level_deye_5kw
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 5
  actions:
  - target:
      entity_id:
      - number.deye_5kw_program_1_soc
      - number.deye_5kw_program_2_soc
      - number.deye_5kw_program_3_soc
    data:
      value: '{{ trigger.to_state.state | float }}'
    action: number.set_value
  mode: restart
