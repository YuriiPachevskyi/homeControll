      entity_id:
      - number.deye_5kw_program_1_power
      - number.deye_5kw_program_3_power
    data:
      value: '{{ (trigger.to_state.state | float) * 0.5 }}'
    action: number.set_value
  mode: restart
- id: '1772136257055'
  alias: Peak Shaving Time Control (self-healing)
  description: ''
  triggers:
  - minutes: /5
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  actions:
  - choose:
    - conditions:
      - condition: time
        after: 07:00:00
        before: '17:30:00'
      sequence:
      - target:
          entity_id: switch.deye_5kw_grid_peak_shaving
        action: switch.turn_off
    - conditions:
      - condition: time
        after: '17:30:00'
      sequence:
      - target:
          entity_id: switch.deye_5kw_grid_peak_shaving
        action: switch.turn_on
        data: {}
  mode: single
