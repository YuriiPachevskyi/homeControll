    trigger: homeassistant
  - trigger: state
    entity_id:
    - binary_sensor.battery_charge_and_export_power_limit
    to:
    - 'on'
    enabled: false
  conditions: []
  actions:
  - action: script.power_load_disable_device_duplicate
    data: {}
  mode: single
- id: '1777532101180'
  alias: 'Fan controllers: Deye 5kW & 6kW'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_temperature
    above: 55
    id: deye5_on
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_temperature
    below: 45
    id: deye5_off
  - trigger: numeric_state
    entity_id: sensor.deye_6kw_temperature
    above: 55
    id: deye6_on
  - trigger: numeric_state
    entity_id: sensor.deye_6kw_temperature
    below: 45
    id: deye6_off
  - trigger: homeassistant
    event: start
    id: recovery
  - trigger: event
    event_type: automation_reloaded
    id: recovery
  - trigger: time_pattern
    minutes: /15
    id: recovery
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye5_on
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_5kw_temperature
            above: 55
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.fan1_sonoff_10004d5447
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye5_off
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_5kw_temperature
            below: 45
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.fan1_sonoff_10004d5447
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye6_on
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_6kw_temperature
            above: 55
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.fan2_sonoff_1002672f1f_1
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye6_off
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_6kw_temperature
            below: 45
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.fan2_sonoff_1002672f1f_1
  mode: parallel
  max: 10
- id: '1786951566785'
  alias: Bizon suspend automation at 01:00:00
  triggers:
  - at: 01:00:00
    trigger: time
  conditions: []
  actions:
  - action: script.1786295227849
    data: {}
  mode: single
- id: '1788451374111'
  alias: All notifications
  triggers:
  - entity_id: sensor.deye_6kw_load_l1_power
    below: 450
    for:
      minutes: 3
    trigger: numeric_state
    id: boiler
  - entity_id: binary_sensor.deye_5kw_grid
    from: 'on'
    to: 'off'
    for:
      minutes: 1
    trigger: state
    id: lost
  - entity_id: switch.input_meater_switch
    to: unavailable
    for:
      minutes: 1
    trigger: state
    id: lost
  - entity_id: binary_sensor.deye_5kw_grid
    from: 'off'
    to: 'on'
    for:
      minutes: 1
    trigger: state
    id: restored
  - entity_id: switch.input_meater_switch
    from: unavailable
    for:
      minutes: 1
    trigger: state
    id: restored
  - trigger: time
    at: '17:00:00'
    id: eco_reminder
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: boiler
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.1560_boiler_ten_0_8_kwh
          state: 'on'
          for:
            minutes: 3
        - condition: state
          entity_id: switch.1561_boiler_ten_1_2_kwh
          state: 'on'
          for:
            minutes: 3
      - condition: template
        value_template: "{{ states('input_datetime.boiler_last_notified') in ['unknown',
          'unavailable']\n   or (as_timestamp(now()) - as_timestamp(states('input_datetime.boiler_last_notified')))
          > 1 * 3600 }}\n"
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.boiler_last_notified
        data:
          timestamp: '{{ now().timestamp() }}'
      - variables:
          surplus_power_available: "{{ now().strftime('%H:%M:%S') < '14:00:00'\n   and
            states('sensor.deye_6kw_battery') | float(0) > 90\n   and states('sensor.deye_5kw_battery')
            | float(0) > 90 }}"
      - if:
        - condition: template
          value_template: '{{ surplus_power_available }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.boiler_boost_suggested
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.boiler_ten_power_estimate
        data: {}
      - delay: 00:00:02
      - action: script.notify_all
        data:
          title: Бойлер
          message: "\U0001F550 {{ now().strftime('%H:%M') }} \U0001F525 Бойлер нагрівся!!!{%
            if surplus_power_available %} Збільште потужність на макс{% endif %}\nСпожив
            сьогодні: {{ states('sensor.boiler_ten_energy_estimate_daily') | float(0)
            | round(1) }} кВт⋅год"
    - conditions:
      - condition: trigger
        id: eco_reminder
      - condition: state
        entity_id: input_boolean.boiler_boost_suggested
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.boiler_boost_suggested
      - action: script.notify_all
        data:
          title: Нагадування
          message: '{{ ''\U0001F550'' }} {{ now().strftime(''%H:%M'') }} Бойлер на
            Еко'
    - conditions:
      - condition: trigger
        id: lost
      - condition: state
        entity_id: binary_sensor.deye_5kw_grid
        state: 'off'
      - condition: state
        entity_id: switch.input_meater_switch
        state: unavailable
      sequence:
      - action: script.notify_all
        data:
          title: Мережа
          message: "\U0001F550 {{ now().strftime('%H:%M') }} ⚡ Електроживлення зникло"
    - conditions:
      - condition: trigger
        id: restored
      - condition: state
        entity_id: binary_sensor.deye_5kw_grid
        state: 'on'
      - condition: not
        conditions:
        - condition: state
          entity_id: switch.input_meater_switch
          state: unavailable
      sequence:
      - action: script.notify_all
        data:
          title: Мережа
          message: "\U0001F550 {{ now().strftime('%H:%M') }} \U0001F4A1 Електроживлення
            відновлено"
- id: '1788815476602'
  alias: Boiler Energy Sensor Startup Fix
  description: Template/integration sensors for boiler energy tracking can get stuck
    on "unknown" after a HA restart if the boiler switches haven't changed state yet.
    Forces a re-render shortly after startup so tracking resumes without manual intervention.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay: 00:00:30
  - action: template.reload
    data: {}
  - delay: 00:00:03
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.boiler_ten_power_estimate
    data: {}
  mode: single
- id: '1788820000000'
  alias: Boiler Energy Sensor Periodic Refresh
  description: sensor.boiler_ten_power_estimate only re-renders when the boiler switches
    change state, so the integration (Riemann sum) sensor gets no new sample - and
    no accumulated energy - during a long continuous on/off stretch. Forces a re-render
    every 5 minutes so long stretches accumulate smoothly instead of jumping only
    on the next real switch transition.
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions: []
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.boiler_ten_power_estimate
    data: {}
  mode: single
- id: '1788900000000'
  alias: Monthly energy summary
  description: On the 1st of every month at 09:00, sends the previous month's energy
    report to Telegram (solar, grid export/import in UAH, house load). Uses
    hourly long-term statistics - period "day"/"month" return an extra bucket for
    the next month's first day, so they must not be used here. Export and grid purchases
    are priced at 5.2. In months when house load exceeds solar generation, generation
    self-compensates consumption, so (house - solar) is billed at the weighted average
    of day 4.32 and night (23:00-07:00) 2.16, weighted by the month's actual grid
    import per zone, and export is not paid separately. Right after it, sends the
    year-to-date summary with a per-month table (skipped on Feb 1, when only January
    would be covered; on Jan 1 it covers the full previous year).
  triggers:
  - trigger: time
    at: '09:00:00'
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  actions:
  - variables:
      tariff: 5.2
      day_tariff: 4.32
      night_tariff: 2.16
      night_from: 23
      night_to: 7
      period_end: '{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0).isoformat() }}'
      period_start: '{{ (now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) - timedelta(days=1)).replace(day=1).isoformat() }}'
      month_name: '{{ [''січень'', ''лютий'', ''березень'', ''квітень'', ''травень'', ''червень'', ''липень'', ''серпень'', ''вересень'', ''жовтень'', ''листопад'', ''грудень''][(now().month - 2) % 12] }}'
      report_year: '{{ now().year if now().month > 1 else now().year - 1 }}'
      report_month: '{{ (now().month - 2) % 12 + 1 }}'
      year_start: '{{ now().replace(year=(now().year if now().month > 1 else now().year - 1), month=1, day=1, hour=0, minute=0, second=0, microsecond=0).isoformat() }}'
  - action: recorder.get_statistics
    data:
      start_time: '{{ period_start }}'
      end_time: '{{ period_end }}'
      period: hour
      types:
      - change
      statistic_ids:
      - sensor.deye_5kw_total_production
      - sensor.deye_6kw_total_production
      - sensor.deye_5kw_total_energy_export
      - sensor.deye_5kw_total_energy_import
      - sensor.deye_6kw_total_load_consumption
    response_variable: stats
  - variables:
      solar: >-
        {{ (stats.statistics.get('sensor.deye_5kw_total_production', []) | map(attribute='change') | reject('none') | sum)
           + (stats.statistics.get('sensor.deye_6kw_total_production', []) | map(attribute='change') | reject('none') | sum) }}
      grid_export: >-
        {{ stats.statistics.get('sensor.deye_5kw_total_energy_export', []) | map(attribute='change') | reject('none') | sum }}
      grid_import: >-
        {{ stats.statistics.get('sensor.deye_5kw_total_energy_import', []) | map(attribute='change') | reject('none') | sum }}
      house: >-
        {{ stats.statistics.get('sensor.deye_6kw_total_load_consumption', []) | map(attribute='change') | reject('none') | sum }}
      data_ok: '{{ stats.statistics.get(''sensor.deye_5kw_total_production'', []) | length > 600 }}'
      import_night: >-
        {%- set ns = namespace(v=0) -%}
        {%- for r in stats.statistics.get('sensor.deye_5kw_total_energy_import', []) -%}
        {%- set h = as_local(as_datetime(r.start)).hour -%}
        {%- if (h >= night_from or h < night_to) and r.change is not none -%}{%- set ns.v = ns.v + r.change -%}{%- endif -%}
        {%- endfor -%}{{ ns.v }}
      deficit_month: '{{ house > solar }}'
      blended_tariff: '{{ ((grid_import - import_night) * day_tariff + import_night * night_tariff) / grid_import if grid_import > 0 else day_tariff }}'
      payable: '{{ (house - solar) * blended_tariff }}'
      night_kwh: '{{ (house - solar) * import_night / grid_import if grid_import > 0 else 0 }}'
      day_kwh: '{{ (house - solar) - night_kwh }}'
      import_cost: '{{ grid_import * tariff }}'
      house_cost: '{{ house * (blended_tariff if deficit_month else tariff) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ data_ok }}'
      sequence:
      - action: script.notify_all
        data:
          title: Підсумки місяця
          message: |-
            🕐 {{ now().strftime('%H:%M') }} 📊 !!!Підсумки за {{ month_name }} {{ report_year }}!!!

            ☀️ Сонце (обидва інвертори): {{ solar | round(1) }} кВт⋅год
            {%- if deficit_month %}
            📤 Експорт у мережу: {{ grid_export | round(1) }} кВт⋅год
            📥 Спожито з мережі: {{ grid_import | round(1) }} кВт⋅год
            💸 До сплати (споживання мінус генерація): {{ payable | round(0) | int }} грн
               🌙 Вночі: {{ night_kwh | round(1) }} кВт⋅год × {{ night_tariff }} = {{ (night_kwh * night_tariff) | round(0) | int }} грн
               🌞 Вдень: {{ day_kwh | round(1) }} кВт⋅год × {{ day_tariff }} = {{ (day_kwh * day_tariff) | round(0) | int }} грн
            {%- else %}
            📤 Експорт у мережу: {{ grid_export | round(1) }} кВт⋅год ({{ (grid_export * tariff) | round(0) | int }} грн)
            📥 Спожито з мережі: {{ grid_import | round(1) }} кВт⋅год ({{ import_cost | round(0) | int }} грн)
            💰 Дохід від експорту в мережу: {{ (grid_export * tariff - import_cost) | round(0) | int }} грн
            {%- endif %}
            🏠 Спожито будинком: {{ house | round(1) }} кВт⋅год ({{ house_cost | round(0) | int }} грн)
    default:
    - action: script.notify_all
      data:
        title: Підсумки місяця
        message: '🕐 {{ now().strftime(''%H:%M'') }} ⚠️ Не вдалося сформувати підсумки за {{ month_name }} {{ report_year }}: немає даних статистики'
  - if:
    - condition: template
      value_template: '{{ data_ok and report_month > 1 }}'
    then:
    - delay: 00:00:03
    - action: recorder.get_statistics
      data:
        start_time: '{{ year_start }}'
        end_time: '{{ period_end }}'
        period: month
        types:
        - change
        statistic_ids:
        - sensor.deye_5kw_total_production
        - sensor.deye_6kw_total_production
        - sensor.deye_5kw_total_energy_export
        - sensor.deye_5kw_total_energy_import
        - sensor.deye_6kw_total_load_consumption
      response_variable: stats_y
    - action: recorder.get_statistics
      data:
        start_time: '{{ year_start }}'
        end_time: '{{ period_end }}'
        period: hour
        types:
        - change
        statistic_ids:
        - sensor.deye_5kw_total_energy_import
      response_variable: stats_h
    - variables:
        year_data: >-
          {%- set sol5 = stats_y.statistics.get('sensor.deye_5kw_total_production', []) -%}
          {%- set sol6 = stats_y.statistics.get('sensor.deye_6kw_total_production', []) -%}
          {%- set exp_l = stats_y.statistics.get('sensor.deye_5kw_total_energy_export', []) -%}
          {%- set imp_l = stats_y.statistics.get('sensor.deye_5kw_total_energy_import', []) -%}
          {%- set hs_l = stats_y.statistics.get('sensor.deye_6kw_total_load_consumption', []) -%}
          {%- set hourly = stats_h.statistics.get('sensor.deye_5kw_total_energy_import', []) -%}
          {%- set ns = namespace(solar=0, exp=0, imp=0, house=0, net=0, house_cost=0, months=[]) -%}
          {%- for i in range([report_month | int, sol5 | length, sol6 | length, exp_l | length, imp_l | length, hs_l | length] | min) -%}
            {%- set s = (sol5[i].change or 0) + (sol6[i].change or 0) -%}
            {%- set e = exp_l[i].change or 0 -%}
            {%- set im = imp_l[i].change or 0 -%}
            {%- set ho = hs_l[i].change or 0 -%}
            {%- set mo = as_local(as_datetime(sol5[i].start)).month -%}
            {%- set ns.solar = ns.solar + s -%}
            {%- set ns.exp = ns.exp + e -%}
            {%- set ns.imp = ns.imp + im -%}
            {%- set ns.house = ns.house + ho -%}
            {%- if ho > s -%}
              {%- set nn = namespace(v=0) -%}
              {%- for r in hourly -%}
                {%- set t = as_local(as_datetime(r.start)) -%}
                {%- if t.month == mo and (t.hour >= night_from or t.hour < night_to) and r.change is not none -%}{%- set nn.v = nn.v + r.change -%}{%- endif -%}
              {%- endfor -%}
              {%- set bl = ((im - nn.v) * day_tariff + nn.v * night_tariff) / im if im > 0 else day_tariff -%}
              {%- set ns.net = ns.net - (ho - s) * bl -%}
              {%- set ns.months = ns.months + [{'month': mo, 'solar': s, 'exp': e, 'imp': im, 'house': ho, 'net': -(ho - s) * bl}] -%}
              {%- set ns.house_cost = ns.house_cost + ho * bl -%}
            {%- else -%}
              {%- set ns.net = ns.net + (e - im) * tariff -%}
              {%- set ns.months = ns.months + [{'month': mo, 'solar': s, 'exp': e, 'imp': im, 'house': ho, 'net': (e - im) * tariff}] -%}
              {%- set ns.house_cost = ns.house_cost + ho * tariff -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {'solar': ns.solar, 'exp': ns.exp, 'imp': ns.imp, 'house': ns.house, 'net': ns.net, 'house_cost': ns.house_cost, 'months': ns.months} | tojson }}
    - action: script.notify_all
      data:
        title: Підсумки року
        message: |-
          {%- set y = year_data if year_data is mapping else year_data | from_json -%}
          🕐 {{ now().strftime('%H:%M') }} 📅 !!!Підсумки за {{ report_year }} рік{% if report_month | int < 12 %} (січень–{{ month_name }}){% endif %}!!!

          ☀️ Сонце (обидва інвертори): {{ y.solar | round(1) }} кВт⋅год
          📤 Експорт у мережу: {{ y.exp | round(1) }} кВт⋅год
          📥 Спожито з мережі: {{ y.imp | round(1) }} кВт⋅год
          💰 Дохід від експорту в мережу: {{ y.net | round(0) | int }} грн
          🏠 Спожито будинком: {{ y.house | round(1) }} кВт⋅год ({{ y.house_cost | round(0) | int }} грн)

          📆 По місяцях:
          ```
          {{ '%-4s%6s%6s%7s%6s%7s' % ('Міс.', 'Сонце', 'Експ.', 'Мережа', 'Буд.', 'Грн') }}
          {%- set names = ['Січ', 'Лют', 'Бер', 'Кві', 'Тра', 'Чер', 'Лип', 'Сер', 'Вер', 'Жов', 'Лис', 'Гру'] %}
          {%- for r in y.months %}
          {{ '%-4s%6d%6d%7d%6d%+7d' % (names[r.month - 1], r.solar | round(0) | int, r.exp | round(0) | int, r.imp | round(0) | int, r.house | round(0) | int, r.net | round(0) | int) }}
          {%- endfor %}
          ```
          ☀️ Сонце, 📤 експорт, 📥 з мережі, 🏠 будинок — кВт⋅год; грн: + дохід, − до сплати
  mode: single
