- id: '1731862602452'
  alias: Update switches state on startup
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.1562_heating_main
      - switch.1561_boiler_ten_1_2_kwh
      - switch.1563_heating_ten_1_5_kwh
      - switch.1564_heating_ten_3_kwh
      - switch.1560_boiler_ten_0_8_kwh
  mode: single
- id: '1772123844222'
  alias: Deye Param Sync
  triggers:
  - trigger: state
    entity_id: input_number.discharge_level_deye_5kw
    for: 00:00:01
    id: discharge_5kw
  - trigger: state
    entity_id: input_number.discharge_level_deye_6kw
    for: 00:00:01
    id: discharge_6kw
  - trigger: state
    entity_id: input_number.export_deye_5kw_power
    for: 00:00:01
    id: export_5kw
  - trigger: state
    entity_id: input_datetime.selling_start_time
    for: 00:00:01
    id: selling_start
  - trigger: state
    entity_id: input_datetime.selling_stop_time
    for: 00:00:01
    id: selling_stop
  - trigger: state
    entity_id: input_number.battery_power_deye_5kw
    for: 00:00:01
    id: battery_power_5kw
  - trigger: state
    entity_id: input_number.battery_power_deye_6kw
    for: 00:00:01
    id: battery_power_6kw
  - trigger: state
    entity_id: input_number.charge_power_deye_5kw
    for: 00:00:01
    id: charge_power_5kw
  - trigger: state
    entity_id: input_number.charge_power_deye_6kw
    for: 00:00:01
    id: charge_power_6kw
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: discharge_5kw
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_5kw_program_1_soc
          - number.deye_5kw_program_2_soc
          - number.deye_5kw_program_3_soc
          - number.deye_5kw_program_4_soc
          - number.deye_5kw_program_5_soc
          - number.deye_5kw_program_6_soc
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: trigger
        id: discharge_6kw
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_6kw_program_1_soc
          - number.deye_6kw_program_2_soc
          - number.deye_6kw_program_3_soc
          - number.deye_6kw_program_4_soc
          - number.deye_6kw_program_5_soc
          - number.deye_6kw_program_6_soc
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: trigger
        id: export_5kw
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_5kw_export_surplus_power
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: trigger
        id: selling_start
      sequence:
      - action: time.set_value
        target:
          entity_id: time.deye_5kw_program_2_time
        data:
          time: '{{ trigger.to_state.state }}'
    - conditions:
      - condition: trigger
        id: selling_stop
      sequence:
      - action: time.set_value
        target:
          entity_id: time.deye_5kw_program_3_time
        data:
          time: '{{ trigger.to_state.state }}'
    - conditions:
      - condition: trigger
        id: battery_power_5kw
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_5kw_program_1_power
          - number.deye_5kw_program_2_power
          - number.deye_5kw_program_3_power
          - number.deye_5kw_program_4_power
          - number.deye_5kw_program_5_power
          - number.deye_5kw_program_6_power
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: trigger
        id: battery_power_6kw
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_6kw_program_1_power
          - number.deye_6kw_program_2_power
          - number.deye_6kw_program_3_power
          - number.deye_6kw_program_4_power
          - number.deye_6kw_program_5_power
          - number.deye_6kw_program_6_power
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: trigger
        id: charge_power_5kw
      sequence:
      - variables:
          voltage: 54.4
          power_kw: '{{ trigger.to_state.state | float(0) }}'
          current: '{{ (power_kw * 1000 / voltage) | round(0) }}'
      - action: number.set_value
        target:
          entity_id:
          - number.deye_5kw_battery_max_charging_current
        data:
          value: '{{ current }}'
    - conditions:
      - condition: trigger
        id: charge_power_6kw
      sequence:
      - variables:
          voltage: 51
          power_kw: '{{ trigger.to_state.state | float(0) }}'
          current: '{{ (power_kw * 1000 / voltage) | round(0) }}'
      - action: number.set_value
        target:
          entity_id:
          - number.deye_6kw_battery_max_charging_current
        data:
          value: '{{ current }}'
  mode: queued
  max: 9
- id: deye_state_scheduler
  alias: Deye State Scheduler
  description: Handles time-based state transitions and force mode
  triggers:
  - trigger: time
    at: input_datetime.selling_start_time
    id: Morning Export
  - trigger: time
    at: input_datetime.update_morning_param_time
    id: Max Solar
  - trigger: time
    at: input_datetime.update_evening_param_time
    id: Evening Export
  - trigger: time
    at: input_datetime.selling_stop_time
    id: Night Idle
  - trigger: state
    entity_id: input_boolean.force_high_power_on_low_charge
    id: force_toggle
  actions:
  - if:
    - condition: trigger
      id: Evening Export
    - condition: state
      entity_id: input_boolean.force_high_power_on_low_charge
      state: 'on'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.force_high_power_on_low_charge
  - action: input_select.select_option
    target:
      entity_id: input_select.deye_system_state
    data:
      option: "{% if is_state('input_boolean.force_high_power_on_low_charge', 'on')
        %}\n  Max Solar Forced\n{% else %}\n  {% set now_time = now().strftime('%H:%M:%S')
        %}\n  {% set morning_export = states('input_datetime.selling_start_time')
        %}\n  {% set max_solar = states('input_datetime.update_morning_param_time')
        %}\n  {% set evening_export = states('input_datetime.update_evening_param_time')
        %}\n  {% set night_idle = states('input_datetime.selling_stop_time') %}\n
        \ \n  {% if morning_export <= now_time < max_solar %}\n    Morning Export\n
        \ {% elif max_solar <= now_time < evening_export %}\n    Max Solar\n  {% elif
        evening_export <= now_time < night_idle %}\n    Evening Export\n  {% else
        %}\n    Night Idle\n  {% endif %}\n{% endif %}"
- id: deye_state_controller
  alias: Deye State Controller
  description: Applies settings based on current Deye System State
  triggers:
  - trigger: state
    entity_id: input_select.deye_system_state
    id: state_changed
  - trigger: time_pattern
    id: periodic_update
    hours: /1
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id: sensor.deye_6kw_battery
    id: battery_changed
  actions:
  - variables:
      current_state: '{{ states(''input_select.deye_system_state'') }}'
      max_discharge_power_5kw: 2400
      smart_limit: '{{ [states(''sensor.deye_5kw_smart_discharge_limit'') | float(300),
        max_discharge_power_5kw] | min }}'
      is_selling_6kw: '{{ is_state(''input_boolean.deye_6kw_battery_selling'', ''on'')
        }}'
      config:
        Morning Export:
          5kw_soc: 55
          5kw_power: '{{ smart_limit }}'
          export_power: 5050
          6kw_soc: 40
          6kw_power: 900
          peak_shaving_6kw: 'on'
          general_automation: true
        Max Solar:
          5kw_soc: 55
          5kw_power: 350
          export_power: 5080
          6kw_soc: 40
          6kw_power: 1000
          peak_shaving_6kw: 'on'
          general_automation: true
        Max Solar Forced:
          5kw_soc: 40
          5kw_power: 350
          export_power: 5080
          6kw_soc: 55
          6kw_power: 1000
          peak_shaving_6kw: 'on'
          general_automation: true
        Evening Export:
          5kw_soc: 55
          5kw_power: '{{ smart_limit }}'
          export_power: 5000
          6kw_soc: 70
          6kw_power: 1000
          peak_shaving_6kw: '{{ ''off'' if is_selling_6kw else ''on'' }}'
          general_automation: true
        Night Idle:
          5kw_soc: 35
          5kw_power: 1000
          export_power: 100
          6kw_soc: 35
          6kw_power: 1300
          peak_shaving_6kw: 'on'
          general_automation: true
      s: '{{ config.get(current_state, config[''Night Idle'']) }}'
  - if:
    - condition: template
      value_template: '{{ current_state == ''Evening Export'' }}'
    - condition: template
      value_template: '{{ is_selling_6kw }}'
    - condition: template
      value_template: '{{ states(''sensor.deye_6kw_battery'') | float(0) <= s[''6kw_soc'']
        | float(0) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.deye_6kw_grid_peak_shaving
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.deye_6kw_battery_selling
    - action: input_number.set_value
      target:
        entity_id: input_number.discharge_level_deye_6kw
      data:
        value: '{{ [ (states(''sensor.deye_6kw_battery'') | float(0) - 20) | round(0),
          30 ] | max }}'
  - if:
    - condition: template
      value_template: '{{ trigger.id != ''battery_changed'' }}'
    then:
    - action: switch.turn_{{ s.peak_shaving_6kw }}
      target:
        entity_id: switch.deye_6kw_grid_peak_shaving
    - action: input_number.set_value
      target:
        entity_id: input_number.discharge_level_deye_5kw
      data:
        value: '{{ s[''5kw_soc''] }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.battery_power_deye_5kw
      data:
        value: '{{ s[''5kw_power''] }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.discharge_level_deye_6kw
      data:
        value: '{{ s[''6kw_soc''] }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.battery_power_deye_6kw
      data:
        value: '{{ s[''6kw_power''] }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.export_deye_5kw_power
      data:
        value: '{{ s[''export_power''] }}'
    - if:
      - condition: template
        value_template: '{{ current_state != ''Evening Export'' and trigger.id in
          [''state_changed'', ''ha_start''] }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.deye_6kw_battery_selling
    - if:
      - condition: template
        value_template: '{{ s.general_automation }}'
      then:
      - action: automation.turn_on
        target:
          entity_id: automation.general_automation
        data: {}
      - action: automation.trigger
        target:
          entity_id: automation.general_automation
        data:
          skip_condition: true
  mode: queued
  max: 5
- id: deye_6kw_selling_weather_check
  alias: Deye 6kW Battery Selling - Auto Weather Check
  description: Auto-toggles input_boolean.deye_6kw_battery_selling based on tomorrow's
    forecast cloud coverage, 1 minute before update_evening_param_time. Runs year-round
    so the flag is force-reset off outside March-September (it would otherwise never
    reset once the season condition stopped matching), but only ever turns it on within
    that window.
  triggers:
  - trigger: time
    at:
      entity_id: input_datetime.update_evening_param_time
      offset: -00:01:00
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: hourly
    response_variable: hourly_forecast
  - variables:
      hourly: '{{ hourly_forecast[''weather.forecast_home''][''forecast''] }}'
      avg_cloud_coverage: "{% set tomorrow_date = (now() + timedelta(days=1)).date()
        %} {% set ns = namespace(total=0, count=0) %} {% for f in hourly %}\n  {%
        set dt_local = as_local(as_datetime(f.datetime)) %}\n  {% if dt_local.date()
        == tomorrow_date and 8 <= dt_local.hour <= 18 %}\n    {% set ns.total = ns.total
        + f.cloud_coverage %}\n    {% set ns.count = ns.count + 1 %}\n  {% endif %}\n{%
        endfor %} {{ (ns.total / ns.count) if ns.count > 0 else 100 }}"
      sunny_percent: '{{ 100 - (avg_cloud_coverage | float(100)) }}'
      in_season: '{{ now().month in [3, 4, 5, 6, 7, 8, 9] }}'
      is_sunny_tomorrow: '{{ in_season and sunny_percent > 70 }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.deye_6kw_selling_forecast_cloud
    data:
      value: '{{ avg_cloud_coverage | round(1) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.last_script_trigger
    data:
      value: 'Deye 6kW Selling Auto: sunny {{ sunny_percent | round(0) }}%{{ ''''
        if in_season else '' (off-season)'' }} -> {{ ''ON'' if is_sunny_tomorrow else
        ''OFF'' }} ({{ now().strftime(''%H:%M:%S'') }})'
  - if:
    - condition: template
      value_template: '{{ is_sunny_tomorrow }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.deye_6kw_battery_selling
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.deye_6kw_battery_selling
  mode: single
- id: deye_grid_lost_emergency
  alias: Deye Grid Lost Emergency
  description: High priority protection when grid is down
  triggers:
  - trigger: state
    entity_id: binary_sensor.deye_5kw_grid
    from: 'on'
    to: 'off'
    id: grid_lost
  - trigger: state
    entity_id: binary_sensor.deye_5kw_grid
    from: 'off'
    to: 'on'
    id: grid_restored
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: grid_restored
      sequence:
      - action: select.select_option
        target:
          entity_id: select.deye_5kw_io_mode
        data:
          option: SmartLoad
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ (states(''sensor.deye_5kw_pv_power'') | float(0)) +
            (states(''sensor.deye_6kw_pv_power'') | float(0)) > 5000 }}'
        sequence:
        - action: select.select_option
          target:
            entity_id: select.deye_5kw_io_mode
          data:
            option: Microinverter
        - action: switch.turn_on
          target:
            entity_id:
            - switch.1560_boiler_ten_0_8_kwh
            - switch.1561_boiler_ten_1_2_kwh
        - action: input_number.set_value
          target:
            entity_id: input_number.charge_power_deye_6kw
          data:
            value: 3
      default:
      - action: input_number.set_value
        target:
          entity_id: input_number.charge_power_deye_6kw
        data:
          value: 2
    - action: switch.turn_on
      target:
        entity_id: switch.deye_6kw_grid_peak_shaving
  mode: queued
  max: 3
- id: '1773316386421'
  alias: Grid power
  description: ''
  triggers:
  - entity_id:
    - script.power_load_disable_device_duplicate
    from:
    to:
    for:
      hours: 0
      minutes: 0
