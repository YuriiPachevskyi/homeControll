      entity_id: switch.1560_boiler_ten_0_8_kwh
  mode: single
- id: '1746509513994'
  alias: Restart "Grid power above 600 W"
  description: ''
  triggers:
  - trigger: time
    at: 07:30:00
  - trigger: time
    at: '18:00:00'
  conditions: []
  actions:
  - action: automation.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: automation.grid_power_above_600_w
  mode: single
