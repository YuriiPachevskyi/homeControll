- id: deye_state_scheduler
  alias: Deye State Scheduler
  description: Handles time-based state transitions and force mode
  triggers:
  - trigger: time
    at: input_datetime.selling_start_time
    id: Morning Export
  - trigger: time
    at: input_datetime.update_morning_param_time
    id: Max Solar
  - trigger: time
    at: input_datetime.update_evening_param_time
    id: Evening Export
  - trigger: time
    at: input_datetime.selling_stop_time
    id: Night Idle
  - trigger: state
    entity_id: input_boolean.force_high_power_on_low_charge
    id: force_toggle
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.deye_system_state
    data:
      option: "{% if is_state('input_boolean.force_high_power_on_low_charge', 'on')
        %}\n  Max Solar Forced\n{% else %}\n  {% set now_time = now().strftime('%H:%M:%S')
        %}\n  {% set morning_export = states('input_datetime.selling_start_time')
        %}\n  {% set max_solar = states('input_datetime.update_morning_param_time')
        %}\n  {% set evening_export = states('input_datetime.update_evening_param_time')
        %}\n  {% set night_idle = states('input_datetime.selling_stop_time') %}\n
        \ \n  {% if morning_export <= now_time < max_solar %}\n    Morning Export\n
        \ {% elif max_solar <= now_time < evening_export %}\n    Max Solar\n  {% elif
        evening_export <= now_time < night_idle %}\n    Evening Export\n  {% else
        %}\n    Night Idle\n  {% endif %}\n{% endif %}"
- id: deye_state_controller
  alias: Deye State Controller
  description: Applies settings based on current Deye System State
  triggers:
  - trigger: state
    entity_id: input_select.deye_system_state
    id: state_changed
  - trigger: time_pattern
    id: periodic_update
    minutes: /30
  - trigger: homeassistant
    event: start
    id: ha_start
  actions:
  - variables:
      current_state: '{{ states(''input_select.deye_system_state'') }}'
      smart_limit: '{{ states(''sensor.deye_5kw_smart_discharge_limit'') | float(300)
        }}'
      is_selling_6kw: '{{ is_state(''input_boolean.deye_6kw_battery_selling'', ''on'')
        }}'
      config:
        Morning Export:
          5kw_soc: 50
          5kw_power: 2500
          6kw_soc: 40
          6kw_power: 900
          peak_shaving_5kw: 'off'
          peak_shaving_6kw: 'on'
          general_automation: true
        Max Solar:
          5kw_soc: 60
          5kw_power: 300
          6kw_soc: 40
          6kw_power: 1000
          peak_shaving_5kw: 'off'
          peak_shaving_6kw: 'on'
          general_automation: true
        Max Solar Forced:
          5kw_soc: 40
          5kw_power: 2600
          6kw_soc: 40
          6kw_power: 1000
          peak_shaving_5kw: 'off'
          peak_shaving_6kw: 'on'
          general_automation: true
        Evening Export:
          5kw_soc: 50
          5kw_power: '{{ smart_limit }}'
          6kw_soc: 50
          6kw_power: 1000
          peak_shaving_5kw: 'off'
          peak_shaving_6kw: '{{ ''off'' if is_selling_6kw else ''on'' }}'
          general_automation: true
        Night Idle:
          5kw_soc: 35
          5kw_power: 1000
          6kw_soc: 35
          6kw_power: 1300
          peak_shaving_5kw: 'on'
          peak_shaving_6kw: 'on'
          general_automation: true
      s: '{{ config.get(current_state, config[''Night Idle'']) }}'
  - action: switch.turn_{{ s.peak_shaving_5kw }}
    target:
      entity_id: switch.deye_5kw_grid_peak_shaving
  - action: switch.turn_{{ s.peak_shaving_6kw }}
    target:
      entity_id: switch.deye_6kw_grid_peak_shaving
  - action: input_number.set_value
    target:
      entity_id: input_number.1_discharge_level_deye_5kw
    data:
      value: '{{ s[''5kw_soc''] }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.battery_power_deye_5kw
    data:
      value: '{{ s[''5kw_power''] }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.1_discharge_level_deye_6kw
    data:
      value: '{{ s[''6kw_soc''] }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.battery_power_deye_6kw
    data:
      value: '{{ s[''6kw_power''] }}'
  - if:
    - condition: template
      value_template: '{{ s.general_automation }}'
    then:
    - action: automation.turn_on
      target:
        entity_id: automation.general_automation
      data: {}
    - action: automation.trigger
      target:
        entity_id: automation.general_automation
      data:
        skip_condition: true
- id: deye_grid_lost_emergency
  alias: Deye Grid Lost Emergency
  description: High priority protection when grid is down
  triggers:
  - trigger: state
    entity_id: binary_sensor.deye_6kw_grid
    to: 'off'
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_grid_l1_voltage
    above: 255
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.deye_5kw_grid_l1_voltage
        above: 255
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.1560_boiler_ten_0_8_kwh
          - switch.1561_boiler_ten_1_2_kwh
      - action: input_number.set_value
        target:
          entity_id: input_number.charge_power_deye_6kw
        data:
          value: 3
    default:
    - action: input_number.set_value
      target:
        entity_id: input_number.charge_power_deye_6kw
      data:
        value: 2
  - action: switch.turn_on
    target:
      entity_id: switch.deye_6kw_grid_peak_shaving
  variables:
    grid_on: '{{ is_state(''binary_sensor.deye_6kw_grid'', ''on'') }}'
  mode: queued
  max: 3
- id: '1773316386421'
  alias: Grid power
  description: ''
  triggers:
  - entity_id:
    - script.power_load_disable_device_duplicate
    from:
    to:
    for:
      hours: 0
      minutes: 0
      seconds: 30
    trigger: state
  - event: start
    trigger: homeassistant
  - trigger: state
    entity_id:
    - binary_sensor.battery_charge_and_export_power_limit
    to:
    - 'on'
    enabled: false
  conditions: []
  actions:
  - action: script.power_load_disable_device_duplicate
    data: {}
  mode: single
- id: '1777532101180'
  alias: 'Fan controllers: Deye 5kW & 6kW'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_temperature
    above: 55
    id: deye5_on
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_temperature
    below: 45
    id: deye5_off
  - trigger: numeric_state
    entity_id: sensor.deye_6kw_temperature
    above: 55
    id: deye6_on
  - trigger: numeric_state
    entity_id: sensor.deye_6kw_temperature
    below: 45
    id: deye6_off
  - trigger: homeassistant
    event: start
    id: recovery
  - trigger: event
    event_type: automation_reloaded
    id: recovery
  - trigger: time_pattern
    minutes: /15
    id: recovery
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye5_on
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_5kw_temperature
            above: 55
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.fan1_sonoff_10004d5447
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye5_off
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_5kw_temperature
            below: 45
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.fan1_sonoff_10004d5447
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye6_on
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_6kw_temperature
            above: 55
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.fan2_sonoff_1002672f1f_1
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye6_off
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_6kw_temperature
            below: 45
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.fan2_sonoff_1002672f1f_1
  mode: parallel
  max: 10
