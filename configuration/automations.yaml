- id: '1772480869891'
  alias: Deye Morning Control (Ultra Safe)
  description: Peak shaving + charge logic + scheduler control
  triggers:
  - trigger: time
    at: 07:30:00
    id: t_0730
  - trigger: time
    at: '10:00:00'
    id: t_1000
  - trigger: time
    at: '18:00:00'
    id: t_1800
  - trigger: time_pattern
    minutes: /10
    id: periodic
  - trigger: state
    entity_id: binary_sensor.deye_6kw_grid
    id: grid_change
  - trigger: homeassistant
    event: start
    id: ha_start
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not grid_on }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.charge_power_deye_6kw
        data:
          value: 75
      - stop: Grid lost emergency
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''t_0730'' }}'
      sequence:
      - action: automation.turn_on
        target:
          entity_id: automation.grid_power_above_600_w
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''t_1800'' }}'
      sequence:
      - action: automation.turn_on
        target:
          entity_id: automation.grid_power_above_600_w
  - choose:
    - conditions:
      - condition: time
        after: 07:30:00
        before: '18:00:00'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.deye_5kw_grid_peak_shaving
    default:
    - action: switch.turn_on
      target:
        entity_id: switch.deye_5kw_grid_peak_shaving
  - choose:
    - conditions:
      - condition: time
        after: 07:30:00
        before: '10:00:00'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.charge_power_deye_6kw
        data:
          value: 0
  mode: restart
  variables:
    grid_on: '{{ is_state(''binary_sensor.deye_6kw_grid'', ''on'') }}'
