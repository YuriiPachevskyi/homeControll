- id: '1700242260035'
  alias: Grid power above 600 W
  description: ''
  triggers:
  - type: powered
    device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
    entity_id: f92dd0042137a11a70c8b56bdd102329
    domain: binary_sensor
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - type: power
    device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
    entity_id: 0124cde1985f8caf83b525ca9de4902c
    domain: sensor
    trigger: device
    above: 300
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - entity_id:
    - script.power_load_disable_device_duplicate_2
    from:
    to:
    for:
      hours: 0
      minutes: 0
      seconds: 40
    trigger: state
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - action: script.power_load_disable_device_duplicate_2
    data: {}
  mode: single
- id: '1711297405381'
  alias: 'boiler 2.0 KWh at 4: 00 AM enable'
  description: ''
  triggers:
  - at: 04:40:00
    trigger: time
  conditions:
  - condition: state
    entity_id: switch.boiler_night_charge
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.1560_boiler_ten_0_8_kwh
      - switch.1561_boiler_ten_1_2_kwh
    data: {}
  mode: single
- id: '1731862602452'
  alias: Update switches state on startup
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.1562_heating_main
      - switch.1561_boiler_ten_1_2_kwh
      - switch.1563_heating_ten_1_5_kwh
      - switch.1564_heating_ten_3_kwh
      - switch.boiler_night_charge
  - action: switch.turn_on
    metadata: {}
    data: {}
