    trigger: homeassistant
  - trigger: state
    entity_id:
    - binary_sensor.battery_charge_and_export_power_limit
    to:
    - 'on'
    enabled: false
  conditions: []
  actions:
  - action: script.power_load_disable_device_duplicate
    data: {}
  mode: single
- id: '1777532101180'
  alias: 'Fan controllers: Deye 5kW & 6kW'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_temperature
    above: 55
    id: deye5_on
  - trigger: numeric_state
    entity_id: sensor.deye_5kw_temperature
    below: 45
    id: deye5_off
  - trigger: numeric_state
    entity_id: sensor.deye_6kw_temperature
    above: 55
    id: deye6_on
  - trigger: numeric_state
    entity_id: sensor.deye_6kw_temperature
    below: 45
    id: deye6_off
  - trigger: homeassistant
    event: start
    id: recovery
  - trigger: event
    event_type: automation_reloaded
    id: recovery
  - trigger: time_pattern
    minutes: /15
    id: recovery
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye5_on
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_5kw_temperature
            above: 55
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.fan1_sonoff_10004d5447
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye5_off
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_5kw_temperature
            below: 45
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.fan1_sonoff_10004d5447
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye6_on
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_6kw_temperature
            above: 55
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.fan2_sonoff_1002672f1f_1
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: deye6_off
        - condition: and
          conditions:
          - condition: trigger
            id: recovery
          - condition: numeric_state
            entity_id: sensor.deye_6kw_temperature
            below: 45
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.fan2_sonoff_1002672f1f_1
  mode: parallel
  max: 10
- id: '1786951566785'
  alias: Bizon suspend automation at 01:00:00
  triggers:
  - at: 01:00:00
    trigger: time
  conditions: []
  actions:
  - action: script.1786295227849
    data: {}
  mode: single
- id: '1788451374111'
  alias: All notifications
  triggers:
  - entity_id: sensor.deye_6kw_load_l1_power
    below: 450
    for:
      minutes: 3
    trigger: numeric_state
    id: boiler
  - entity_id: binary_sensor.deye_5kw_grid
    from: 'on'
    to: 'off'
    for:
      minutes: 1
    trigger: state
    id: lost
  - entity_id: switch.input_meater_switch
    to: unavailable
    for:
      minutes: 1
    trigger: state
    id: lost
  - entity_id: binary_sensor.deye_5kw_grid
    from: 'off'
    to: 'on'
    for:
      minutes: 1
    trigger: state
    id: restored
  - entity_id: switch.input_meater_switch
    from: unavailable
    for:
      minutes: 1
    trigger: state
    id: restored
  - trigger: time
    at: '17:00:00'
    id: eco_reminder
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: boiler
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.1560_boiler_ten_0_8_kwh
          state: 'on'
          for:
            minutes: 3
        - condition: state
          entity_id: switch.1561_boiler_ten_1_2_kwh
          state: 'on'
          for:
            minutes: 3
      - condition: template
        value_template: "{{ states('input_datetime.boiler_last_notified') in ['unknown',
          'unavailable']\n   or (as_timestamp(now()) - as_timestamp(states('input_datetime.boiler_last_notified')))
          > 1 * 3600 }}\n"
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.boiler_last_notified
        data:
          timestamp: '{{ now().timestamp() }}'
      - variables:
          surplus_power_available: "{{ now().strftime('%H:%M:%S') < '14:00:00'\n   and
            states('sensor.deye_6kw_battery') | float(0) > 90\n   and states('sensor.deye_5kw_battery')
            | float(0) > 90 }}"
      - if:
        - condition: template
          value_template: '{{ surplus_power_available }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.boiler_boost_suggested
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.boiler_ten_power_estimate
        data: {}
      - delay: 00:00:02
      - action: script.notify_all
        data:
          title: Бойлер
          message: "\U0001F550 {{ now().strftime('%H:%M') }} \U0001F525 Бойлер нагрівся!!!{%
            if surplus_power_available %} Збільште потужність на макс{% endif %}\nСпожив
            сьогодні: {{ states('sensor.boiler_ten_energy_estimate_daily') | float(0)
            | round(1) }} кВт⋅год"
    - conditions:
      - condition: trigger
        id: eco_reminder
      - condition: state
        entity_id: input_boolean.boiler_boost_suggested
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.boiler_boost_suggested
      - action: script.notify_all
        data:
          title: Нагадування
          message: '{{ ''\U0001F550'' }} {{ now().strftime(''%H:%M'') }} Бойлер на
            Еко'
    - conditions:
      - condition: trigger
        id: lost
      - condition: state
        entity_id: binary_sensor.deye_5kw_grid
        state: 'off'
      - condition: state
        entity_id: switch.input_meater_switch
        state: unavailable
      sequence:
      - action: script.notify_all
        data:
          title: Мережа
          message: "\U0001F550 {{ now().strftime('%H:%M') }} ⚡ Електроживлення зникло"
    - conditions:
      - condition: trigger
        id: restored
      - condition: state
        entity_id: binary_sensor.deye_5kw_grid
        state: 'on'
      - condition: not
        conditions:
        - condition: state
          entity_id: switch.input_meater_switch
          state: unavailable
      sequence:
      - action: script.notify_all
        data:
          title: Мережа
