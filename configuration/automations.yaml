- id: '1772480869891'
  alias: Deye Morning Control (Ultra Safe)
  description: Peak shaving + charge logic + scheduler control
  triggers:
  - trigger: time
    at: input_datetime.selling_start_time
    id: start_sell
  - trigger: time
    at: input_datetime.selling_stop_time
    id: stop_sell
  - trigger: time_pattern
    id: periodic
    hours: /1
  - trigger: state
    entity_id: binary_sensor.deye_6kw_grid
    id: grid_change
  - trigger: homeassistant
    event: start
    id: ha_start
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not grid_on }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.deye_6kw_grid_peak_shaving
        data: {}
      - action: input_number.set_value
        target:
          entity_id: input_number.charge_power_deye_6kw
        data:
          value: 4
      - stop: Grid lost emergency
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'start_sell'\n   or\n   (trigger.id == 'periodic'\n
          \   and now().strftime('%H:%M') ==\n        states('input_datetime.selling_start_time')[0:5])
          }}\n"
      sequence:
      - action: automation.turn_on
        target:
          entity_id:
          - automation.general_automation
        data: {}
      - action: input_number.set_value
        data:
          value: 45
        target:
          entity_id: input_number.1_discharge_level_deye_5kw
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''stop_sell'' }}'
      sequence:
      - action: automation.turn_on
        target:
          entity_id:
          - automation.disable_conditioner
          - automation.general_automation
        data: {}
      - action: input_number.set_value
        data:
          value: 2000
        target:
          entity_id: input_number.battery_power_deye_6kw
      - action: input_number.set_value
        data:
          value: 35
        target:
          entity_id:
          - input_number.1_discharge_level_deye_6kw
  - choose:
    - conditions:
      - condition: time
        after: input_datetime.selling_start_time
        before: input_datetime.selling_stop_time
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.deye_5kw_grid_peak_shaving
        data: {}
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.input_meater_switch
        data: {}
      - target:
          entity_id:
          - number.deye_5kw_program_5_power
          - number.deye_5kw_program_6_power
        data:
          value: '{{ 0 }}'
        action: number.set_value
    default:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.deye_5kw_grid_peak_shaving
        - switch.deye_6kw_grid_peak_shaving
      data: {}
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set stop = states('input_datetime.selling_stop_time')
          %} {% if stop == 'unknown' %}\n  false\n{% else %}\n  now() >= stop | as_datetime\n{%
          endif %}\n"
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.deye_5kw_grid_peak_shaving
          - switch.deye_6kw_grid_peak_shaving
        data: {}
      - target:
          entity_id:
          - number.deye_5kw_program_5_power
          - number.deye_5kw_program_6_power
        data:
          value: '{{ 1000 }}'
        action: number.set_value
  variables:
    grid_on: '{{ is_state(''binary_sensor.deye_6kw_grid'', ''on'') }}'
  mode: queued
  max: 3
