- id: '1731862602452'
  alias: Update switches state on startup
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.1562_heating_main
      - switch.1561_boiler_ten_1_2_kwh
      - switch.1563_heating_ten_1_5_kwh
      - switch.1564_heating_ten_3_kwh
      - switch.1560_boiler_ten_0_8_kwh
  mode: single
- id: '1772123844222'
  alias: Deye Power Sync
  description: ''
  triggers:
  - entity_id:
    - input_number.battery_power_deye_5kw
    - input_number.battery_power_deye_6kw
    - input_number.charge_power_deye_5kw
    - input_number.charge_power_deye_6kw
    for: 00:00:01
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_number.battery_power_deye_5kw''
          }}'
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_5kw_program_1_power
          - number.deye_5kw_program_2_power
          - number.deye_5kw_program_3_power
          - number.deye_5kw_program_4_power
          - number.deye_5kw_program_5_power
          - number.deye_5kw_program_6_power
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_number.battery_power_deye_6kw''
          }}'
      sequence:
      - action: number.set_value
        target:
          entity_id:
          - number.deye_6kw_program_1_power
          - number.deye_6kw_program_2_power
          - number.deye_6kw_program_3_power
          - number.deye_6kw_program_4_power
          - number.deye_6kw_program_5_power
          - number.deye_6kw_program_6_power
        data:
          value: '{{ trigger.to_state.state | float(0) | round(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_number.charge_power_deye_5kw''
          }}'
      sequence:
      - variables:
          voltage: 54.4
          power_kw: '{{ states(''input_number.charge_power_deye_5kw'') | float(0)
            }}'
          current: '{{ (power_kw * 1000 / voltage) | round(0) }}'
      - target:
          entity_id:
          - number.deye_5kw_battery_max_charging_current
        data:
          value: '{{ current }}'
        action: number.set_value
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_number.charge_power_deye_6kw''
          }}'
      sequence:
      - variables:
          voltage: 51
          power_kw: '{{ states(''input_number.charge_power_deye_6kw'') | float(0)
            }}'
          current: '{{ (power_kw * 1000 / voltage) | round(0) }}'
      - target:
          entity_id:
          - number.deye_6kw_battery_max_charging_current
        data:
          value: '{{ current }}'
        action: number.set_value
  mode: queued
  max: 3
