- id: '1772480869891'
  alias: Deye Morning Control
  description: Peak shaving + charge logic + scheduler control
  triggers:
  - trigger: time
    at: input_datetime.selling_start_time
    id: start_sell
  - trigger: time
    at: input_datetime.selling_stop_time
    id: stop_sell
  - trigger: time
    at: input_datetime.update_selling_param_time
    id: update_params
  - trigger: time_pattern
    hours: /1
    id: periodic
  - trigger: state
    entity_id: binary_sensor.deye_6kw_grid
    id: grid_change
  - trigger: homeassistant
    event: start
    id: ha_start
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not grid_on }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.deye_6kw_grid_peak_shaving
        data: {}
      - action: input_number.set_value
        target:
          entity_id: input_number.charge_power_deye_6kw
        data:
          value: 4
      - stop: Grid lost emergency
  - choose:
    - conditions:
      - condition: trigger
        id: update_params
      sequence:
      - action: input_number.set_value
        target:
          entity_id:
          - input_number.battery_power_deye_5kw
        data:
          value: 2800
      - action: input_number.set_value
        target:
          entity_id:
          - input_number.1_discharge_level_deye_5kw
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id:
          - input_number.1_discharge_level_deye_6kw
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id:
          - input_number.battery_power_deye_6kw
        data:
          value: 800
      - action: switch.turn_off
        target:
          entity_id:
          - switch.deye_6kw_grid_peak_shaving
        data: {}
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''start_sell'' or (trigger.id == ''periodic''
          and  now().strftime(''%H:%M'') == states(''input_datetime.selling_start_time'',
          ''00:00'')[0:5]) }}

          '
      sequence:
      - action: input_number.set_value
        data:
          value: 40
        target:
          entity_id: input_number.1_discharge_level_deye_5kw
      - action: automation.turn_on
        target:
          entity_id:
          - automation.general_automation
        data: {}
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.general_automation
        data:
          skip_condition: true
    - conditions:
      - condition: trigger
        id: stop_sell
      sequence:
      - action: automation.turn_on
        target:
          entity_id:
          - automation.disable_conditioner
        data: {}
      - action: automation.turn_on
        target:
          entity_id:
          - automation.general_automation
        data: {}
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.general_automation
        data:
          skip_condition: true
  - choose:
    - conditions:
      - condition: time
        after: input_datetime.selling_start_time
        before: input_datetime.selling_stop_time
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.deye_5kw_grid_peak_shaving
        data: {}
      - action: switch.turn_on
        target:
          entity_id: switch.input_meater_switch
        data: {}
    default:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.deye_5kw_grid_peak_shaving
        - switch.deye_6kw_grid_peak_shaving
      data: {}
    - action: input_number.set_value
      data:
        value: 2500
      target:
        entity_id:
        - input_number.battery_power_deye_5kw
    - action: input_number.set_value
      data:
        value: 1500
      target:
        entity_id:
        - input_number.battery_power_deye_6kw
    - action: input_number.set_value
      data:
        value: 35
      target:
        entity_id:
        - input_number.1_discharge_level_deye_5kw
        - input_number.1_discharge_level_deye_6kw
  variables:
    grid_on: '{{ is_state(''binary_sensor.deye_6kw_grid'', ''on'') }}'
  mode: queued
  max: 3
- id: '1772625520676'
  alias: Disable Conditioner
  description: ''
  triggers:
  - entity_id:
    - climate.2_nd_room_conditioner
    above: 300
    for:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
    trigger: numeric_state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.2_nd_room_conditioner
      state:
      - heat
      - cool
  actions:
  - action: climate.set_hvac_mode
    target:
      device_id: be55afc0f88f5ce38043ce63a5d08b6f
    data:
      hvac_mode: 'off'
  mode: single
- id: '1773316386421'
  alias: Grid power
  description: ''
  triggers:
  - entity_id:
    - script.power_load_disable_device_duplicate
    from:
    to:
    for:
      hours: 0
      minutes: 0
      seconds: 40
    trigger: state
  - event: start
    trigger: homeassistant
  - trigger: state
    entity_id:
    - binary_sensor.battery_charge_and_export_power_limit
    to:
    - 'on'
    enabled: false
  conditions: []
  actions:
  - action: script.power_load_disable_device_duplicate
    data: {}
  mode: single
- id: '1777532101180'
  alias: 'Cooling Control: Deye 5kW'
  description: Turns on Sonoff at 40°C and turns it off at 35°C
  triggers:
  - entity_id:
    - sensor.deye_5kw_temperature
    above: 40
    id: turn_on
    trigger: numeric_state
  - entity_id:
    - sensor.deye_5kw_temperature
    below: 35
    id: turn_off
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on
      sequence:
      - target:
          entity_id: switch.sonoff_10004b3fe8
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: turn_off
      sequence:
      - target:
          entity_id: switch.sonoff_10004b3fe8
        action: switch.turn_off
  mode: restart
