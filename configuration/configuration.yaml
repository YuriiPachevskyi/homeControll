# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
mqtt: !include switches.yaml

homeassistant:
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.26.0.0/16
    - 127.0.0.1
    - 192.168.1.0/24
    - 2000::/3
    - 2a00:f41:583f:54b3:7492:5a16:7e68:8a3e  # Твій поточний IP


template:
  - sensor:
      - name: "Total PV Power"
        unique_id: total_pv_power
        unit_of_measurement: "W"
        device_class: power
        state: "{{ (states('sensor.deye_5kw_pv_power') | float(0)) + (states('sensor.deye_6kw_pv_power') | float(0)) }}"

      - name: "Total Battery Today Discharge"
        unique_id: total_battery_today_discharge
        unit_of_measurement: "kWh"
        device_class: energy
        state: "{{ (states('sensor.deye_5kw_today_battery_discharge') | float(0)) + (states('sensor.deye_6kw_today_battery_discharge') | float(0)) }}"

      - name: "Total Battery Power Realtime"
        unique_id: total_battery_power_realtime
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.deye_5kw_battery_power') | float(0)) + (states('sensor.deye_6kw_battery_power') | float(0)) }}"

sensor:
  - platform: integration
    source: sensor.deye_5kw_power_losses
    name: deye_5kw_energy_losses
    unit_prefix: k
    method: trapezoidal

utility_meter:
  deye_5_losses_daily:
    source: sensor.deye_5kw_energy_losses
    cycle: daily

input_boolean:
  my_flag1:
    name: Air conditioning cooling
    icon: mdi:toggle-switch
  my_flag2:
    name: Air conditioning heating
    icon: mdi:toggle-switch

input_datetime:
  selling_start_time:
    name: Selling Start Time
    has_date: false
    has_time: true

  selling_stop_time:
    name: Selling Stop Time
    has_date: false
    has_time: true

shell_command:
  bizon_suspend: ssh -i /config/.ssh/id_rsa -o StrictHostKeyChecking=no yurii@192.168.1.4 "sudo systemctl suspend"
  bizon_reboot: ssh -i /config/.ssh/id_rsa -o StrictHostKeyChecking=no yurii@192.168.1.4 "sudo reboot"

