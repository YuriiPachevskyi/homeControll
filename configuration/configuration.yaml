# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
switch: !include switches_i2c.yaml

homeassistant:
  packages: !include_dir_named packages
  # Librus message attachments saved for Telegram (librus/apply_local_patches.py patch 6)
  allowlist_external_dirs:
    - /config/librus/attachments

template:
  - sensor:
      - name: "Total PV Power"
        unique_id: total_pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.deye_5kw_pv_power') | float(0)) + (states('sensor.deye_6kw_pv_power') | float(0)) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_pv_power')) and is_number(states('sensor.deye_6kw_pv_power')) }}"

      - name: "Total Battery Today Discharge"
        unique_id: total_battery_today_discharge
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.deye_5kw_today_battery_discharge') | float(0)) + (states('sensor.deye_6kw_today_battery_discharge') | float(0)) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_today_battery_discharge')) and is_number(states('sensor.deye_6kw_today_battery_discharge')) }}"

      - name: "Total Battery Power Realtime"
        unique_id: total_battery_power_realtime
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.deye_5kw_battery_power') | float(0)) + (states('sensor.deye_6kw_battery_power') | float(0)) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_battery_power')) and is_number(states('sensor.deye_6kw_battery_power')) }}"

      - name: "Total Load Power Realtime"
        unique_id: total_load_power_realtime
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.deye_6kw_load_power') | float(0) }}"
        availability: "{{ is_number(states('sensor.deye_6kw_load_power')) }}"

      - name: "Total Grid Power Realtime"
        unique_id: total_grid_power_realtime
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.deye_5kw_grid_power') | float(0) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_grid_power')) }}"

      - name: "Total Today PV Production"
        unique_id: total_today_pv_production
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.deye_5kw_today_production') | float(0)) + (states('sensor.deye_6kw_today_production') | float(0)) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_today_production')) and is_number(states('sensor.deye_6kw_today_production')) }}"

      - name: "Total Today Grid Import"
        unique_id: total_today_grid_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ states('sensor.deye_5kw_today_energy_import') | float(0) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_today_energy_import')) }}"

      - name: "Total Today Load"
        unique_id: total_today_load
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ states('sensor.deye_6kw_today_load_consumption') | float(0) }}"
        availability: "{{ is_number(states('sensor.deye_6kw_today_load_consumption')) }}"

      - name: "Total Today Grid Export"
        unique_id: total_today_grid_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ states('sensor.deye_5kw_today_energy_export') | float(0) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_today_energy_export')) }}"

      - name: "Total Battery Today Charge"
        unique_id: total_battery_today_charge
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.deye_5kw_today_battery_charge') | float(0)) + (states('sensor.deye_6kw_today_battery_charge') | float(0)) }}"
        availability: "{{ is_number(states('sensor.deye_5kw_today_battery_charge')) and is_number(states('sensor.deye_6kw_today_battery_charge')) }}"

      - name: "Boiler TEN Power Estimate"
        unique_id: boiler_ten_power_estimate
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {# Upper-bound estimate: relay on = rated TEN power.
             The boiler's internal thermostat can open the circuit even
             while the relay stays on - HA can't see that, so actual
             consumption may be lower than this estimate. #}
          {% set ns = namespace(p=0) %}
          {% if is_state('switch.1560_boiler_ten_0_8_kwh', 'on') %}
            {% set ns.p = ns.p + 800 %}
          {% endif %}
          {% if is_state('switch.1561_boiler_ten_1_2_kwh', 'on') %}
            {% set ns.p = ns.p + 1200 %}
          {% endif %}
          {{ ns.p }}
        availability: >
          {{ states('switch.1560_boiler_ten_0_8_kwh') not in ['unknown', 'unavailable'] and
             states('switch.1561_boiler_ten_1_2_kwh') not in ['unknown', 'unavailable'] }}

      - name: "Boiler TEN Energy Total"
        unique_id: boiler_ten_energy_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# Adds the manually-backfilled Sep 1-7 baseline (16.70755 kWh) to the
             live Riemann-integrated value, so the running total stays continuous
             across HA restarts instead of the raw integration sensor's own value
             (which restarts from 0 and would overwrite recorder statistics).
             Clamped against its own last reported value so a post-restart
             blip (the estimate sensor briefly reporting stale/zeroed data
             while the template/integration chain re-renders) can never make
             this total_increasing sensor go backwards - a real decrease here
             gets read by the recorder as a meter reset and zeroes the
             recorded statistics sum (happened 2026-09-07/08). Holding the
             last value steady during a blip is self-healing: once the
             estimate is valid again, tracking just resumes from there. #}
          {% set computed = (16.70755 + (states('sensor.boiler_ten_energy_estimate') | float(0))) | round(4) %}
          {% set last = states('sensor.boiler_ten_energy_total') | float(computed) %}
          {{ [computed, last] | max }}
        availability: "{{ is_number(states('sensor.boiler_ten_energy_estimate')) }}"

      - name: "House Losses And Untracked Energy"
        unique_id: house_losses_and_untracked_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# Parent for the Energy dashboard "Losses" branch: everything the
             house consumed except the 6kW inverter's useful load, i.e. inverter
             losses + whatever the dashboard would otherwise call "untracked".
             House consumption is computed the same way the Energy dashboard
             does (only the 5kW inverter is on the real grid, see the
             energy_dashboard_topology notes). Only deltas matter - the
             absolute value is meaningless because the lifetime counters have
             different baselines. Clamped against its own last value: the
             inputs update at slightly different moments (two inverters) and
             a momentary dip would be read by the recorder as a meter reset. #}
          {% set ids = ['sensor.deye_5kw_total_energy_import', 'sensor.deye_5kw_total_production',
                        'sensor.deye_6kw_total_production', 'sensor.deye_5kw_total_battery_discharge',
                        'sensor.deye_6kw_total_battery_discharge', 'sensor.deye_5kw_total_energy_export',
                        'sensor.deye_5kw_total_battery_charge', 'sensor.deye_6kw_total_battery_charge',
                        'sensor.deye_6kw_total_load_consumption', 'sensor.deye_5kw_total_load_consumption',
                        'sensor.deye_6kw_total_energy_import'] %}
          {% set v = ids | map('states') | map('float', 0) | list %}
          {# minus 6kW load, minus the 5kW load that is NOT passed on to the 6kW
             inverter (that part is its own "Deye_5KW Load" device) #}
          {% set computed = (v[0] + v[1] + v[2] + v[3] + v[4] - v[5] - v[6] - v[7] - v[8] - (v[9] - v[10])) | round(1) %}
          {% set last = states('sensor.house_losses_and_untracked_energy') | float(computed) %}
          {{ [computed, last] | max }}
        availability: >
          {{ expand('sensor.deye_5kw_total_energy_import', 'sensor.deye_5kw_total_production',
                    'sensor.deye_6kw_total_production', 'sensor.deye_5kw_total_battery_discharge',
                    'sensor.deye_6kw_total_battery_discharge', 'sensor.deye_5kw_total_energy_export',
                    'sensor.deye_5kw_total_battery_charge', 'sensor.deye_6kw_total_battery_charge',
                    'sensor.deye_6kw_total_load_consumption', 'sensor.deye_5kw_total_load_consumption',
                    'sensor.deye_6kw_total_energy_import')
             | map(attribute='state') | select('is_number') | list | length == 11 }}

      - name: "Deye 5KW Direct Load Energy"
        unique_id: deye_5kw_direct_load_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# 5kW load that is consumed directly on its LOAD port, i.e. not
             passed on to the 6kW inverter. The 6kW is fed from that port
             (its "grid import"), and that energy is already counted in the
             6kW load / losses, so counting the whole 5kW load would double
             it in winter. Ratcheted like the other cumulative sensors here. #}
          {% set computed = (states('sensor.deye_5kw_total_load_consumption') | float(0)
                             - states('sensor.deye_6kw_total_energy_import') | float(0)) | round(1) %}
          {% set last = states('sensor.deye_5kw_direct_load_energy') | float(computed) %}
          {{ [computed, last] | max }}
        availability: >
          {{ is_number(states('sensor.deye_5kw_total_load_consumption')) and
             is_number(states('sensor.deye_6kw_total_energy_import')) }}

      - name: "Home Load Energy"
        unique_id: home_load_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# Everything the house actually consumed: 6kW load plus the part of
             the 5kW load that is not passed on to the 6kW inverter (that part
             is already inside the 6kW load - see Deye 5KW Direct Load Energy).
             Cumulative, ratcheted so a skew between the two inverters can not
             make it go backwards. #}
          {% set computed = (states('sensor.deye_6kw_total_load_consumption') | float(0)
                             + states('sensor.deye_5kw_total_load_consumption') | float(0)
                             - states('sensor.deye_6kw_total_energy_import') | float(0)) | round(1) %}
          {% set last = states('sensor.home_load_energy') | float(computed) %}
          {{ [computed, last] | max }}
        availability: >
          {{ is_number(states('sensor.deye_6kw_total_load_consumption')) and
             is_number(states('sensor.deye_5kw_total_load_consumption')) and
             is_number(states('sensor.deye_6kw_total_energy_import')) }}

sensor:
  - platform: integration
    source: sensor.deye_5kw_power_losses
    name: deye_5kw_energy_losses
    unit_prefix: k
    method: trapezoidal

  - platform: integration
    source: sensor.boiler_ten_power_estimate
    name: boiler_ten_energy_estimate
    unit_prefix: k
    method: trapezoidal

utility_meter:
  deye_5_losses_daily:
    source: sensor.deye_5kw_energy_losses
    cycle: daily

  boiler_ten_energy_estimate_daily:
    source: sensor.boiler_ten_energy_estimate
    cycle: daily

shell_command:
  bizon_suspend: 'ssh -p 2222 -i /ssh/id_rsa -o StrictHostKeyChecking=no yurii@192.168.1.4 "sudo systemctl suspend -i </dev/null >/dev/null 2>&1 &"'
  bizon_reboot: 'ssh -p 2222 -i /ssh/id_rsa -o StrictHostKeyChecking=no yurii@192.168.1.4 "sudo reboot </dev/null >/dev/null 2>&1 &"'
  bizon_poweroff: 'ssh -p 2222 -i /ssh/id_rsa -o StrictHostKeyChecking=no yurii@192.168.1.4 "sudo systemctl poweroff </dev/null >/dev/null 2>&1 &"'
  bizon_wakeup: 'wakeonlan 2c:f0:5d:7b:3e:89'
  notify_log_append: 'python3 /config/notify/notify_log.py append "{{ payload_b64 }}"'
  notify_log_remove: 'python3 /config/notify/notify_log.py remove {{ slot }}'
  # Runs in the HA container's own Python (3.14), not the pipeline's host-side
  # venv (3.13) - the venv's python3 symlink points at /usr/bin/python3, which
  # only exists on the host, not inside the container. requests/PyYAML already
  # ship with HA core; pypdf (pure-Python, zero deps) is vendored separately
  # for the container via PYTHONPATH so it doesn't need reinstalling on every
  # HA container update (see statistics/oselya/vendor/). --reconcile-only skips
  # fetch_all() (needs ~/.secrets/oselya_cabinet, which only exists on the host, not
  # in the container) - this trigger only needs to react to to-do checkboxes.
  oselya_sync: 'PYTHONPATH=/config/statistics/oselya/vendor python3 /config/statistics/oselya/sync.py --reconcile-only >> /config/statistics/oselya/sync.log 2>&1'


# Serves statistics/documents/ (ENERA acts, Oselya receipts) behind HA auth and
# publishes signed, expiring links in sensor.document_links.
documents:
