# Bizon autosuspend: while input_boolean.bizon_autosuspend (checkbox on the Bizon
# card on Home) is on, Bizon is suspended once it has been awake for 5 min with
# no SSH session and no progress in Jellyfin for those 5 min. A paused player
# does not count as progress (sensor.jellyfin_position stays the same).
# If a sensor is unavailable the state is unknown, so nothing is suspended.
# sensor.bizon_ssh_sessions also counts RDP connections and a real use of the
# web UIs (js/rd/sr/qb/bzpr/bzpl.yuriip4) in the last 15 min, see
# ~/.local/bin/bizon-ssh-sessions on Bizon.
#
# Wake on demand: https://jf.yuriip4.duckdns.org is the Jellyfin address that
# wakes Bizon (Nginx Proxy Manager host, its advanced config is kept in
# bizon_jellyfin_nginx.conf). When Bizon does not answer, nginx calls the webhook
# below and holds the request until Jellyfin is back. local_only: the webhook
# cannot be reached from outside, so its id does not have to be secret.
# The same webhook wakes Bizon for its web UIs (bizon_web_nginx.conf) and for
# RDP through rpi4 (bizon-rdp-wake.service); they send {"service": <app>}.
input_boolean:
  bizon_autosuspend:
    name: "Bizon autosuspend"
    icon: mdi:power-sleep

# Who woke Bizon: maps the DeviceId nginx saw to the Jellyfin user
rest_command:
  jellyfin_devices:
    url: http://192.168.1.4:8096/Devices
    headers:
      Authorization: !secret jellyfin_auth
    timeout: 10

# Set by nginx on the first real use after a wake (bizon_jellyfin_nginx.conf)
template:
  - triggers:
      - trigger: webhook
        webhook_id: bizon_jellyfin_confirmed
        allowed_methods:
          - POST
        local_only: true
    sensor:
      - name: "Bizon Jellyfin confirmed"
        unique_id: bizon_jellyfin_confirmed
        icon: mdi:account-check
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          path: "{{ trigger.json.path | default('') if trigger.json is mapping else '' }}"
          device: "{{ trigger.json.device | default(trigger.json.os | default('')) if trigger.json is mapping else '' }}"

command_line:
  - sensor:
      name: "Bizon SSH sessions"
      unique_id: bizon_ssh_sessions
      # ~/.local/bin/bizon-ssh-sessions on Bizon; unavailable while it sleeps
      command: >-
        ssh -p 2222 -i /ssh/id_rsa -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=3
        yurii@192.168.1.4 "~/.local/bin/bizon-ssh-sessions"
      icon: mdi:ssh
      scan_interval: 60

automation:
  - id: bizon_wake_jellyfin
    alias: Bizon wake for Jellyfin
    description: >-
      Wakes the Bizon when a request to jf.yuriip4.duckdns.org, a Bizon web UI on
      rpi4 or an RDP connection to rpi4 found it asleep.
    # With the delay at the end: one wake a minute however many requests come
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: webhook
        webhook_id: bizon_wake_jellyfin
        allowed_methods:
          - POST
        local_only: true
    actions:
      # nginx sends path, client, device, device_id, os (see bizon_jellyfin_nginx.conf);
      # web UIs and RDP send service (and path)
      - variables:
          req: "{{ trigger.json if trigger.json is defined and trigger.json is mapping else {} }}"
          woke_at: "{{ now().isoformat() }}"
          # Same form as DateLastActivity in Jellyfin /Devices, compared as text
          woke_utc: "{{ utcnow().strftime('%Y-%m-%dT%H:%M:%S') }}"
      - action: script.host_power
        data:
          host: bizon
          command: wakeup
      # The user is known only to Jellyfin, so ask it once it is up
      - if:
          - condition: template
            value_template: "{{ req.device_id | default('', true) | length > 0 }}"
        then:
          - wait_template: "{{ has_value('sensor.jellyfin_playing') }}"
            timeout: "00:01:30"
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - action: rest_command.jellyfin_devices
                response_variable: devices
                continue_on_error: true
      # Shows on the Bizon card next to the button presses: user and device
      # ("Jellyfin (yurii · iPhone)"), whichever of them is known, else the
      # platform from the User-Agent ("Jellyfin (Android TV)"), else "Jellyfin"
      - event: host_power_command
        event_data:
          host: bizon
          command: wakeup
          who: >-
            {%- set items = (devices.content.Items if devices is defined and devices.content is mapping else []) or [] %}
            {%- set dev = items | selectattr('Id', 'eq', req.device_id | default('')) | list | first | default({}) %}
            {#- The Android TV app sends an Id at start that /Devices does not list
                (it lists another one), so else: the same app and device name,
                active since the wake, most recent first #}
            {%- if not dev %}
              {%- set dev = items | selectattr('AppName', 'eq', req.client | default('', true))
                    | selectattr('Name', 'eq', req.device | default('', true))
                    | selectattr('DateLastActivity', 'defined') | selectattr('DateLastActivity', 'ge', woke_utc)
                    | sort(attribute='DateLastActivity', reverse=true) | first | default({}) %}
            {%- endif %}
            {%- set user = dev.LastUserName | default('', true) | trim %}
            {%- set device = (req.device | default('', true) or dev.Name | default('', true)) | trim %}
            {%- set who = [user, device] | select | join(' · ') or req.os | default('', true) %}
            {%- set who = who | replace(' ()', '') | trim %}
            {%- if req.service | default('', true) %}{{ req.service }}
            {%- else %}{{ 'Jellyfin (%s)' | format(who) if who else 'Jellyfin' }}{% endif %}
      # Real use confirms the wake (sensor.bizon_jellyfin_confirmed). Without it
      # (an app starting in the background, a tab Safari restores) Bizon goes
      # back to sleep after 3 min instead of the 5 idle min of autosuspend.
      - wait_template: >-
          {{ (states('sensor.bizon_jellyfin_confirmed') | as_datetime(none)) is not none
             and states('sensor.bizon_jellyfin_confirmed') | as_datetime > as_datetime(woke_at) }}
        timeout: "00:03:00"
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
          - condition: state
            entity_id: input_boolean.bizon_autosuspend
            state: "on"
          - condition: state
            entity_id: binary_sensor.bizon_awake
            state: "on"
          - condition: state
            entity_id: sensor.bizon_ssh_sessions
            state: "0"
          - condition: template
            value_template: "{{ states('sensor.jellyfin_playing') | int(0) == 0 }}"
        then:
          - event: host_power_command
            event_data:
              host: bizon
              command: suspend
              who: Unconfirmed wake
          - action: script.host_power
            data:
              host: bizon
              command: suspend
          # No delay: a request right after this must be able to wake it again
          - stop: Unconfirmed wake
      - delay: "00:01:00"

  - id: bizon_autosuspend
    alias: Bizon autosuspend
    description: >-
      Suspends the Bizon after 5 min awake with no SSH session and no Jellyfin
      progress, while input_boolean.bizon_autosuspend is on.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.bizon_autosuspend
        state: "on"
      - condition: state
        entity_id: binary_sensor.bizon_awake
        state: "on"
        for: "00:05:00"
      - condition: state
        entity_id: sensor.bizon_ssh_sessions
        state: "0"
        for: "00:05:00"
      - condition: template
        value_template: >-
          {{ has_value('sensor.jellyfin_position')
             and now() - states.sensor.jellyfin_position.last_changed >= timedelta(minutes=5) }}
    actions:
      # Shows on the Bizon card next to the button presses
      - event: host_power_command
        event_data:
          host: bizon
          command: suspend
          who: Autosuspend
      - action: script.host_power
        data:
          host: bizon
          command: suspend
      # Bizon Awake needs up to 30 s to notice
      - delay: "00:02:00"
