# Included into EVERY NPM proxy host as /data/nginx/custom/server_proxy.conf, but only acts on
# jf.yuriip4.duckdns.org (Bizon Jellyfin). Reference copy: packages/bizon_jellyfin_friend_redirect.conf.
#
# Direct play of items from the E-films / E-serial libraries (.strm files pointing at the friend's
# Jellyfin, see bizon ~/.local/bin/friend-jellyfin-sync.py): instead of Bizon proxying the remote
# file through its slow uplink, the player gets a 302 to the friend's URL and streams from there.
# Transcoded playback (HLS) is untouched and still goes through Bizon.
location ~* ^/videos/[0-9a-f-]+/stream(\.[a-z0-9]+)?$ {
  rewrite_by_lua_block {
    if ngx.var.host ~= "jf.yuriip4.duckdns.org" then return end
    local args = ngx.req.get_uri_args()
    local function arg(name)
      for k, v in pairs(args) do
        if k:lower() == name then return type(v) == "table" and v[1] or v end
      end
    end
    local static = arg("static")
    if type(static) ~= "string" or static:lower() ~= "true" then return end
    local id = ngx.var.uri:match("^/[^/]+/([0-9a-fA-F%-]+)/")
    if not id then return end
    id = id:gsub("-", ""):lower()
    local cache = ngx.shared.bizon_wake
    local key = "friend_url:" .. id
    local url = cache:get(key)
    if url == nil then
      -- Ask Bizon with the client's own credentials (headers are inherited by the subrequest)
      local q = { ids = id, Fields = "MediaSources", EnableImages = "false" }
      -- This Jellyfin rejects api_key in the query of /Items, so pass it as a header
      local tok = arg("api_key")
      if tok and not ngx.var.http_authorization then
        ngx.req.set_header("Authorization", 'MediaBrowser Token="' .. tok .. '"')
      end
      local r = ngx.location.capture("/__jf_friend_lookup", { args = q })
      if r.status ~= 200 then return end
      local j = require("cjson.safe").decode(r.body)
      local it = j and j.Items and j.Items[1]
      local ms = it and it.MediaSources and it.MediaSources[1]
      local p = ms and ms.Path or ""
      url = (p:find("^https://jf%.ekachur%.xyz/") and p) or ""
      cache:set(key, url, 3600)
    end
    if url ~= "" then
      ngx.header["Cache-Control"] = "no-store"
      return ngx.redirect(url, 302)
    end
  }
  include conf.d/include/proxy.conf;
}

location = /__jf_friend_lookup {
  internal;
  proxy_set_header Range "";
  proxy_set_header Accept-Encoding "";
  proxy_set_header If-None-Match "";
  proxy_set_header If-Modified-Since "";
  proxy_pass $forward_scheme://$server:$port/Items$is_args$args;
}
