# Included into EVERY NPM proxy host as /data/nginx/custom/server_proxy.conf, but only acts on
# jf.yuriip4.duckdns.org (Bizon Jellyfin). Reference copy: packages/bizon_jellyfin_friend_redirect.conf,
# helper module packages/bizon_jellyfin_friend_audio.lua -> /data/nginx/custom/friend_audio.lua.
#
# Items of the E-films / E-serial libraries are .strm files pointing at the friend's Jellyfin
# (bizon ~/.local/bin/friend-jellyfin-sync.py). Bizon's internet is too slow to relay them, so:
#  1. direct play (/Videos/<id>/stream?static=true) gets a 302 to the friend's URL;
#  2. when the default audio track is TrueHD/DTS (TVs fall back to transcoding on Bizon), a
#     same-language E-AC3/AC3/AAC track is made the default and requested in PlaybackInfo.
# Transcoded playback (HLS) is untouched and still goes through Bizon.

location ~* ^/videos/[0-9a-f-]+/stream(\.[a-z0-9]+)?$ {
  rewrite_by_lua_block {
    if ngx.var.host ~= "jf.yuriip4.duckdns.org" then return end
    local F = package.loaded.friend_audio or dofile("/data/nginx/custom/friend_audio.lua")
    package.loaded.friend_audio = F
    local static = F.arg("static")
    if type(static) ~= "string" or static:lower() ~= "true" then return end
    local id = F.item_id()
    if not id then return end
    local cache = ngx.shared.bizon_wake
    local key = "friend_url:" .. id
    local url = cache:get(key)
    if url == nil then
      F.auth_from_query()
      local ms, status = F.lookup(id)
      if status ~= 200 then return end
      local p = ms and ms.Path or ""
      url = (p:find("^https://jf%.ekachur%.xyz/") and p) or ""
      cache:set(key, url, 3600)
    end
    if url ~= "" then
      ngx.header["Cache-Control"] = "no-store"
      return ngx.redirect(url, 302)
    end
  }
  include conf.d/include/proxy.conf;
}

# PlaybackInfo: request the lighter audio track, and mark it as default in the answer
location ~* ^/items/[0-9a-f-]+/playbackinfo$ {
  client_body_buffer_size 256k;
  client_max_body_size 1m;
  rewrite_by_lua_block {
    if ngx.var.host ~= "jf.yuriip4.duckdns.org" then return end
    local F = package.loaded.friend_audio or dofile("/data/nginx/custom/friend_audio.lua")
    package.loaded.friend_audio = F
    local id = F.item_id()
    if not id then return end
    F.auth_from_query()
    local ms, status = F.lookup(id)
    if status ~= 200 or not F.is_friend(ms) then return end
    ngx.ctx.friend_fix = true
    ngx.req.clear_header("Accept-Encoding")
    if type(ms.MediaStreams) ~= "table" or #ms.MediaStreams == 0 then
      ms = F.probe(id) or ms   -- first play: let Bizon analyse the file once
    end
    local idx, heavy = F.pick(ms)
    if not idx then return end
    F.request_audio(idx, heavy)
  }
  header_filter_by_lua_block {
    if not ngx.ctx.friend_fix then return end
    if ngx.status ~= 200 or not (ngx.header.content_type or ""):find("json", 1, true) then
      ngx.ctx.friend_fix = false
      return
    end
    ngx.header.content_length = nil
  }
  body_filter_by_lua_block { if ngx.ctx.friend_fix then package.loaded.friend_audio.filter() end }
  include conf.d/include/proxy.conf;
}

# Item details: the TV app picks its audio track from these before PlaybackInfo
location ~* "^/(users/[^/]+/)?items/[0-9a-f-]{32,36}$" {
  rewrite_by_lua_block {
    if ngx.var.host ~= "jf.yuriip4.duckdns.org" or ngx.req.get_method() ~= "GET" then return end
    ngx.ctx.friend_fix = true
    ngx.req.clear_header("Accept-Encoding")
  }
  header_filter_by_lua_block {
    if not ngx.ctx.friend_fix then return end
    if ngx.status ~= 200 or not (ngx.header.content_type or ""):find("json", 1, true) then
      ngx.ctx.friend_fix = false
      return
    end
    ngx.header.content_length = nil
  }
  body_filter_by_lua_block {
    if not ngx.ctx.friend_fix then return end
    local F = package.loaded.friend_audio or dofile("/data/nginx/custom/friend_audio.lua")
    package.loaded.friend_audio = F
    F.filter()
  }
  include conf.d/include/proxy.conf;
}

location = /__jf_friend_lookup {
  internal;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Content-Type "";
  proxy_set_header Range "";
  proxy_set_header Accept-Encoding "";
  proxy_set_header If-None-Match "";
  proxy_set_header If-Modified-Since "";
  proxy_pass $forward_scheme://$server:$port/Items$is_args$args;
}

location ~ ^/__jf_friend_probe/([0-9a-f]+)$ {
  internal;
  proxy_set_header Content-Type "application/json";
  proxy_set_header Range "";
  proxy_set_header Accept-Encoding "";
  proxy_read_timeout 60s;
  proxy_pass $forward_scheme://$server:$port/Items/$1/PlaybackInfo;
}
