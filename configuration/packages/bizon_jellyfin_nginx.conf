# Advanced config of the Nginx Proxy Manager host jf.yuriip4.duckdns.org ->
# 192.168.1.4:8096 (see bizon_autosuspend.yaml). Reference copy: NPM keeps the
# live one in its database, paste changes into the host's Advanced tab. Needs
# bizon_jellyfin_nginx_http_top.conf as /data/nginx/custom/http_top.conf.
proxy_connect_timeout 3s;
proxy_read_timeout 1h;
proxy_buffering off;
error_page 502 504 = @bizon_wake;

location = /__bizon_wake {
  internal;
  proxy_method POST;
  # Body: who asked (bizon_wake.client). The client's credentials stay here.
  proxy_set_header Content-Type "application/json";
  proxy_set_header Authorization "";
  proxy_set_header X-Emby-Authorization "";
  proxy_set_header X-Emby-Token "";
  proxy_set_header Cookie "";
  # No client address: the webhook is local_only and must see nginx itself
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Host "localhost";
  proxy_pass http://127.0.0.1:8123/api/webhook/bizon_wake_jellyfin;
}

location @bizon_wake {
  default_type text/html;
  content_by_lua_block {
    local b = require "bizon_wake"
    local function unavailable()
      ngx.status = 503
      ngx.header["Retry-After"] = "15"
      ngx.header["Cache-Control"] = "no-store"
      ngx.say('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="15">',
              '<title>Jellyfin</title><p>Бізон прокидається, сторінка оновиться сама…</p>')
    end
    -- Background traffic must not wake Bizon. A WebSocket cannot follow the 307
    -- anyway, and an open tab or app retries it all night.
    if ngx.var.uri == "/socket" then
      return unavailable()
    end
    -- Android TV home-row worker (hourly, no Sessions/Capabilities): these requests
    -- only wait, so they still succeed if the person at the TV woke Bizon.
    local worker = {["/UserItems/Resume"]=true, ["/Shows/NextUp"]=true, ["/Items/Latest"]=true, ["/UserViews"]=true}
    local passive = worker[ngx.var.uri]
      and (ngx.var.http_user_agent or ""):find("Jellyfin Android TV", 1, true)
    if not passive then
      -- Remember the wake, so the first real use after it confirms it (log phase)
      local d = ngx.shared.bizon_wake
      d:set("woke", true, 300)
      d:delete("confirmed")
      ngx.location.capture("/__bizon_wake", {method = ngx.HTTP_POST, body = b.client()})
    end
    local deadline = ngx.now() + (passive and 15 or 45)
    while ngx.now() < deadline do
      local sock = ngx.socket.tcp()
      sock:settimeout(1000)
      if sock:connect("192.168.1.4", 8096) then
        sock:close()
        -- 307: the client repeats the same request, now to a live Bizon
        return ngx.redirect(ngx.var.request_uri, 307)
      end
      ngx.sleep(2)
    end
    unavailable()
  }
}

# Within 5 min of a wake, the first answered request that a person makes
# (not bizon_wake.background) tells HA the wake was real. Without it HA puts
# Bizon back to sleep (bizon_autosuspend.yaml).
log_by_lua_block {
  local d = ngx.shared.bizon_wake
  if not d:get("woke") then return end
  local s = ngx.status
  if not ((s >= 200 and s < 300) or s == 304) then return end
  local b = require "bizon_wake"
  if b.background(ngx.var.uri) then return end
  if not d:add("confirmed", true, 300) then return end
  d:delete("woke")
  b.post("bizon_jellyfin_confirmed", b.client())
}
