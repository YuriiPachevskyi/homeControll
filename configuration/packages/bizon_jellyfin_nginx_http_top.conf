# NPM http-level include (~/docker/lampa/data/nginx/custom/http_top.conf), used
# by the advanced config of jf.yuriip4.duckdns.org (bizon_jellyfin_nginx.conf) and
# of the Bizon web UI hosts (bizon_web_nginx.conf).
lua_shared_dict bizon_wake 1m;

# Jellyfin app-start answers served while Bizon sleeps (bizon_jellyfin_nginx.conf)
proxy_cache_path /data/nginx/cache/bizon_jf levels=1:2 keys_zone=bizon_jf_start:1m
                 max_size=20m inactive=60d use_temp_path=off;

# Jellyfin images (posters, backdrops, logos), served while Bizon sleeps
proxy_cache_path /data/nginx/cache/bizon_jf_img levels=1:2 keys_zone=bizon_jf_img:10m
                 max_size=2g inactive=60d use_temp_path=off;

init_by_lua_block {
  local cjson = require "cjson.safe"
  local M = {}

  -- Client, Device and DeviceId from the Jellyfin auth header (the Token is
  -- never read out)
  local function auth_fields()
    local f = {}
    local auth = ngx.var.http_authorization or ngx.var.http_x_emby_authorization or ""
    for k, v in auth:gmatch('(%w+)="([^"]*)"') do f[k] = ngx.unescape_uri(v) end
    return f
  end
  local function seen_key()
    return "seen:" .. (ngx.var.remote_addr or "") .. "|" .. (ngx.var.http_user_agent or "")
  end

  -- Log phase of every Jellyfin request: the device behind this IP + User-Agent,
  -- for its later requests that carry no auth header (Android TV app start)
  function M.remember()
    M.track_pause()
    local f = auth_fields()
    if not f.DeviceId then return end
    local v = cjson.encode({Client = f.Client, Device = f.Device, DeviceId = f.DeviceId})
    local d = ngx.shared.bizon_wake
    local k = seen_key()
    if d:get(k) ~= v then d:set(k, v, 30 * 86400) end
    -- By address alone, for the player's requests that have another
    -- User-Agent (bare okhttp stream requests of the Android TV app)
    local ki = "seenip:" .. (ngx.var.remote_addr or "")
    if d:get(ki) ~= v then d:set(ki, v, 30 * 86400) end
  end

  -- Who sent the request: Jellyfin clients put Client, Device and DeviceId in
  -- the auth header, even before login; without one, what M.remember saw last
  -- from the same IP + User-Agent (seen = true).
  function M.client()
    local f = auth_fields()
    local seen = nil
    if not f.DeviceId then
      local d = ngx.shared.bizon_wake
      local s = d:get(seen_key()) or d:get("seenip:" .. (ngx.var.remote_addr or ""))
      local g = s and cjson.decode(s)
      if g then f, seen = g, true end
    end
    local ua = ngx.var.http_user_agent or ""
    local platform = ua:find("Android TV/", 1, true) and "Android TV"
      or ua:find("iPhone", 1, true) and "iPhone" or ua:find("iPad", 1, true) and "iPad"
      or ua:find("Macintosh", 1, true) and "Mac" or ua:find("Android", 1, true) and "Android"
      or ua:find("Windows", 1, true) and "Windows" or ua:find("Linux", 1, true) and "Linux"
      or ua:find("okhttp", 1, true) and "Android" or "?"
    return cjson.encode({path = ngx.var.uri, client = f.Client, device = f.Device,
                         device_id = f.DeviceId, os = platform, seen = seen})
  end

  -- Requests that apps, open tabs and the Android TV launcher send by
  -- themselves. They neither confirm a wake nor (mostly) cause one.
  -- Lower case: Jellyfin paths are case-insensitive (the web login page asks
  -- for /users/public)
  local exact = {["/"] = true, ["/socket"] = true, ["/users/me"] = true, ["/userviews"] = true,
    ["/useritems/resume"] = true, ["/shows/nextup"] = true, ["/items/latest"] = true,
    ["/items/counts"] = true, ["/quickconnect/enabled"] = true, ["/scheduledtasks"] = true,
    ["/playback/bitratetest"] = true}
  local prefixes = {"/web/", "/branding/", "/system/", "/displaypreferences/", "/clientlog/"}
  function M.background(uri)
    uri = uri:lower()
    if exact[uri] or uri:match("^/users/[%w%-]+$") or uri:match("^/items/[%w%-]+/images/") then
      return true
    end
    for _, p in ipairs(prefixes) do
      if uri:sub(1, #p) == p then return true end
    end
    return false
  end

  -- Requests that never wake a sleeping Bizon (instant 503):
  -- /socket: a WebSocket cannot follow the 307, and an open tab retries it all night;
  -- /clientlog/: crash reports the Android TV app uploads when it starts by itself
  -- (it keeps the report and sends it again later);
  -- /items/*/images/: the TV launcher fetches posters of the Jellyfin rows by
  -- itself when the TV is switched on (2026-11-08), the app's screensaver
  -- fetches backdrops; a person opening the app sends other requests too.
  -- Cached images are still served (bizon_jf_img, bizon_jellyfin_nginx.conf).
  --
  -- A device that paused playback cannot wake Bizon (2026-11-09: a paused
  -- Android TV player reports progress every 15 s, its screensaver fetches
  -- images, and autosuspend and wake looped every ~7 min for hours). Until it
  -- presses play (Progress with IsPaused not true), starts playing something
  -- (POST /Sessions/Playing) or the app is opened again (POST
  -- /Sessions/Capabilities), nothing it sends wakes Bizon. Stopping clears the
  -- pause too. Pauses are learnt in the log phase while Bizon answers (M.remember).
  -- Requests without a DeviceId are matched by the client address.
  local PAUSE_TTL = 12 * 3600
  -- read: false in the log phase (read_body is not allowed there; the proxy
  -- has read the body already)
  local function body_paused(read)
    if read then ngx.req.read_body() end
    local data = ngx.req.get_body_data()
    local j = data and cjson.decode(data)
    return type(j) == "table" and j.IsPaused == true
  end
  local function pause_keys()
    local f = auth_fields()
    if not f.DeviceId then
      local s = ngx.shared.bizon_wake:get(seen_key())
      local g = s and cjson.decode(s)
      if g then f = g end
    end
    return f.DeviceId and ("paused:dev:" .. f.DeviceId), "paused:ip:" .. (ngx.var.remote_addr or "")
  end
  local function set_paused(on)
    local d = ngx.shared.bizon_wake
    local dev, ip = pause_keys()
    local was = d:get(dev or ip) == true
    for _, k in ipairs({dev, ip}) do
      if on then d:set(k, true, PAUSE_TTL) else d:delete(k) end
    end
    if was ~= on then
      ngx.log(ngx.WARN, "bizon pause ", on and "on" or "off", ": ", dev or ip, " (", ngx.var.uri, ")")
    end
  end
  local function is_paused()
    local d = ngx.shared.bizon_wake
    local dev, ip = pause_keys()
    if dev then return d:get(dev) == true end
    return d:get(ip) == true
  end
  -- Log phase of an answered request
  local function track_pause()
    local s = ngx.status
    if s < 200 or s >= 300 or ngx.req.get_method() ~= "POST" then return end
    local uri = ngx.var.uri:lower()
    if uri == "/sessions/playing/progress" then
      set_paused(body_paused(false))
    elseif uri == "/sessions/playing" or uri == "/sessions/playing/stopped"
        or uri:sub(1, 22) == "/sessions/capabilities" then
      set_paused(false)
    end
  end

  M.track_pause = track_pause

  local playing_report = {["/sessions/playing/progress"] = true,
    ["/sessions/playing/ping"] = true, ["/sessions/playing/stopped"] = true}
  -- Called in @bizon_wake, while Bizon sleeps
  function M.no_wake(uri)
    uri = uri:lower()
    if uri == "/socket" or uri:sub(1, 11) == "/clientlog/"
        or uri:match("^/items/[%w%-]+/images/") then
      return true
    end
    -- In-app screensaver of the Android TV app (idle home screen or paused
    -- player): random items with backdrops, then their images
    local args = (ngx.var.args or ""):lower()
    if uri == "/items" and args:find("sortby=random", 1, true)
        and args:find("imagetypes=backdrop", 1, true) then
      return true
    end
    local post = ngx.req.get_method() == "POST"
    -- Play pressed: wakes. Still paused, Ping: never.
    if post and uri == "/sessions/playing/progress" then
      return body_paused(true)
    end
    if post and uri == "/sessions/playing/stopped" then
      set_paused(false)
      return true
    end
    if playing_report[uri] then return true end
    if is_paused() then
      if post and (uri == "/sessions/playing" or uri:sub(1, 22) == "/sessions/capabilities") then
        return false
      end
      return true
    end
    return false
  end

  -- POST to a local HA webhook from a timer (log phase cannot do subrequests)
  local function post(premature, hook, body)
    if premature then return end
    local sock = ngx.socket.tcp()
    sock:settimeout(3000)
    if not sock:connect("127.0.0.1", 8123) then return end
    sock:send("POST /api/webhook/" .. hook .. " HTTP/1.0\r\nHost: localhost\r\n" ..
              "Content-Type: application/json\r\nContent-Length: " .. #body .. "\r\n\r\n" .. body)
    sock:receive("*l")
    sock:close()
  end
  function M.post(hook, body) ngx.timer.at(0, post, hook, body) end

  -- Web UIs of Bizon behind rpi4: js/rd/sr/qb/bzpr/bzpl.yuriip4.duckdns.org
  -- (bizon_web_nginx.conf). Only opening a page wakes Bizon; what an open tab
  -- sends by itself (qBittorrent sync/maindata, *arr queue/command, SignalR)
  -- neither wakes it nor keeps it awake.
  function M.web_nav()
    local mode = ngx.var.http_sec_fetch_mode
    if mode then return mode == "navigate" end
    return ngx.req.get_method() == "GET"
      and (ngx.var.http_accept or ""):find("text/html", 1, true) ~= nil
  end

  -- Polling of open tabs, from Bizon's NPM logs (2026-11-02). Lower case.
  local web_poll = {
    -- qBittorrent
    "^/api/v2/sync/", "^/api/v2/transfer/info", "^/api/v2/torrents/files",
    "^/api/v2/torrents/properties", "^/api/v2/torrents/trackers",
    "^/api/v2/torrents/webseeds", "^/api/v2/torrents/piecestates",
    -- Radarr, Sonarr, Prowlarr
    "^/api/v%d/command", "^/api/v%d/queue", "^/api/v%d/health",
    "^/api/v%d/system/status", "^/api/v%d/indexerstatus",
    -- Jellyseerr
    "^/api/v1/status", "^/api/v1/request/count", "^/api/v1/issue/count",
    "^/api/v1/auth/me", "^/api/v1/settings/public",
    -- Portainer
    "^/api/status", "^/api/users/me", "^/api/users/admin/check",
    "^/api/settings/public", "^/api/motd"}

  -- A person using the page: opening it, a change (POST, PUT, DELETE) or an
  -- API read the page does not repeat by itself (a search, a movie)
  function M.web_use()
    local uri = ngx.var.uri:lower()
    -- SignalR (*arr) reconnects by itself, with a POST
    if uri:sub(1, 9) == "/signalr/" then return false end
    local m = ngx.req.get_method()
    if m ~= "GET" and m ~= "HEAD" and m ~= "OPTIONS" then return true end
    if M.web_nav() then return true end
    if uri:sub(1, 5) ~= "/api/" then return false end
    for _, p in ipairs(web_poll) do
      if uri:find(p) then return false end
    end
    return true
  end

  -- @bizon_wake of a web UI host: port = its port on Bizon, name = the app
  function M.web_wake(port, name)
    ngx.ctx.bizon_waking = true
    ngx.header["Cache-Control"] = "no-store"
    if not M.web_nav() then
      ngx.status = 503
      ngx.header["Retry-After"] = "30"
      ngx.header["Content-Type"] = "text/plain; charset=utf-8"
      ngx.say("Bizon is asleep")
      return
    end
    local d = ngx.shared.bizon_wake
    d:set("woke", true, 300)
    d:delete("confirmed")
    ngx.location.capture("/__bizon_wake", {method = ngx.HTTP_POST,
      body = cjson.encode({path = ngx.var.uri, service = name})})
    local deadline = ngx.now() + 45
    while ngx.now() < deadline do
      local sock = ngx.socket.tcp()
      sock:settimeout(1000)
      if sock:connect("192.168.1.4", port) then
        sock:close()
        return ngx.redirect(ngx.var.request_uri, 307)
      end
      ngx.sleep(2)
    end
    ngx.status = 503
    ngx.header["Retry-After"] = "15"
    ngx.header["Content-Type"] = "text/html; charset=utf-8"
    ngx.say('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="15">',
            '<title>', name, '</title><p>Бізон прокидається, сторінка оновиться сама…</p>')
  end

  -- Log phase of a web UI host: remembers the last real use (web_idle) and,
  -- like Jellyfin, confirms a wake to HA
  function M.web_log(name)
    if ngx.ctx.bizon_waking then return end
    local s = ngx.status
    if s < 200 or s >= 400 then return end
    if not M.web_use() then return end
    local d = ngx.shared.bizon_wake
    d:set("web_active", ngx.now())
    if d:get("woke") and d:add("confirmed", true, 300) then
      d:delete("woke")
      M.post("bizon_jellyfin_confirmed", cjson.encode({path = ngx.var.uri, device = name}))
    end
  end

  -- Seconds since the last real use of a web UI (-1: none since nginx started)
  function M.web_idle()
    local t = ngx.shared.bizon_wake:get("web_active")
    ngx.header["Content-Type"] = "text/plain"
    ngx.header["Cache-Control"] = "no-store"
    ngx.say(t and math.floor(ngx.now() - t) or -1)
  end

  package.loaded.bizon_wake = M
}
