# NPM http-level include (~/docker/lampa/data/nginx/custom/http_top.conf), used
# by the advanced config of jf.yuriip4.duckdns.org (bizon_jellyfin_nginx.conf).
lua_shared_dict bizon_wake 1m;

init_by_lua_block {
  local cjson = require "cjson.safe"
  local M = {}

  -- Who sent the request: Jellyfin clients put Client, Device and DeviceId in
  -- the auth header, even before login. The Token is never passed on.
  function M.client()
    local f = {}
    local auth = ngx.var.http_authorization or ngx.var.http_x_emby_authorization or ""
    for k, v in auth:gmatch('(%w+)="([^"]*)"') do f[k] = ngx.unescape_uri(v) end
    local ua = ngx.var.http_user_agent or ""
    local platform = ua:find("Jellyfin Android TV", 1, true) and "Android TV"
      or ua:find("iPhone", 1, true) and "iPhone" or ua:find("iPad", 1, true) and "iPad"
      or ua:find("Macintosh", 1, true) and "Mac" or ua:find("Android", 1, true) and "Android"
      or ua:find("Windows", 1, true) and "Windows" or ua:find("Linux", 1, true) and "Linux" or "?"
    return cjson.encode({path = ngx.var.uri, client = f.Client, device = f.Device,
                         device_id = f.DeviceId, os = platform})
  end

  -- Requests that apps, open tabs and the Android TV launcher send by
  -- themselves. They neither confirm a wake nor (mostly) cause one.
  -- Lower case: Jellyfin paths are case-insensitive (the web login page asks
  -- for /users/public)
  local exact = {["/"] = true, ["/socket"] = true, ["/users/me"] = true, ["/userviews"] = true,
    ["/useritems/resume"] = true, ["/shows/nextup"] = true, ["/items/latest"] = true,
    ["/items/counts"] = true, ["/quickconnect/enabled"] = true, ["/scheduledtasks"] = true,
    ["/playback/bitratetest"] = true}
  local prefixes = {"/web/", "/branding/", "/system/", "/displaypreferences/"}
  function M.background(uri)
    uri = uri:lower()
    if exact[uri] or uri:match("^/users/[%w%-]+$") or uri:match("^/items/[%w%-]+/images/") then
      return true
    end
    for _, p in ipairs(prefixes) do
      if uri:sub(1, #p) == p then return true end
    end
    return false
  end

  -- POST to a local HA webhook from a timer (log phase cannot do subrequests)
  local function post(premature, hook, body)
    if premature then return end
    local sock = ngx.socket.tcp()
    sock:settimeout(3000)
    if not sock:connect("127.0.0.1", 8123) then return end
    sock:send("POST /api/webhook/" .. hook .. " HTTP/1.0\r\nHost: localhost\r\n" ..
              "Content-Type: application/json\r\nContent-Length: " .. #body .. "\r\n\r\n" .. body)
    sock:receive("*l")
    sock:close()
  end
  function M.post(hook, body) ngx.timer.at(0, post, hook, body) end

  package.loaded.bizon_wake = M
}
