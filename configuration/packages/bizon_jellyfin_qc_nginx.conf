# --- Jellyfin Google / QR login (OPTIONAL; password login, apps and API untouched) ---
# Built on Jellyfin's own Quick Connect. A device shows a code (TV/phone app: "Quick Connect" button;
# web login page: QR + code from /__jfqc/ui.js), the person opens https://jf.yuriip4.duckdns.org/qc on a
# phone, signs in with Google (oauth2-proxy-lp :4183, emails-lp.txt, shared with Lampa) and confirms;
# nginx authorizes the code for the mapped Jellyfin user with the admin API key. Every device gets its
# own Jellyfin session. Template: homeControll packages/bizon_jellyfin_qc_nginx.conf, deployed by
# bizon_jellyfin_qc_deploy.py (fills __KEY__ and the user table; re-run after user changes).
location /oauth2/ {
  proxy_pass http://127.0.0.1:4183;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Scheme $scheme;
  proxy_set_header X-Auth-Request-Redirect $request_uri;
}
location = /oauth2/auth {
  internal;
  proxy_pass http://127.0.0.1:4183;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Scheme $scheme;
  proxy_set_header Content-Length "";
  proxy_pass_request_body off;
}
location @jfqc_login {
  return 302 /oauth2/start?rd=$scheme://$host$request_uri;
}
location = /__jfqc/ui.js {
  alias /data/nginx/custom/jfqc-ui.js;
  default_type application/javascript;
  add_header Cache-Control "no-cache";
}
location = /__jfqc/authorize {
  internal;
  proxy_set_header Authorization 'MediaBrowser Token="__KEY__"';
  proxy_set_header Content-Length "";
  proxy_pass_request_body off;
  proxy_connect_timeout 3s;
  proxy_pass http://192.168.1.4:8096/QuickConnect/Authorize$is_args$args;
}
location = /qc {
  auth_request /oauth2/auth;
  auth_request_set $jfqc_email $upstream_http_x_auth_request_email;
  error_page 401 = @jfqc_login;
  default_type text/html;
  content_by_lua_block {
    ngx.header["Cache-Control"] = "no-store"
    -- Google email -> { legacy token (unused), Jellyfin user id, Jellyfin user name }
    local U = {
    -- allow_access:jellyfin:begin
__USERS__
    -- allow_access:jellyfin:end
    }
    local function esc(s) return (tostring(s or ""):gsub("[<>&\"']", function(x) return "&#" .. x:byte() .. ";" end)) end
    local function page(title, body)
      ngx.say('<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
        .. '<title>Jellyfin</title><style>body{font-family:-apple-system,system-ui,sans-serif;background:#101010;color:#eee;margin:0;padding:2em 1.2em;text-align:center}'
        .. 'h1{font-size:1.5em}p{font-size:1.1em;line-height:1.5;color:#ccc}input{font-size:2.6em;font-weight:700;width:6.5em;max-width:90%;text-align:center;letter-spacing:.2em;padding:.4em .3em;margin-top:.3em;border-radius:.3em;border:3px solid #00a4dc;background:#fff;color:#000}'
        .. 'button,a.b{display:inline-block;font-size:1.2em;padding:.8em 1.6em;margin-top:1em;border:0;border-radius:.5em;background:#00a4dc;color:#fff;text-decoration:none}</style></head><body>'
        .. '<h1>' .. title .. '</h1>' .. body .. '</body></html>')
    end
    local e = (ngx.var.jfqc_email or ""):lower()
    local u = U[e]
    if not u then
      ngx.status = 403
      page("Немає доступу", "<p>Для " .. esc(e) .. " немає акаунта Jellyfin.</p>")
      return
    end
    local name = u[3] or e:match("^[^@]+")
    local function norm(c) c = tostring(c or ""):gsub("[^%w]", ""); if #c >= 4 and #c <= 12 then return c end end
    if ngx.req.get_method() == "POST" then
      local me = "https://" .. ngx.var.host
      local o = ngx.var.http_origin or ""
      local r = ngx.var.http_referer or ""
      if not (o == me or (o == "" and r:sub(1, #me + 1) == me .. "/")) then
        ngx.status = 403; page("Помилка", "<p>Неправильне джерело запиту.</p>"); return
      end
      ngx.req.read_body()
      local a = ngx.req.get_post_args() or {}
      local c = norm(a.c)
      if not c then page("Неправильний код", '<p>Введіть код із екрана.</p><a class="b" href="/qc">Назад</a>'); return end
      local res = ngx.location.capture("/__jfqc/authorize", { method = ngx.HTTP_POST, args = { code = c, userId = u[2] } })
      if res.status == 200 or res.status == 204 then
        if a.r == "1" then
          page("Готово", "<p>Вхід як <b>" .. esc(name) .. "</b>…</p><script>location.replace('/web/')</script>")
        else
          page("Готово", "<p>Пристрій увійде в Jellyfin як <b>" .. esc(name) .. "</b> за кілька секунд.</p>")
        end
      elseif res.status == 404 or res.status == 400 then
        page("Код не знайдено", "<p>Код застарів або введений з помилкою. Відкрийте Quick Connect на пристрої ще раз.</p>"
          .. '<a class="b" href="/qc">Ввести інший код</a>')
      else
        page("Сервер недоступний", "<p>Jellyfin зараз не відповідає (" .. res.status .. "), можливо, Bizon прокидається. Спробуйте ще раз за хвилину.</p>"
          .. '<a class="b" href="/qc?c=' .. c .. '">Спробувати ще</a>')
      end
      return
    end
    local c = norm(ngx.var.arg_c) or ""
    local r = ngx.var.arg_r == "1" and "1" or ""
    page("Вхід у Jellyfin",
      "<p>Увійти на пристрої як <b>" .. esc(name) .. "</b>.</p>"
      .. (c == "" and "<p>На телевізорі чи в застосунку Jellyfin натисніть «Quick Connect» (Швидке підключення) і введіть код, який з'явиться.</p>" or "")
      .. '<form id="f" method="post" action="/qc"><input name="c" value="' .. c .. '" inputmode="numeric" autocomplete="off" placeholder="код" required>'
      .. '<input type="hidden" name="r" value="' .. r .. '"><br><button type="submit">Увійти</button></form>'
      -- same-tab "Увійти через Google": the login page left its own code in sessionStorage -> no extra click
      .. "<script>try{var p=JSON.parse(sessionStorage.getItem('jfqc')||'null');if(p&&p.code==" .. ("%q"):format(c) .. "&&'" .. r .. "'=='1')document.getElementById('f').submit()}catch(x){}</script>")
  }
}
# Inject /__jfqc/ui.js into the Jellyfin web page (every client loading /web/ from this host).
access_by_lua_block {
  local uri = ngx.var.uri
  if uri ~= "/web/" and uri ~= "/web/index.html" then return end
  ngx.ctx.jfqc = true
  ngx.req.set_header("Accept-Encoding", "")
  ngx.req.clear_header("If-None-Match")
  ngx.req.clear_header("If-Modified-Since")
}
header_filter_by_lua_block {
  if ngx.ctx.jfqc and (ngx.header.content_type or ""):find("text/html", 1, true) then
    ngx.ctx.jfqc_body = true
    ngx.header.content_length = nil
    ngx.header.etag = nil
    ngx.header["Cache-Control"] = "no-store"
  end
}
body_filter_by_lua_block {
  if not ngx.ctx.jfqc_body or ngx.ctx.jfqc_done or not ngx.arg[1] then return end
  local b, n = ngx.arg[1]:gsub("<head>", '<head><script src="/__jfqc/ui.js" defer></script>', 1)
  if n > 0 then ngx.arg[1] = b; ngx.ctx.jfqc_done = true end
}
# --- end Jellyfin Google / QR login ---
