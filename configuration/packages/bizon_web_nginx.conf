# Advanced config of the Nginx Proxy Manager hosts of Bizon's web UIs on rpi4:
#   js.yuriip4.duckdns.org   -> 192.168.1.4:5055 Jellyseerr
#   rd.yuriip4.duckdns.org   -> 192.168.1.4:7878 Radarr
#   sr.yuriip4.duckdns.org   -> 192.168.1.4:8989 Sonarr
#   qb.yuriip4.duckdns.org   -> 192.168.1.4:8080 qBittorrent
#   bzpr.yuriip4.duckdns.org -> 192.168.1.4:9000 Portainer
#   bzpl.yuriip4.duckdns.org -> 192.168.1.4:9696 Prowlarr
# (pr/pl/im.yuriip4 are rpi4's own Portainer, Prowlarr and Immich.)
# Reference copy with __PORT__ and __NAME__ for the port and the app; NPM keeps
# the live ones in its database (proxy hosts 13-18). Lua is in
# bizon_jellyfin_nginx_http_top.conf (/data/nginx/custom/http_top.conf).
# A sleeping Bizon wakes only when a page is opened (bizon_wake.web_nav); a real
# use keeps it awake 15 min through /__bizon_idle (bizon_autosuspend.yaml).
proxy_connect_timeout 3s;
error_page 502 504 = @bizon_wake;

location = /__bizon_wake {
  internal;
  proxy_method POST;
  proxy_set_header Content-Type "application/json";
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  # No client address: the webhook is local_only and must see nginx itself
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Host "localhost";
  proxy_pass http://127.0.0.1:8123/api/webhook/bizon_wake_jellyfin;
}

# Seconds since the last real use of any of these UIs, read by Bizon's
# ~/.local/bin/bizon-ssh-sessions
location = /__bizon_idle {
  allow 192.168.1.4;
  deny all;
  content_by_lua_block { require("bizon_wake").web_idle() }
}

location @bizon_wake {
  default_type text/html;
  content_by_lua_block { require("bizon_wake").web_wake(__PORT__, "__NAME__") }
}

log_by_lua_block { require("bizon_wake").web_log("__NAME__") }
