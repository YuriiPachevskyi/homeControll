# Boiler and heating TENs (switch.156x_*, i2c_relay): all off on HA start,
# relay-time x power energy estimate for the Energy dashboard.
# Boiler mode (input_select.boiler_mode, Home boiler row, tap to switch):
#  - Sun: the power load cascade heats it from PV surplus only.
#  - Night: the same in the day, and in the night charge window
#    (binary_sensor.night_charge_window, 23:10-06:30) the 0.8 kW TEN heats
#    from the grid; from 05:00, if the boiler still draws power (its
#    thermostat has not opened), the 1.2 kW TEN joins (2.0 kW). It starts at
#    23:10 on purpose, not just before the morning: the tank loses only
#    ~0.05 kWh/h, and a morning grid outage would leave the water cold.
#    Meanwhile deye_state_controller holds both batteries at
#    their current SOC (min SOC = SOC, nothing is discharged) and the cascade
#    does not count the grid import as an overload. No grid (5kW grid voltage
#    < 150 V) ends it at once: TENs off, min SOC back to normal; it resumes
#    1 min after the grid is back.
# The "Бойлер нагрівся" notification is in packages/notify.yaml.
automation:
  - id: '1731862602452'
    alias: Update switches state on startup
    description: ''
    triggers:
    - trigger: homeassistant
      event: start
    conditions: []
    actions:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.1562_heating_main
        - switch.1561_boiler_ten_1_2_kwh
        - switch.1563_heating_ten_1_5_kwh
        - switch.1564_heating_ten_3_kwh
        - switch.1560_boiler_ten_0_8_kwh
    mode: single
  - id: '1788815476602'
    alias: Boiler Energy Sensor Refresh
    description: 'Keeps the boiler energy tracking from stalling. sensor.boiler_ten_power_estimate
      only re-renders when the boiler switches change state, so the integration (Riemann
      sum) sensor gets no new sample - and no accumulated energy - during a long continuous
      on/off stretch: it is refreshed every 30 minutes so long stretches accumulate
      smoothly. After a HA restart the template/integration chain can also get stuck
      on "unknown" until something forces a re-render, so on startup it waits 30 seconds,
      reloads the templates and then refreshes.'
    triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: time_pattern
      minutes: /30
      id: periodic
    conditions: []
    actions:
    - if:
      - condition: trigger
        id: startup
      then:
      - delay: 00:00:30
      - action: template.reload
        data: {}
      - delay: 00:00:03
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.boiler_ten_power_estimate
      data: {}
    mode: queued

  - id: boiler_night_heating
    alias: Boiler night heating
    description: >-
      Boiler mode Night: while binary_sensor.boiler_night_heating is on (night
      charge window, grid present) the 0.8 kW TEN heats from the grid; from
      05:00 the 1.2 kW TEN joins if the boiler still draws power. Both off when
      it ends. Re-checked every 10 min (not while overloaded) and after HA start.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: binary_sensor.boiler_night_heating
        to: "on"
        id: keep
      - trigger: state
        entity_id: binary_sensor.boiler_night_heating
        from: "on"
        to: "off"
        id: stop
      - trigger: time_pattern
        minutes: "/10"
        id: keep
      - trigger: time
        at: "05:00:00"
        id: keep
      # After "Update switches state on startup" has turned them off
      - trigger: homeassistant
        event: start
        id: keep
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: keep
              - condition: state
                entity_id: binary_sensor.boiler_night_heating
                state: "on"
              - condition: state
                entity_id: binary_sensor.any_device_high_power
                state: "off"
            sequence:
              - delay: "00:00:{{ '15' if trigger.platform == 'homeassistant' else '00' }}"
              - variables:
                  # Stays on once on; before 05:00 only the 0.8 kW TEN
                  boost: >-
                    {{ '05:00' <= now().strftime('%H:%M') < '12:00'
                       and (is_state('switch.1561_boiler_ten_1_2_kwh', 'on')
                            or states('sensor.boiler_ten_power_estimate') | float(0) > 0) }}
                  changed: >-
                    {{ is_state('switch.1560_boiler_ten_0_8_kwh', 'off')
                       or is_state('switch.1561_boiler_ten_1_2_kwh', 'on' if not boost else 'off') }}
              - condition: template
                value_template: "{{ changed }}"
              - action: switch.turn_on
                target:
                  entity_id: switch.1560_boiler_ten_0_8_kwh
              - action: switch.turn_{{ 'on' if boost else 'off' }}
                target:
                  entity_id: switch.1561_boiler_ten_1_2_kwh
              - action: input_text.set_value
                target:
                  entity_id: input_text.last_script_trigger
                data:
                  value: >-
                    {% set m %}Boiler night: {{ '2.0kW (still heating at 05:00)' if boost else '0.8kW' }} ON (grid){% endset %}{{ m if m != states('input_text.last_script_trigger') else m ~ now().strftime(' (%H:%M:%S)') }}
          - conditions:
              - condition: trigger
                id: stop
            sequence:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.1560_boiler_ten_0_8_kwh
                    - switch.1561_boiler_ten_1_2_kwh
              - action: input_text.set_value
                target:
                  entity_id: input_text.last_script_trigger
                data:
                  value: >-
                    {% set m %}Boiler night: OFF ({{ 'no grid' if is_state('binary_sensor.night_charge_window', 'on') and is_state('input_select.boiler_mode', 'Night') else 'window end' if is_state('input_select.boiler_mode', 'Night') else 'mode Sun' }}){% endset %}{{ m if m != states('input_text.last_script_trigger') else m ~ now().strftime(' (%H:%M:%S)') }}

template:
  - sensor:
      - name: "Boiler TEN Power Estimate"
        unique_id: boiler_ten_power_estimate
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {# Relay on = rated TEN power, but only while the 6kW load (the
             boiler hangs on its LOAD port) actually shows it. When the
             boiler's own thermostat opens the circuit the relay stays on
             and the load drops to the house baseline - count 0 then.
             Threshold 0.6 * P + 250 W: the baseline can be ~500-700 W in the
             day (oven, etc.), a plain P / 2 then never saw the 0.8 kW TEN
             as off. Heating is at least P + ~100 W of night baseline. #}
          {% set ns = namespace(p=0) %}
          {% if is_state('switch.1560_boiler_ten_0_8_kwh', 'on') %}
            {% set ns.p = ns.p + 800 %}
          {% endif %}
          {% if is_state('switch.1561_boiler_ten_1_2_kwh', 'on') %}
            {% set ns.p = ns.p + 1200 %}
          {% endif %}
          {% set load = states('sensor.deye_6kw_load_power') | float(ns.p) %}
          {{ 0 if load < ns.p * 0.6 + 250 else [ns.p, load] | min | round(0) }}
        availability: >
          {{ states('switch.1560_boiler_ten_0_8_kwh') not in ['unknown', 'unavailable'] and
             states('switch.1561_boiler_ten_1_2_kwh') not in ['unknown', 'unavailable'] }}

      - name: "Boiler TEN Energy Total"
        unique_id: boiler_ten_energy_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# Adds the manually-backfilled Sep 1-7 baseline (16.70755 kWh) to the
             live Riemann-integrated value, so the running total stays continuous
             across HA restarts instead of the raw integration sensor's own value
             (which restarts from 0 and would overwrite recorder statistics).
             Clamped against its own last reported value so a post-restart
             blip (the estimate sensor briefly reporting stale/zeroed data
             while the template/integration chain re-renders) can never make
             this total_increasing sensor go backwards - a real decrease here
             gets read by the recorder as a meter reset and zeroes the
             recorded statistics sum (happened 2026-09-07/08). Holding the
             last value steady during a blip is self-healing: once the
             estimate is valid again, tracking just resumes from there. #}
          {% set computed = (16.70755 + (states('sensor.boiler_ten_energy_estimate') | float(0))) | round(4) %}
          {% set last = states('sensor.boiler_ten_energy_total') | float(computed) %}
          {{ [computed, last] | max }}
        availability: "{{ is_number(states('sensor.boiler_ten_energy_estimate')) }}"

  - binary_sensor:
      # Boiler mode Night, night charge window and the grid is there (5 s
      # 5kW grid voltage; while it is unavailable the 30 s grid sensor)
      - name: "Boiler night heating"
        unique_id: boiler_night_heating
        default_entity_id: binary_sensor.boiler_night_heating
        icon: mdi:water-boiler
        delay_on: "00:01:00"
        state: >-
          {% set v = states('sensor.deye_5kw_grid_l1_voltage') %}
          {% set grid = v | float(0) >= 150 if v | is_number
                        else is_state('binary_sensor.deye_5kw_grid', 'on') %}
          {{ is_state('input_select.boiler_mode', 'Night')
             and is_state('binary_sensor.night_charge_window', 'on')
             and grid }}

sensor:
  - platform: integration
    source: sensor.boiler_ten_power_estimate
    name: boiler_ten_energy_estimate
    unit_prefix: k
    # Step-shaped source (0 <-> rated W): trapezoidal would count half the
    # rated power over the whole idle gap before every switch-on.
    method: left


utility_meter:
  boiler_ten_energy_estimate_daily:
    source: sensor.boiler_ten_energy_estimate
    cycle: daily

input_select:
  boiler_mode:
    name: "Boiler mode"
    icon: mdi:water-boiler
    options:
      - Sun
      - Night
