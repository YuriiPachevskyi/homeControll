# Winter: keep the Deye 6kW off when it has nothing to do, to save its own
# consumption. Only reminders - the user switches the inverter by hand.
# The front-panel button is the only way to switch it: the solarman on/off
# switch (register 0x002B) is ignored by this inverter (tested 2026-10-19), and
# after a button power-off that switch still reads "on" while the logger stays
# online and the device state is Standby - so the state is what counts here.
# Evening (once a day, only while the 6kW is Normal, 16:00-22:00): its
# battery is at 35 % or less AND its PV no longer produces (while the sun
# still charges it there is no point) -> "turn the 6kW off". Checked when the
# SOC falls to 35 %, when the PV stops and at 16:00 (a night drop is reported
# the next day, once the sun is gone).
# Morning (only while the 6kW is not Normal): "turn the 6kW on" at 07:20 (the
# mother-in-law leaves for work every 4th day and turns it on then), again when
# the 5kW PV (PV1+PV2, its own PV is 0 while it is off) reaches 70 W, then
# every 10 min until it is on (up to 15:00). Each one deletes the previous
# reminder, so the chat keeps only the latest.
# All reminders go to Nataliya only (she is at home with the inverter); a
# single-chat message is kept in the notify log only with keep_single (marked
# "→ Наталія" there); the previous morning reminder is deleted by its own saved
# message id and its log row replaced.
# Season = binary_sensor.summer_season off (packages/season.yaml).
input_datetime:
  # Last day the evening reminder was sent (once a day, survives restarts)
  deye_6kw_off_reminded:
    name: "Deye 6kW off reminded"
    has_date: true
    has_time: false
  # Last PV "turn on" reminder, for the 10 min repeat
  deye_6kw_on_reminded:
    name: "Deye 6kW on reminded"
    has_date: true
    has_time: true

input_text:
  # "<chat_id> <message_id>" of the last morning reminder, to delete it
  deye_6kw_on_reminder_msg:
    name: "Deye 6kW on reminder message"
    max: 64

automation:
  - id: deye_6kw_winter_off_reminder
    alias: Deye 6kW winter off reminder
    description: >-
      In winter (summer_season off), reminds on Telegram once a day to turn the
      6kW off when its battery is at 35 % or less and its PV has stopped
      producing, between 16:00 and 22:00. Sent to Nataliya only.
    mode: queued
    triggers:
      - trigger: numeric_state
        entity_id: sensor.deye_6kw_battery
        below: 35.5
        id: low_soc
      - trigger: numeric_state
        entity_id: sensor.deye_6kw_pv_power
        below: 10
        for: "00:15:00"
        id: pv_stopped
      - trigger: time
        at: "16:00:00"
        id: deferred
    conditions:
      - condition: state
        entity_id: binary_sensor.summer_season
        state: "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.deye_6kw_device_state
                state: Normal
              - condition: numeric_state
                entity_id: sensor.deye_6kw_battery
                below: 35.5
              - condition: numeric_state
                entity_id: sensor.deye_6kw_pv_power
                below: 10
              - condition: time
                after: "16:00:00"
                before: "22:00:00"
              - condition: template
                value_template: >
                  {{ states('input_datetime.deye_6kw_off_reminded')[:10]
                     != now().date() | string }}
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.deye_6kw_off_reminded
                data:
                  date: "{{ now().date() }}"
              - action: telegram_bot.send_message
                target:
                  entity_id: notify.nataliya
                data:
                  title: Інвертор
                  message: |-
                    🔋 Батарея Deye 6kW розрядилась до {{ states('sensor.deye_6kw_battery') | int(0) }} %
                    Для зменшення споживання вимкни Deye 6kW
                response_variable: sent
              - action: script.notify_log_record
                data:
                  title: Інвертор
                  message: >-
                    🔋 Батарея Deye 6kW {{ states('sensor.deye_6kw_battery') | int(0) }} %: вимкни Deye 6kW → Наталія
                  chats: "{{ sent.chats | default([]) }}"
                  keep_single: true

  - id: deye_6kw_winter_on_reminder
    alias: Deye 6kW winter on reminder
    description: >-
      In winter (summer_season off), while the 6kW is not Normal: Telegram
      "turn the 6kW on" at 07:20, again when the 5kW PV reaches 70 W, then every
      10 min until it is on (up to 15:00). Each reminder deletes the previous one.
      Sent to Nataliya only.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time
        at: "07:20:00"
        id: morning
      - trigger: time_pattern
        minutes: "/1"
        id: pv
    conditions:
      - condition: state
        entity_id: binary_sensor.summer_season
        state: "off"
      - condition: template
        value_template: "{{ not is_state('sensor.deye_6kw_device_state', 'Normal') }}"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.deye_6kw_on_reminded') %}
          {% if trigger.id == 'morning' %}true
          {% elif now().hour >= 15 %}false
          {% elif last[:10] == now().date() | string %}
            {{ now().timestamp() - state_attr('input_datetime.deye_6kw_on_reminded', 'timestamp') >= 590 }}
          {% else %}
            {{ states('sensor.deye_5kw_pv_power') | float(0) >= 70 }}
          {% endif %}
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'pv' }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.deye_6kw_on_reminded
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Replace the previous reminder
      - variables:
          prev: "{{ states('input_text.deye_6kw_on_reminder_msg').split(' ') }}"
      - if:
          - condition: template
            value_template: "{{ prev | count == 2 }}"
        then:
          - action: telegram_bot.delete_message
            continue_on_error: true
            data:
              chat_id: "{{ prev[0] }}"
              message_id: "{{ prev[1] }}"
      - action: telegram_bot.send_message
        target:
          entity_id: notify.nataliya
        data:
          title: Інвертор
          message: |-
            {{ '⏰ Доброго ранку' if trigger.id == 'morning' else '☀️ Зійшло сонце' }}
            Увімкни Deye 6kW
        response_variable: sent
      - action: script.notify_log_record
        data:
          title: Інвертор
          message: >-
            {{ '⏰ Доброго ранку' if trigger.id == 'morning' else '☀️ Зійшло сонце' }}: увімкни Deye 6kW → Наталія
          chats: "{{ sent.chats | default([]) }}"
          keep_single: true
          replaces: >-
            {{ [{'chat_id': prev[0] | int, 'message_id': prev[1] | int}] if prev | count == 2 else [] }}
      - action: input_text.set_value
        target:
          entity_id: input_text.deye_6kw_on_reminder_msg
        data:
          value: >-
            {% set c = (sent.chats | default([]))[:1] %}
            {{ (c[0].chat_id ~ ' ' ~ c[0].message_id) if c else '' }}
