# Winter nights: put an idle inverter into Standby to save its own consumption
# (~40-60 W for the 6kW, measured 2026-10-19). The on/off register 0x002B is
# ignored, but select.<inverter>_battery_operation_mode works: No Battery ->
# Standby in ~20 s, back to Capacity (the normal mode) -> Normal by itself in
# ~3.5 min. Each write blacks out that inverter's LOAD for ~20-35 s (measured 4x;
# the Standby -> Normal step itself has no dip). In Standby the grid passes
# through to LOAD (bypass) and the grid voltage is still read.
# Wiring (statistics/diagram.png): the 6kW GRID is fed from the 5kW SMART port;
# the whole house hangs on 6kW LOAD (stabilizer), so:
#  - the 5kW in Standby would cost nothing: the 6kW is a UPS for the house;
#  - every 6kW write blacks out the whole house (incl. the HA Raspberry, no UPS).
# 5kW (other firmware), tested 2026-10-19: the first No Battery write was
# ignored (read back Capacity, stayed Normal), the second one went to Standby
# in ~13 s - so the write is retried. In 5kW Standby its SMART port is dead,
# so the 6kW goes off-grid and carries the house from its battery without a
# blink; binary_sensor.deye_5kw_grid reads off for ~40 s while it enters
# Standby (not a real outage). Back to Capacity: Normal in ~3 min, the SMART
# port (= 6kW grid) returns ~65 s after that.
# Decided every minute from the current modes (no stored phase, so an HA
# restart mid-chain just continues):
#  1. After sunset, not before 16:00, both PV < 10 W, 6kW battery >= floor + 2
#     (floor = input_number.deye_6kw_export_soc, in winter the 6kW min SOC),
#     6kW load < 3 kW (a smaller high load only drains it faster):
#     5kW -> No Battery (retried up to 10 min if ignored). Once a night.
#  2/3. 6kW battery at the floor (or 6kW load > 4 kW, Night Charge, monthly full
#     charge, boost, 5kW battery selling, 05:00, grid off for 2 min): 5kW ->
#     Capacity. Off-grid the 6kW would go on below the floor, so this is retried
#     every minute.
#  4. Only while input_boolean.deye_6kw_night_standby is on.
#     5kW Normal for 3 min, SMART port back (6kW grid > 180 V), 5kW battery
#     above its min SOC, 6kW battery at the floor: 6kW -> No Battery; the house is
#     fed through from the 5kW (~30 s blackout).
#  Morning (05:00-12:00): 5kW PV >= 100 W, or 10:00 at the latest -> 5kW
#  Capacity.
#  6kW wake: No Battery still converts PV - with sun the 6kW goes Standby ->
#  Normal by itself (no write, no dip, seen 2026-10-20 08:36), feeds the house
#  and pushes the surplus back into the 5kW SMART port; only its battery is
#  idle. So it is woken (Capacity, ~30 s blackout) only when its PV is worth
#  charging the battery: binary_sensor.deye_6kw_pv_strong (6kW PV, or 5kW PV
#  in case the 6kW is curtailed because nothing takes its surplus, >=
#  input_number.deye_6kw_wake_pv for 10 min). A dull winter day passes with no
#  write at all. Grid lost while the 6kW is in No Battery: Capacity at once.
#  Monthly full charge (binary_sensor.deye_6kw_full_charge, winter, the night
#  to the 1st, 23:10-06:30): the 6kW is woken and deye_state_controller
#  charges it from the grid to 100 % (BMS calibration after weeks at the floor).
# Snow (input_boolean.deye_6kw_snow, set by hand when the 6kW panels are
# covered - winter 2025/26 they gave 2-14 kWh a week for ~8 weeks while the
# 5kW ones worked): the 6kW stays in Standby day and night (phase 4 at any
# time and SOC, no PV wake). Turn snow off when the panels are clear, the PV
# wake then works again. Grid loss and the monthly full charge still wake it.
# Bizon (wake on power): if it is asleep when the 6kW is written, it is put back
# to sleep 1 min after it boots (input_boolean.bizon_resleep).
# Every write goes to the logbook ("Deye night standby") for checking.
# Season = binary_sensor.summer_season off (packages/season.yaml).
input_datetime:
  # Last 5kW standby (phase 1) attempt: once a night, retries for 10 min
  deye_5kw_standby_started:
    name: "Deye 5kW standby started"
    has_date: true
    has_time: true

input_number:
  # 6kW (or 5kW) PV that wakes the 6kW from No Battery, held for 10 min
  deye_6kw_wake_pv:
    name: "Deye 6kW wake PV"
    icon: mdi:solar-power
    min: 0.5
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box

template:
  - binary_sensor:
      - name: "Deye 6kW PV strong"
        unique_id: deye_6kw_pv_strong
        icon: mdi:solar-power
        delay_on: "00:10:00"
        # In Standby the 6kW PV power is stale, so only while Normal
        state: >-
          {% set thr = states('input_number.deye_6kw_wake_pv') | float(2) * 1000 %}
          {{ (is_state('sensor.deye_6kw_device_state', 'Normal')
              and states('sensor.deye_6kw_pv_power') | float(0) >= thr)
             or states('sensor.deye_5kw_pv_power') | float(0) >= thr }}
      # Winter, the night to the 1st of the month: charge the 6kW to 100 %
      - name: "Deye 6kW full charge"
        unique_id: deye_6kw_full_charge
        icon: mdi:battery-charging-100
        state: >-
          {% set t = now().strftime('%H:%M') %}
          {{ is_state('binary_sensor.summer_season', 'off')
             and ((now().day == 1 and t < '06:30')
                  or ((now() + timedelta(days=1)).day == 1 and t >= '23:10')) }}

input_boolean:
  # Phase 4 (6kW standby = house blackout) on/off; phases 1-3 run regardless
  deye_6kw_night_standby:
    name: "Deye 6kW night standby"
    icon: mdi:power-sleep
  # 6kW panels under snow (set by hand): keep the 6kW in Standby day and night
  deye_6kw_snow:
    name: "Deye 6kW snow"
    icon: mdi:snowflake
  # Bizon was asleep when the 6kW blacked it out: suspend it again after boot
  bizon_resleep:
    name: "Bizon resleep"

automation:
  - id: deye_night_standby
    alias: Deye night standby
    description: >-
      Winter nights: 5kW to No Battery while the 6kW battery carries the house,
      then 6kW to No Battery at Deye 6kW export SOC; 5kW back to Capacity in
      the morning (5kW PV 100 W / 10:00), 6kW only on strong PV (Deye 6kW wake
      PV for 10 min), the monthly full charge or grid loss. See
      packages/deye_night_standby.yaml.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: binary_sensor.deye_5kw_grid
        to: "off"
    variables:
      mode5: "{{ states('select.deye_5kw_battery_operation_mode') }}"
      mode6: "{{ states('select.deye_6kw_battery_operation_mode') }}"
      soc5: "{{ states('sensor.deye_5kw_battery') | float(0) }}"
      soc6: "{{ states('sensor.deye_6kw_battery') | float(100) }}"
      # 6kW standby SOC = its winter min SOC (deye_state_controller)
      floor6: "{{ states('input_number.deye_6kw_export_soc') | float(55) }}"
      full_charge: "{{ is_state('binary_sensor.deye_6kw_full_charge', 'on') }}"
      grid: "{{ is_state('binary_sensor.deye_5kw_grid', 'on') }}"
      high_load: "{{ is_state('binary_sensor.any_device_high_power', 'on') }}"
      # Off-grid (5kW in Standby) the 6kW has no grid to help: end phase 1
      # before it overloads. A smaller high load only drains it faster.
      overload6: "{{ states('sensor.deye_6kw_load_power') | float(0) > 4000 }}"
      t: "{{ now().strftime('%H:%M') }}"
      night: "{{ t >= '16:00' or t < '05:00' }}"
      dark: >-
        {{ is_state('sun.sun', 'below_horizon')
           and states('sensor.deye_5kw_pv_power') | float(0) < 10
           and states('sensor.deye_6kw_pv_power') | float(0) < 10 }}
      grid_gone: >-
        {{ not grid and now() - states.binary_sensor.deye_5kw_grid.last_changed
           > timedelta(minutes=2) }}
      # Things the 5kW battery is needed for at night
      busy5: >-
        {{ full_charge
           or is_state('input_boolean.self_consumption_boost_active', 'on')
           or (is_state('input_select.selling_mode', 'Save + Night Charge')
               and (t >= '23:10' or t < '06:30'))
           or (is_state('input_select.deye_system_state', 'Evening Export')
               and states('input_number.deye_5kw_export_soc') | float(100) < 100
               and soc5 > states('input_number.deye_5kw_export_soc') | float(100)) }}
      started: >-
        {{ state_attr('input_datetime.deye_5kw_standby_started', 'timestamp') | float(0) }}
      winter: "{{ is_state('binary_sensor.summer_season', 'off') }}"
      morning: >-
        {{ '05:00' <= t < '12:00'
           and (states('sensor.deye_5kw_pv_power') | float(0) >= 100 or t >= '10:00') }}
      snow: "{{ is_state('input_boolean.deye_6kw_snow', 'on') }}"
    actions:
      - choose:
          # Strong PV, monthly full charge, or grid lost while the 6kW is in
          # No Battery (the house then hangs on the 5kW SMART port)
          - conditions:
              - condition: template
                value_template: >-
                  {{ mode6 == 'No Battery'
                     and (not grid or full_charge
                          or (is_state('binary_sensor.deye_6kw_pv_strong', 'on') and not snow)) }}
            sequence:
              - action: script.deye_night_standby_set
                data:
                  inverter: 6kw
                  option: Capacity
                  reason: >-
                    {{ 'grid lost' if not grid else 'monthly full charge' if full_charge
                       else '6kW PV ' ~ (states('sensor.deye_6kw_pv_power') | int(0)) ~ ' W' }}
          # Phase 2/3: end of the 5kW standby (the 6kW is off-grid meanwhile)
          - conditions:
              - condition: template
                value_template: >-
                  {{ mode5 == 'No Battery'
                     and (soc6 <= floor6 + 0.5 or overload6 or busy5 or not night or morning
                          or grid_gone
                          or not is_state('sensor.deye_6kw_device_state', 'Normal')) }}
            sequence:
              - action: script.deye_night_standby_set
                data:
                  inverter: 5kw
                  option: Capacity
                  reason: >-
                    {{ '6kW battery ' ~ (soc6 | int) ~ ' %' if soc6 <= floor6 + 0.5
                       else '6kW load over 4 kW' if overload6
                       else '5kW battery needed' if busy5
                       else 'grid lost' if grid_gone
                       else 'morning' if not night or morning else '6kW not Normal' }}
          # Phase 1: 5kW standby, the 6kW battery carries the house. Once a
          # night; a write the 5kW ignored (still Normal, unchanged since the
          # attempt) is retried every 2 min for 10 min.
          - conditions:
              - condition: template
                value_template: >-
                  {% set age = now().timestamp() - started %}
                  {% set dev = states.sensor.deye_5kw_device_state %}
                  {{ winter and night and dark and grid and not busy5
                     and states('sensor.deye_6kw_load_power') | float(0) < 3000
                     and mode5 == 'Capacity' and mode6 == 'Capacity'
                     and dev.state == 'Normal'
                     and is_state('sensor.deye_6kw_device_state', 'Normal')
                     and soc6 >= floor6 + 2
                     and (age > 14 * 3600
                          or (120 <= age < 600 and dev.last_changed.timestamp() < started
                              and (age | int) % 120 < 60)) }}
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ now().timestamp() - started > 14 * 3600 }}"
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.deye_5kw_standby_started
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: script.deye_night_standby_set
                data:
                  inverter: 5kw
                  option: No Battery
                  reason: "6kW battery {{ soc6 | int }} %"
          # Phase 4: 6kW standby, the 5kW carries the house through it.
          # Snow: at any time and SOC.
          - conditions:
              - condition: template
                value_template: >-
                  {{ ((winter and night and dark and soc6 <= floor6 + 0.5
                       and is_state('input_boolean.deye_6kw_night_standby', 'on'))
                      or snow)
                     and grid and not high_load and not full_charge
                     and mode5 == 'Capacity' and mode6 == 'Capacity'
                     and is_state('sensor.deye_6kw_device_state', 'Normal')
                     and soc5 > states('input_number.deye_5kw_min_soc') | float(100)
                     and states('sensor.deye_6kw_grid_l1_voltage') | float(0) > 180 }}
              - condition: state
                entity_id: sensor.deye_5kw_device_state
                state: Normal
                for: "00:03:00"
            sequence:
              - action: script.deye_night_standby_set
                data:
                  inverter: 6kw
                  option: No Battery
                  reason: >-
                    {{ 'snow, ' if snow else '' }}6kW battery {{ soc6 | int }} %,
                    5kW {{ soc5 | int }} %

  # Bizon has wake on power: after a 6kW blackout it boots. If it was asleep
  # before, suspend it again a minute after it is up.
  - id: bizon_resleep
    alias: Bizon resleep
    description: >-
      Suspends the Bizon 1 min after it boots, if it was asleep when the 6kW
      blacked it out (input_boolean.bizon_resleep, valid 20 min).
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.bizon_awake
        to: "on"
        for: "00:01:00"
      - trigger: state
        entity_id: input_boolean.bizon_resleep
        to: "on"
        for: "00:20:00"
        id: expired
    conditions:
      - condition: state
        entity_id: input_boolean.bizon_resleep
        state: "on"
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id != 'expired' }}"
        then:
          - action: shell_command.bizon_suspend
          - action: logbook.log
            data:
              name: Deye night standby
              message: "Bizon booted after the blackout, suspended again"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bizon_resleep

script:
  # Dashboard buttons (Night standby row): Normal -> No Battery (Standby),
  # anything else -> Capacity (back to Normal)
  deye_night_standby_toggle:
    alias: Deye night standby toggle
    description: >-
      Manual switch of one inverter: Normal -> No Battery, otherwise ->
      Capacity. A 6kW write blacks out the house for ~30 s.
    mode: single
    max_exceeded: silent
    fields:
      inverter:
        description: 5kw or 6kw
    sequence:
      - action: script.deye_night_standby_set
        data:
          inverter: "{{ inverter }}"
          option: >-
            {{ 'No Battery' if is_state('sensor.deye_' ~ inverter ~ '_device_state', 'Normal')
               else 'Capacity' }}
          reason: manual

  deye_night_standby_set:
    alias: Deye night standby set
    description: >-
      Writes battery_operation_mode of one inverter and logs it. Before a 6kW
      write (= house blackout) remembers whether the Bizon was asleep.
    mode: queued
    fields:
      inverter:
        description: 5kw or 6kw
      option:
        description: No Battery or Capacity
      reason:
        description: Logged reason
    sequence:
      - if:
          - condition: template
            value_template: >-
              {{ inverter == '6kw' and is_state('binary_sensor.bizon_awake', 'off') }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bizon_resleep
      # Logged before the write: the blackout follows it within ~20 s
      - action: logbook.log
        data:
          name: Deye night standby
          message: "{{ inverter }} -> {{ option }} ({{ reason }})"
          entity_id: "select.deye_{{ inverter }}_battery_operation_mode"
      # A 6kW write powers off the HA Raspberry too. On 2026-10-20 the last
      # ~3 min before it were lost (the resleep flag and this logbook row were
      # still only in the page cache). Save the restore states and wait for
      # the kernel writeback (dirty pages expire after 30 s, flushed every 5 s).
      # Not on grid loss: the house is dark already, the 6kW must come back now.
      - if:
          - condition: template
            value_template: "{{ inverter == '6kw' and reason != 'grid lost' }}"
        then:
          - action: homeassistant.save_persistent_states
          - delay: "00:00:40"
      - action: select.select_option
        target:
          entity_id: "select.deye_{{ inverter }}_battery_operation_mode"
        data:
          option: "{{ option }}"
