command_line:
  - sensor:
      name: "ENERA Green Tariffs"
      unique_id: enera_green_tariffs
      # Per-month green tariff (UAH/kWh excl. VAT) parsed from the utility acts
      # in statistics/documents/enera by statistics/enera/parse_acts.py. Attributes:
      # tariffs {YYYY-MM: value}, latest. The monthly/annual energy reports
      # price a month at green tariff x 0.77 (18% PDFO + 5% military levy withheld).
      command: "python3 /config/statistics/enera/ha_tariffs.py"
      value_template: "{{ value_json.months }}"
      json_attributes:
        - tariffs
        - latest
      scan_interval: 3600

template:
  - sensor:
      - name: "ENERA Export Price"
        unique_id: enera_export_price
        # Net export price for the Energy dashboard's grid compensation: the
        # latest act's green tariff x 0.77 (after tax), 5.2353 (July 2026) until
        # the tariffs sensor has data. It moves when a new act is synced, so a
        # month is priced at the last known tariff until its own act arrives.
        unit_of_measurement: "UAH/kWh"
        icon: mdi:cash-plus
        state: >
          {{ (((state_attr('sensor.enera_green_tariffs', 'latest') | float(0)) * 0.77)
              or 5.2353) | round(4) }}
