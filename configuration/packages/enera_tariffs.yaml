command_line:
  - sensor:
      name: "ENERA Green Tariffs"
      unique_id: enera_green_tariffs
      # Per-month green tariff (UAH/kWh excl. VAT) parsed from the utility acts
      # in enera/acts by enera/parse_acts.py. Attributes: tariffs {YYYY-MM: value},
      # latest. The monthly/annual energy reports price a month at
      # green tariff x 0.77 (18% PDFO + 5% military levy withheld).
      command: "python3 /config/enera/ha_tariffs.py"
      value_template: "{{ value_json.months }}"
      json_attributes:
        - tariffs
        - latest
      scan_interval: 3600
