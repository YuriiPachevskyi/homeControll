# Deye operating schedule. deye_state_scheduler turns the four start times
# into input_select.deye_system_state (and resets selling_mode where needed);
# deye_state_controller turns state x selling_mode into the inverter-control
# helpers (min SOC, discharge/charge power, export limit, grid charging,
# energy pattern), which deye_param_sync.yaml writes into both Deyes.
# The 6kW weather check decides tomorrow's 6kW battery selling.
automation:
  - id: deye_state_scheduler
    alias: Deye State Scheduler
    initial_state: true
    description: Handles time-based state transitions and input_select.selling_mode.
      Force only works from the start of Morning Export to the end of Max Solar; outside
      that window it is reset to Normal (also on HA start, in case the Evening Export
      trigger was missed). Save and Save + Deye6 Charge are reset to Normal at every Morning Export start in
      summer (binary_sensor.summer_season, kept all winter); the night charge modes are
      never reset. Changing any of the four start times re-evaluates the state right
      away.
    triggers:
    - trigger: time
      at: input_datetime.deye_morning_export_start_time
      id: Morning Export
    - trigger: time
      at: input_datetime.deye_max_solar_start_time
      id: Max Solar
    - trigger: time
      at: input_datetime.deye_evening_export_start_time
      id: Evening Export
    - trigger: time
      at: input_datetime.deye_night_idle_start_time
      id: Idle
    - trigger: state
      entity_id: input_select.selling_mode
      id: selling_mode_changed
    - trigger: state
      entity_id:
      - input_datetime.deye_morning_export_start_time
      - input_datetime.deye_max_solar_start_time
      - input_datetime.deye_evening_export_start_time
      - input_datetime.deye_night_idle_start_time
      not_to:
      - unavailable
      - unknown
      id: schedule_changed
    - trigger: homeassistant
      event: start
      id: ha_start
    actions:
    - variables:
        now_time: '{{ now().strftime(''%H:%M:%S'') }}'
        morning_export: '{{ states(''input_datetime.deye_morning_export_start_time'')
          }}'
        max_solar: '{{ states(''input_datetime.deye_max_solar_start_time'') }}'
        evening_export: '{{ states(''input_datetime.deye_evening_export_start_time'')
          }}'
        night_idle: '{{ states(''input_datetime.deye_night_idle_start_time'') }}'
        force_window: '{{ morning_export <= now_time < evening_export }}'
    - if:
      - condition: template
        value_template: '{{ (not force_window and is_state(''input_select.selling_mode'',
          ''Force'')) or (trigger.id == ''Morning Export'' and is_state(''binary_sensor.summer_season'',
          ''on'') and states(''input_select.selling_mode'') in [''Save'', ''Save + Deye6 Charge''])
          }}'
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.selling_mode
        data:
          option: Normal
    - action: input_select.select_option
      target:
        entity_id: input_select.deye_system_state
      data:
        option: "{% if morning_export <= now_time < max_solar %}\n  Morning Export\n{%
          elif max_solar <= now_time < evening_export %}\n  Max Solar\n{% elif evening_export
          <= now_time < night_idle %}\n  Evening Export\n{% else %}\n  Idle\n{% endif
          %}"
    mode: queued
    max: 3
  - id: deye_state_controller
    alias: Deye State Controller
    description: Applies settings based on current Deye System State. 5kW discharge
      SOC for Morning Export, Max Solar and Evening Export comes from input_number.deye_5kw_export_soc,
      6kW discharge SOC for Evening Export (selling) from input_number.deye_6kw_export_soc
      (changing either re-applies the settings); in Save and Save + Normal/Full Night Charge the
      5kW slider is the 5kW discharge floor in every state, Idle included (Normal and
      Force keep Idle at 35). input_select.selling_mode Save forces export 100 W in all states, so PV charges
      the 5kW battery and nothing is sold (min SOC alone does not charge, in Export
      First the Deye sells PV before charging); in Morning Export and Max Solar it sells
      only once the 5kW battery is full, same as Save + Normal/Full Night Charge (full_sell). Force
      overrides Morning Export and Max Solar with 5kW SOC 40 / 0.35 kW, export 5080,
      6kW SOC 55 / 1 kW (was the Max Solar Forced state). Save + Normal/Full Night Charge uses
      export 100 W (all 5kW PV goes to charging, nothing is sold); in Morning
      Export and Max Solar, once the 5kW battery is at 100% (full_soc, back to charging
      below full_low_soc 95, both hard-coded in the soc_5kw_full/low triggers too) Save
      and Save + Normal/Full Night Charge switch to SOC 100 + the state's export limit, so the PV
      surplus is sold but the battery is not (5kW grid peak shaving no longer does this
      since the firmware update). Save + Normal/Full Night Charge is never reset by any automation;
      from 23:10 to 06:30 (binary_sensor.deye_night_grid_charge, grid present) the 5kW
      gets min SOC 85 (Normal, 5kW) / 100 (Full) with grid charging on (all 6 programs
      Grid); in Normal / Full the 6kW too (binary_sensor.deye_6kw_night_grid_charge,
      not while Deye 6kW night standby is on), its charge power at least 1.5 kW; the grid import does not count as a cascade
      overload then and deye_night_standby keeps the 6kW awake all night. In winter (binary_sensor.summer_season
      off) in Save and Save + Normal/Full Night Charge every run (except battery_changed) resets
      input_number.charge_power_deye_6kw to 1.5 kW. In winter 6kW min SOC is
      input_number.deye_6kw_export_soc (in summer the floor the 6kW battery is sold
      down to, in winter its discharge floor = the night standby floor in
      packages/energy/deye_night_standby.yaml) in every state except Force and while the 6kW
      sells its battery. While
      binary_sensor.deye_6kw_full_charge is on (winter, the night to the 1st, 23:10-06:30)
      the 6kW charges from the grid to 100 % (min SOC 100, all 6 programs Grid) and the
      5kW min SOC is held at its current SOC so the 5kW battery does not feed it. 6kW
      energy pattern is Battery First in Save and Save + Normal/Full Night Charge, Load First otherwise.
      Save + Deye6 Charge works like Save for the 5kW; while binary_sensor.deye_6kw_priority_charge
      is on (Morning Export / Max Solar, 6kW < 100 %) the 6kW charges first - min SOC 100,
      grid charging on (all 6 programs Grid) through the 5kW SMART port, the grid charge
      current regulated by packages/energy/deye_6kw_priority_charge.yaml; in this mode
      input_number.charge_power_deye_6kw is set to 3.5 kW on every run (summer and winter)
      and the cascade never moves it.
      While binary_sensor.boiler_night_heating is on (Boiler mode Night, night charge window,
      grid present; packages/boiler.yaml) both min SOCs are held at the current SOC, so the
      boiler heats from the grid and no battery is discharged.
    triggers:
    - trigger: state
      entity_id: input_select.deye_system_state
      id: state_changed
    - trigger: time_pattern
      id: periodic_update
      hours: /1
    - trigger: homeassistant
      event: start
      id: ha_start
    - trigger: state
      entity_id: sensor.deye_6kw_battery
      id: battery_changed
    - trigger: state
      entity_id: input_number.deye_5kw_export_soc
      id: soc_5kw_changed
    - trigger: state
      entity_id: input_number.deye_6kw_export_soc
      id: soc_6kw_changed
    - trigger: state
      entity_id: input_select.selling_mode
      id: selling_mode_changed
    - trigger: numeric_state
      entity_id: sensor.deye_5kw_battery
      above: 99
      id: soc_5kw_full
    - trigger: numeric_state
      entity_id: sensor.deye_5kw_battery
      below: 95
      id: soc_5kw_low
    - trigger: state
      entity_id: binary_sensor.night_charge_window
      from: 'off'
      to: 'on'
      id: night_charge_start
    - trigger: state
      entity_id: binary_sensor.night_charge_window
      from: 'on'
      to: 'off'
      id: night_charge_stop
    - trigger: state
      entity_id: binary_sensor.deye_6kw_full_charge
      # Template reload / HA start: unavailable -> on/off is not a change
      not_from:
      - unavailable
      - unknown
      to:
      - 'on'
      - 'off'
      id: full_charge_changed
    - trigger: state
      entity_id: binary_sensor.boiler_night_heating
      # Template reload / HA start: unavailable -> on/off is not a change
      not_from:
      - unavailable
      - unknown
      to:
      - 'on'
      - 'off'
      id: boiler_night_changed
    - trigger: state
      entity_id: binary_sensor.deye_6kw_priority_charge
      # Template reload / HA start: unavailable -> on/off is not a change
      not_from:
      - unavailable
      - unknown
      to:
      - 'on'
      - 'off'
      id: priority_6kw_changed
    - trigger: state
      entity_id:
      - binary_sensor.deye_night_grid_charge
      - binary_sensor.deye_6kw_night_grid_charge
      - binary_sensor.deye_grid_present
      not_from:
      - unavailable
      - unknown
      to:
      - 'on'
      - 'off'
      id: grid_charge_changed
    conditions:
    # In Save / Save + Normal/Full Night Charge the periodic re-apply runs every 3 hours only
    - condition: template
      value_template: '{{ trigger.id != ''periodic_update''
        or states(''input_select.selling_mode'') not in [''Save'', ''Save + Normal Night Charge'', ''Save + Full Night Charge'', ''Save + 5kW Night Charge'', ''Save + Deye6 Charge'']
        or now().hour % 3 == 0 }}'
    actions:
    - variables:
        current_state: '{{ states(''input_select.deye_system_state'') }}'
        # Save + Normal Night Charge / Save + Full Night Charge: both Deyes
        # charge from the grid at night to night_target
        save_night: '{{ states(''input_select.selling_mode'') in [''Save + Normal Night Charge'',
          ''Save + Full Night Charge'', ''Save + 5kW Night Charge''] }}'
        night_target: '{{ 100 if is_state(''input_select.selling_mode'', ''Save + Full Night Charge'')
          else 85 }}'
        # binary_sensor.deye_night_grid_charge = night mode + window + grid present
        night_charge: '{{ is_state(''binary_sensor.deye_night_grid_charge'', ''on'') }}'
        # ... and the 6kW too (not in 5kW mode, not with 6kW night standby on)
        night_charge_6kw: '{{ is_state(''binary_sensor.deye_6kw_night_grid_charge'', ''on'') }}'
        max_discharge_power_5kw: 2400
        smart_limit: '{{ ([states(''sensor.deye_5kw_smart_discharge_limit'') | float(300),
          max_discharge_power_5kw] | min / 1000) | round(2) }}'
        is_selling_6kw: '{{ is_state(''input_boolean.deye_6kw_battery_selling'', ''on'')
          }}'
        # Save + Deye6 Charge drives the 5kW exactly like Save
        save: '{{ states(''input_select.selling_mode'') in [''Save'', ''Save + Deye6 Charge'']
          }}'
        deye6_mode: '{{ is_state(''input_select.selling_mode'', ''Save + Deye6 Charge'')
          }}'
        priority_6kw: '{{ is_state(''binary_sensor.deye_6kw_priority_charge'', ''on'')
          }}'
        full_soc: 100
        full_low_soc: 95
        full_sell: '{% set soc = states(''sensor.deye_5kw_battery'') | float(0) %}{{
          (save or save_night) and current_state in [''Morning Export'', ''Max Solar'']
          and (soc >= full_soc or (soc >= full_low_soc and states(''input_number.export_deye_5kw_power_base'')
          | float(0) > 100)) }}'
        export_soc_5kw: '{{ 100 if full_sell else states(''input_number.deye_5kw_export_soc'')
          | int(70) }}'
        export_soc_6kw: '{{ states(''input_number.deye_6kw_export_soc'') | int(70) }}'
        config:
          Morning Export:
            5kw_soc: '{{ export_soc_5kw }}'
            5kw_power: '{{ smart_limit }}'
            export_power: 5050
            6kw_soc: 40
            6kw_power: 0.9
            peak_shaving_6kw: 'on'
            general_automation: true
          Max Solar:
            5kw_soc: '{{ export_soc_5kw }}'
            5kw_power: 0.35
            export_power: 5080
            6kw_soc: 40
            6kw_power: 1
            peak_shaving_6kw: 'on'
            general_automation: true
          Evening Export:
            5kw_soc: '{{ export_soc_5kw }}'
            5kw_power: '{{ smart_limit }}'
            export_power: 5000
            6kw_soc: '{{ export_soc_6kw }}'
            6kw_power: 1.1
            peak_shaving_6kw: '{{ ''off'' if is_selling_6kw else ''on'' }}'
            general_automation: true
          Idle:
            5kw_soc: '{{ night_target if night_charge else export_soc_5kw if save or save_night
              else 35 }}'
            5kw_power: 1
            export_power: 100
            6kw_soc: 35
            6kw_power: 1.3
            peak_shaving_6kw: 'on'
            general_automation: true
        force: '{{ is_state(''input_select.selling_mode'', ''Force'') and current_state
          in [''Morning Export'', ''Max Solar''] }}'
        force_override:
          5kw_soc: 40
          5kw_power: 0.35
          export_power: 5080
          6kw_soc: 55
          6kw_power: 1
        winter_soc_6kw: '{{ export_soc_6kw }}'
        # Off-grid the 6kW must not "grid" charge from the 5kW battery
        full_charge_6kw: '{{ is_state(''binary_sensor.deye_6kw_full_charge'', ''on'')
          and not is_state(''binary_sensor.deye_grid_present'', ''off'') }}'
        grid_charge_6kw: '{{ full_charge_6kw or priority_6kw or night_charge_6kw }}'
        grid_soc_6kw: '{{ 100 if full_charge_6kw or priority_6kw else night_target }}'
        boiler_night: '{{ is_state(''binary_sensor.boiler_night_heating'', ''on'') }}'
        s: '{% set base = config.get(current_state, config[''Idle'']) %}{% set base
          = dict(base, **force_override) if force else base %}{% set base = dict(base,
          **{''6kw_soc'': winter_soc_6kw}) if is_state(''binary_sensor.summer_season'',
          ''off'') and not force and not is_selling_6kw else base %}{{ dict(base, **{''6kw_soc'':
          grid_soc_6kw}) if grid_charge_6kw else dict(base, **{''6kw_soc'': [base[''6kw_soc''] |
          float(0), states(''sensor.deye_6kw_battery'') | float(0) | round(0)] | max})
          if boiler_night else base }}'
        grid_charging_6kw: '{{ ''Grid'' if grid_charge_6kw else ''Disabled'' }}'
        grid_charging: '{{ ''Grid'' if night_charge else ''Disabled'' }}'
        energy_pattern_6kw: '{{ ''Battery First'' if save or save_night else ''Load
          First'' }}'
        winter_charge_6kw: '{{ deye6_mode or night_charge_6kw or (is_state(''binary_sensor.summer_season'',
          ''off'') and (save or save_night)) }}'
        charge_power_6kw: '{{ 3.5 if deye6_mode else 1.5 }}'
    - if:
      - condition: template
        value_template: '{{ current_state == ''Evening Export'' }}'
      - condition: template
        value_template: '{{ is_selling_6kw }}'
      - condition: template
        value_template: '{{ states(''sensor.deye_6kw_battery'') | float(0) <= s[''6kw_soc'']
          | float(0) }}'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.deye_6kw_grid_peak_shaving
        data: {}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.deye_6kw_battery_selling
      - action: input_number.set_value
        target:
          entity_id: input_number.deye_6kw_min_soc
        data:
          value: '{{ [ (states(''sensor.deye_6kw_battery'') | float(0) - 20) | round(0),
            30 ] | max }}'
    - if:
      - condition: template
        value_template: '{{ trigger.id != ''battery_changed'' }}'
      then:
      - action: switch.turn_{{ s.peak_shaving_6kw }}
        target:
          entity_id: switch.deye_6kw_grid_peak_shaving
      - action: input_number.set_value
        target:
          entity_id: input_number.deye_5kw_min_soc
        data:
          value: '{{ [s[''5kw_soc''] | float(0), states(''sensor.deye_5kw_battery'') |
            float(0) | round(0)] | max if full_charge_6kw or boiler_night else s[''5kw_soc'']
            }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.deye_5kw_discharge_power
        data:
          value: '{{ s[''5kw_power''] }}'
      - if:
        - condition: template
          value_template: '{{ grid_charge_6kw or boiler_night or trigger.id in [''full_charge_changed'',
            ''boiler_night_changed'', ''priority_6kw_changed'', ''grid_charge_changed'']
            or not (current_state == ''Evening Export'' and not is_selling_6kw and trigger.id
            != ''state_changed'') }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.deye_6kw_min_soc
          data:
            value: '{{ s[''6kw_soc''] }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.deye_6kw_discharge_power
        data:
          value: '{{ s[''6kw_power''] }}'
      - if:
        - condition: template
          value_template: '{{ winter_charge_6kw }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.charge_power_deye_6kw
          data:
            value: '{{ charge_power_6kw }}'
      - action: input_number.set_value
        target:
          entity_id:
          - input_number.export_deye_5kw_power
          - input_number.export_deye_5kw_power_base
        data:
          value: '{{ 100 if (save or save_night) and not full_sell else s[''export_power'']
            }}'
      - if:
        - condition: template
          value_template: '{{ current_state != ''Evening Export'' and trigger.id in
            [''state_changed'', ''ha_start''] }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.deye_6kw_battery_selling
      - if:
        - condition: template
          value_template: '{{ not is_state(''switch.deye_5kw_battery_grid_charging'',
            ''on'' if night_charge else ''off'') }}'
        then:
        - action: switch.turn_{{ 'on' if night_charge else 'off' }}
          target:
            entity_id: switch.deye_5kw_battery_grid_charging
      - repeat:
          for_each:
          - select.deye_5kw_program_1_charging
          - select.deye_5kw_program_2_charging
          - select.deye_5kw_program_3_charging
          - select.deye_5kw_program_4_charging
          - select.deye_5kw_program_5_charging
          - select.deye_5kw_program_6_charging
          sequence:
          - if:
            - condition: template
              value_template: '{{ states(repeat.item) != grid_charging }}'
            then:
            - action: select.select_option
              target:
                entity_id: '{{ repeat.item }}'
              data:
                option: '{{ grid_charging }}'
      - if:
        - condition: template
          value_template: '{{ not is_state(''switch.deye_6kw_battery_grid_charging'',
            ''on'' if grid_charge_6kw else ''off'') }}'
        then:
        - action: switch.turn_{{ 'on' if grid_charge_6kw else 'off' }}
          target:
            entity_id: switch.deye_6kw_battery_grid_charging
      - repeat:
          for_each:
          - select.deye_6kw_program_1_charging
          - select.deye_6kw_program_2_charging
          - select.deye_6kw_program_3_charging
          - select.deye_6kw_program_4_charging
          - select.deye_6kw_program_5_charging
          - select.deye_6kw_program_6_charging
          sequence:
          - if:
            - condition: template
              value_template: '{{ states(repeat.item) != grid_charging_6kw }}'
            then:
            - action: select.select_option
              target:
                entity_id: '{{ repeat.item }}'
              data:
                option: '{{ grid_charging_6kw }}'
      - if:
        - condition: template
          value_template: '{{ states(''select.deye_6kw_energy_pattern'') != energy_pattern_6kw
            }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.deye_6kw_energy_pattern
          data:
            option: '{{ energy_pattern_6kw }}'
      - if:
        - condition: template
          value_template: '{{ s.general_automation }}'
        then:
        - action: automation.turn_on
          target:
            entity_id: automation.power_load_cascade
          data: {}
        - action: automation.trigger
          target:
            entity_id: automation.power_load_cascade
          data:
            skip_condition: true
    initial_state: true
    mode: queued
    max: 5
  # Night charge modes, automatic changes:
  #  - 06:30 (night charge window ends): Save + Full Night Charge (service
  #    full charge, one night) -> Save + Normal Night Charge;
  #  - winter 22:00: tomorrow > 50 % sunny (cloud_tomorrow 08:00-18:00 of
  #    sensor.deye_6kw_sunny_today) -> Normal, no grid charge tonight. Not
  #    switched back by itself.
  - id: deye_night_mode_auto
    alias: Deye night charge mode auto
    initial_state: true
    description: Save + Full Night Charge -> Save + Normal Night Charge when the night
      charge window ends; in winter at 22:00 any night charge mode -> Normal when
      tomorrow is forecast more than 50 % sunny.
    triggers:
    - trigger: state
      entity_id: binary_sensor.night_charge_window
      from: 'on'
      to: 'off'
      id: full_done
    - trigger: time
      at: '22:00:00'
      id: sunny_check
    variables:
      sunny: '{{ 100 - state_attr(''sensor.deye_6kw_sunny_today'', ''cloud_tomorrow'')
        | float(100) }}'
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: full_done
        - condition: state
          entity_id: input_select.selling_mode
          state: Save + Full Night Charge
        sequence:
        - action: input_select.select_option
          target:
            entity_id: input_select.selling_mode
          data:
            option: Save + Normal Night Charge
        - action: script.energy_log
          data:
            message: 'Night mode: Full Night Charge done -> Save + Normal Night Charge
              (5kW {{ states(''sensor.deye_5kw_battery'') }} %, 6kW {{ states(''sensor.deye_6kw_battery'')
              }} %)'
      - conditions:
        - condition: trigger
          id: sunny_check
        - condition: state
          entity_id: binary_sensor.summer_season
          state: 'off'
        - condition: state
          entity_id: input_select.selling_mode
          state:
          - Save + Normal Night Charge
          - Save + Full Night Charge
          - Save + 5kW Night Charge
        - condition: template
          value_template: '{{ sunny > 50 }}'
        sequence:
        - variables:
            old_mode: '{{ states(''input_select.selling_mode'') }}'
        - action: input_select.select_option
          target:
            entity_id: input_select.selling_mode
          data:
            option: Normal
        - action: script.energy_log
          data:
            message: 'Night mode: tomorrow sunny {{ sunny | round(0) }} % -> Normal (was
              {{ old_mode }})'
        - action: script.notify_all
          data:
            title: Deye
            message: 'Завтра сонячно ({{ sunny | round(0) }} %), нічної зарядки не буде:
              Selling mode {{ old_mode }} -> Normal.'
            to: yurii_only
    mode: queued
  - id: deye_6kw_selling_weather_check
    alias: Deye 6kW Battery Selling - Auto Weather Check
    description: Auto-toggles input_boolean.deye_6kw_battery_selling based on tomorrow's
      forecast cloud coverage (08:00-18:00, attribute cloud_tomorrow of sensor.deye_6kw_sunny_today,
      packages/energy/forecast.yaml), 1 minute before deye_evening_export_start_time. Runs
      year-round so the flag is force-reset off outside summer (binary_sensor.summer_season;
      it would otherwise never reset once the season condition stopped matching), but
      only ever turns it on within that window.
    triggers:
    - trigger: time
      at:
        entity_id: input_datetime.deye_evening_export_start_time
        offset: -00:01:00
    actions:
    - variables:
        avg_cloud_coverage: '{{ state_attr(''sensor.deye_6kw_sunny_today'', ''cloud_tomorrow'')
          | float(100) }}'
        sunny_percent: '{{ 100 - (avg_cloud_coverage | float(100)) }}'
        in_season: '{{ is_state(''binary_sensor.summer_season'', ''on'') }}'
        is_sunny_tomorrow: '{{ in_season and sunny_percent > 70 }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.deye_6kw_selling_forecast_cloud
      data:
        value: '{{ avg_cloud_coverage | round(1) }}'
    - action: script.energy_log
      data:
        message: 'Deye 6kW Selling Auto: sunny {{ sunny_percent | round(0) }}%{{ '''' if in_season else '' (off-season)'' }} -> {{ ''ON'' if is_sunny_tomorrow else ''OFF'' }}'
    - if:
      - condition: template
        value_template: '{{ is_sunny_tomorrow }}'
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.deye_6kw_battery_selling
      else:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.deye_6kw_battery_selling
    mode: single
