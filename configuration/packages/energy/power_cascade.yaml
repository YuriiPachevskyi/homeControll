# Real-time power load cascade: one step per run, overload sheds loads
# (heating, export, boiler, 6kW charge, ACs), surplus adds them (6kW charge,
# boiler, export, ACs). Inputs: binary_sensor.any_device_high_power,
# binary_sensor.battery_charge_and_export_power_limit,
# binary_sensor.pv1_5kw_lower_than_6kw and friends (template helpers, UI).
automation:
  - id: '1773316386421'
    alias: Power load cascade
    initial_state: true
    description: Drives the power load cascade one step per run. Every 30 s normally;
      a new overload or surplus (on for 5 s) triggers a step right away, and while it
      lasts it steps every 15 s, but never sooner than 15 s after the last real load
      change (input_text.last_script_trigger; idle runs don't count), so the next step
      sees the measured effect of the previous one (Deye polls every 5 s).
    triggers:
    - entity_id:
      - script.power_load_cascade_step
      from:
      to:
      for:
        hours: 0
        minutes: 0
        seconds: 30
      trigger: state
      id: tick
    - entity_id:
      - script.power_load_cascade_step
      from:
      to:
      for:
        seconds: 15
      trigger: state
      id: tick_fast
    - trigger: state
      entity_id: binary_sensor.any_device_high_power
      to: 'on'
      for:
        seconds: 5
      id: overload
    - event: start
      trigger: homeassistant
    - trigger: event
      event_type: automation_reloaded
    - trigger: state
      entity_id:
      - binary_sensor.battery_charge_and_export_power_limit
      to: 'on'
      for:
        seconds: 5
      id: surplus
    conditions:
    - condition: or
      conditions:
      - condition: not
        conditions:
        - condition: trigger
          id:
          - tick_fast
          - overload
          - surplus
      - condition: and
        alias: 'Overload: step at most every 10 s'
        conditions:
        - condition: trigger
          id:
          - tick_fast
          - overload
        - condition: state
          entity_id: binary_sensor.any_device_high_power
          state: 'on'
        - condition: template
          value_template: '{{ now() - states.input_text.last_script_trigger.last_reported
            >= timedelta(seconds=15) }}'
      - condition: and
        alias: 'Surplus: step at most every 10 s'
        conditions:
        - condition: trigger
          id:
          - tick_fast
          - surplus
        - condition: state
          entity_id: binary_sensor.any_device_high_power
          state: 'off'
        - condition: state
          entity_id: binary_sensor.battery_charge_and_export_power_limit
          state: 'on'
        - condition: template
          value_template: '{{ now() - states.input_text.last_script_trigger.last_reported
            >= timedelta(seconds=15) }}'
    actions:
    - action: script.power_load_cascade_step
      data: {}
    mode: single

script:
  power_load_cascade_step:
    alias: Power load cascade step
    sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: binary_sensor.any_device_high_power
          state: 'on'
        sequence:
        - choose:
          - alias: 'Disable: Turn off Heating'
            conditions:
            - condition: state
              entity_id: switch.1562_heating_main
              state:
              - 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Heating OFF{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_off
              metadata: {}
              target:
                entity_id:
                - switch.1562_heating_main
                - switch.1563_heating_ten_1_5_kwh
                - switch.1564_heating_ten_3_kwh
              data: {}
          - alias: 'Disable: Export back to state value'
            conditions:
            - condition: template
              value_template: '{{ states(''input_number.export_deye_5kw_power'') | float(0)
                > states(''input_number.export_deye_5kw_power_base'') | float(0) }}'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Export -> {{ states(''input_number.export_deye_5kw_power_base'') | int(0) }}W{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              target:
                entity_id: input_number.export_deye_5kw_power
              data:
                value: '{{ states(''input_number.export_deye_5kw_power_base'') | float(0) }}'
          - alias: 'Disable: Boiler 2.0 -> 1.2'
            conditions:
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'on'
            - condition: state
              entity_id: switch.1560_boiler_ten_0_8_kwh
              state: 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Boiler 2.0 -> 1.2{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_off
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
          - alias: 'Disable: Boiler 1.2 -> 0.8'
            conditions:
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Boiler 1.2 -> 0.8{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_off
              target:
                entity_id: switch.1561_boiler_ten_1_2_kwh
            - action: switch.turn_on
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
          - alias: 'Disable: Boiler 0.8 OFF'
            conditions:
            - condition: state
              entity_id: switch.1560_boiler_ten_0_8_kwh
              state: 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Boiler 0.8 OFF{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_off
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
              data: {}
          - alias: 'Disable: Reduce Charge to 1.5kW'
            conditions:
            - condition: numeric_state
              entity_id: input_number.charge_power_deye_6kw
              above: 1.5
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 95
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Reducing Charge to 1.5kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              data:
                value: 1.5
              target:
                entity_id: input_number.charge_power_deye_6kw
          - alias: 'Disable: Reduce Charge to 0.75kW'
            conditions:
            - alias: Not winter with Save / Save + Night Charge, charge stays >= 1.5 kW
              condition: template
              value_template: '{{ not is_state(''binary_sensor.deye_6kw_winter_charge'', ''on'') }}'
            - condition: numeric_state
              entity_id: input_number.charge_power_deye_6kw
              above: 0.75
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 95
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Reducing Charge to 0.75kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              data:
                value: 0.75
              target:
                entity_id: input_number.charge_power_deye_6kw
          - alias: 'Disable: Charge to 0kW'
            conditions:
            - alias: Not winter with Save / Save + Night Charge, charge stays >= 1.5 kW
              condition: template
              value_template: '{{ not is_state(''binary_sensor.deye_6kw_winter_charge'', ''on'') }}'
            - condition: numeric_state
              entity_id: input_number.charge_power_deye_6kw
              above: 0
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 95
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Charge to 0kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              data:
                value: 0
              target:
                entity_id: input_number.charge_power_deye_6kw
          - alias: 'Disable: Big Bedroom AC OFF'
            conditions:
            - condition: not
              conditions:
              - condition: state
                entity_id: climate.big_bedroom_ac
                state: 'off'
            - condition: not
              conditions:
              - condition: state
                entity_id: input_select.big_bedroom_ac
                state: 'off'
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 71
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Big Bedroom AC OFF (Battery <= 70%){% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: climate.turn_off
              target:
                entity_id: climate.big_bedroom_ac
          - alias: 'Disable: Bedroom AC OFF'
            conditions:
            - condition: not
              conditions:
              - condition: state
                entity_id: climate.bedroom_ac
                state: 'off'
            - condition: not
              conditions:
              - condition: state
                entity_id: input_select.bedroom_ac
                state: 'off'
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 51
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Disable: Bedroom AC OFF (Battery <= 50%){% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: climate.turn_off
              target:
                entity_id: climate.bedroom_ac
      - conditions:
        - condition: state
          entity_id: binary_sensor.any_device_high_power
          state: 'off'
        sequence:
        - choose:
          - alias: 'Enable: Charge Power 0.75kW'
            conditions:
            - condition: numeric_state
              entity_id: input_number.charge_power_deye_6kw
              below: 0.75
            - condition: state
              entity_id: binary_sensor.battery_deye_6kw_charged
              state: 'off'
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 95
            - alias: 6kW battery idle (No Battery) - charge power does nothing then
              condition: not
              conditions:
              - condition: state
                entity_id: select.deye_6kw_battery_operation_mode
                state: No Battery
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.battery_charge_and_export_power_limit
                state:
                - 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Charge 0.75kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              data:
                value: 0.75
              target:
                entity_id: input_number.charge_power_deye_6kw
          - alias: 'Enable: Charge Power 1.5kW'
            conditions:
            - condition: numeric_state
              entity_id: input_number.charge_power_deye_6kw
              below: 1.5
            - condition: state
              entity_id: binary_sensor.battery_deye_6kw_charged
              state:
              - 'off'
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 95
            - alias: 6kW battery idle (No Battery) - charge power does nothing then
              condition: not
              conditions:
              - condition: state
                entity_id: select.deye_6kw_battery_operation_mode
                state: No Battery
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.battery_charge_and_export_power_limit
                state:
                - 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Charge 1.5kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              data:
                value: 1.5
              target:
                entity_id: input_number.charge_power_deye_6kw
          - alias: 'Enable: Charge Power 2.25kW'
            conditions:
            - condition: numeric_state
              entity_id: input_number.charge_power_deye_6kw
              below: 2.25
            - condition: state
              entity_id: binary_sensor.battery_deye_6kw_charged
              state:
              - 'off'
            - condition: numeric_state
              entity_id: sensor.deye_6kw_battery
              below: 95
            - alias: 6kW battery idle (No Battery) - charge power does nothing then
              condition: not
              conditions:
              - condition: state
                entity_id: select.deye_6kw_battery_operation_mode
                state: No Battery
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.battery_charge_and_export_power_limit
                state:
                - 'on'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Charge 2.25kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              data:
                value: 2.25
              target:
                entity_id: input_number.charge_power_deye_6kw
          - alias: 'Enable: Boiler 0.8kW ON'
            conditions:
            - condition: state
              entity_id: switch.1560_boiler_ten_0_8_kwh
              state: 'off'
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'off'
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.grid_off_and_deye_6kw_charging_fast
                state: 'on'
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
              - alias: Surplus, unless the 6kW battery is idle (No Battery) - the 5kW
                  exports what its battery can't take, real curtailment is pv1
                condition: and
                conditions:
                - condition: state
                  entity_id: binary_sensor.battery_charge_and_export_power_limit
                  state:
                  - 'on'
                - condition: not
                  conditions:
                  - condition: state
                    entity_id: select.deye_6kw_battery_operation_mode
                    state: No Battery
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Boiler 0.8kW ON{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_on
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
              data: {}
          - alias: 'Enable: Boiler 1.2kW ON (Switch from 0.8)'
            conditions:
            - condition: state
              entity_id: switch.1560_boiler_ten_0_8_kwh
              state: 'on'
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'off'
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.grid_off_and_deye_6kw_charging_fast
                state: 'on'
              - alias: Surplus, unless the 6kW battery is idle (No Battery) - the 5kW
                  exports what its battery can't take, real curtailment is pv1
                condition: and
                conditions:
                - condition: state
                  entity_id: binary_sensor.battery_charge_and_export_power_limit
                  state: 'on'
                  for:
                    seconds: 30
                - condition: not
                  conditions:
                  - condition: state
                    entity_id: select.deye_6kw_battery_operation_mode
                    state: No Battery
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 15
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Boiler 1.2kW ON{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_off
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
            - action: switch.turn_on
              target:
                entity_id: switch.1561_boiler_ten_1_2_kwh
          - alias: 'Enable: Boiler 2.0kW ON (1.2 + 0.8)'
            conditions:
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'on'
            - condition: state
              entity_id: switch.1560_boiler_ten_0_8_kwh
              state: 'off'
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.grid_off_and_deye_6kw_charging_fast
                state: 'on'
              - alias: Surplus, unless the 6kW battery is idle (No Battery) - the 5kW
                  exports what its battery can't take, real curtailment is pv1
                condition: and
                conditions:
                - condition: state
                  entity_id: binary_sensor.battery_charge_and_export_power_limit
                  state: 'on'
                  for:
                    seconds: 30
                - condition: not
                  conditions:
                  - condition: state
                    entity_id: select.deye_6kw_battery_operation_mode
                    state: No Battery
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 15
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Boiler 2.0kW ON{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: switch.turn_on
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
          - alias: 'Enable: Export 5.5kW'
            conditions:
            - condition: numeric_state
              entity_id: input_number.export_deye_5kw_power
              below: 5500
            - condition: numeric_state
              entity_id: input_number.export_deye_5kw_power_base
              above: 1000
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.battery_charge_and_export_power_limit
                state: 'on'
                for:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Export 5.5kW{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: input_number.set_value
              target:
                entity_id: input_number.export_deye_5kw_power
              data:
                value: 5500
          - alias: 'Enable: Bedroom AC ON'
            conditions:
            - condition: not
              conditions:
              - condition: state
                entity_id: input_select.bedroom_ac
                state: 'off'
            - condition: state
              entity_id: climate.bedroom_ac
              state: 'off'
            - condition: state
              entity_id: binary_sensor.battery_deye_6kw_charged
              state: 'on'
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.battery_charge_and_export_power_limit
                state: 'on'
                for:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Bedroom AC ON{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: climate.set_hvac_mode
              data:
                hvac_mode: '{{ ''heat'' if is_state(''input_select.bedroom_ac'', ''heating'')
                  else ''cool'' }}'
              target:
                entity_id: climate.bedroom_ac
          - alias: 'Enable: Big Bedroom AC ON'
            conditions:
            - condition: not
              conditions:
              - condition: state
                entity_id: input_select.big_bedroom_ac
                state: 'off'
            - condition: state
              entity_id: climate.big_bedroom_ac
              state: 'off'
            - condition: state
              entity_id: binary_sensor.battery_deye_6kw_charged
              state: 'on'
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.battery_charge_and_export_power_limit
                state: 'on'
                for:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.pv1_5kw_lower_than_6kw
                state: 'on'
                for:
                  seconds: 30
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.last_script_trigger
              data:
                value: '{% set m %}Enable: Big Bedroom AC ON{% endset %}{{ m if m != states(''input_text.last_script_trigger'') else m ~ now().strftime('' (%H:%M:%S)'') }}'
            - action: climate.set_hvac_mode
              data:
                hvac_mode: '{{ ''heat'' if is_state(''input_select.big_bedroom_ac'',
                  ''heating'') else ''cool'' }}'
              target:
                entity_id: climate.big_bedroom_ac
    icon: mdi:solar-power-variant-outline
    description: ''
