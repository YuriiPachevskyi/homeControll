# Real-time power load cascade: one step per run, overload sheds loads
# (heating, export, boiler, 6kW charge, ACs), surplus adds them (6kW charge,
# boiler, export, ACs). Inputs: binary_sensor.any_device_high_power,
# binary_sensor.battery_charge_and_export_power_limit,
# binary_sensor.pv1_5kw_lower_than_6kw and friends
# (packages/energy/conditions.yaml). Every step is logged with
# script.energy_log; the automation spaces steps by that entity's
# last_reported.
#
# input_select.cascade_model picks where Export 5.5kW sits in the Enable
# order: after the boiler ladder (default) or right after the 6kW charge
# ladder. Disable always runs the Enable order in reverse.
input_select:
  cascade_model:
    name: Cascade model
    icon: mdi:stairs
    options:
      - Ba0.75->Ba1.5->Ba2.25->Bo0.8->Bo1.2->Bo2->Ex5.5
      - Ba0.75->Ba1.5->Ba2.25->Ex5.5->Bo0.8->Bo1.2->Bo2

automation:
  - id: '1773316386421'
    alias: Power load cascade
    initial_state: true
    description: Drives the power load cascade one step per run. Every 30 s normally;
      a new overload or surplus (on for 5 s) triggers a step right away, and while it
      lasts it steps every 15 s, but never sooner than 15 s after the last real load
      change (input_text.last_script_trigger; idle runs don't count), so the next step
      sees the measured effect of the previous one (Deye polls every 5 s).
    triggers:
    - entity_id:
      - script.power_load_cascade_step
      from:
      to:
      for:
        hours: 0
        minutes: 0
        seconds: 30
      trigger: state
      id: tick
    - entity_id:
      - script.power_load_cascade_step
      from:
      to:
      for:
        seconds: 15
      trigger: state
      id: tick_fast
    - trigger: state
      entity_id: binary_sensor.any_device_high_power
      to: 'on'
      for:
        seconds: 5
      id: overload
    - event: start
      trigger: homeassistant
    - trigger: event
      event_type: automation_reloaded
    - trigger: state
      entity_id:
      - binary_sensor.battery_charge_and_export_power_limit
      to: 'on'
      for:
        seconds: 5
      id: surplus
    conditions:
    - condition: or
      conditions:
      - condition: not
        conditions:
        - condition: trigger
          id:
          - tick_fast
          - overload
          - surplus
      - condition: and
        alias: 'Overload: step at most every 10 s'
        conditions:
        - condition: trigger
          id:
          - tick_fast
          - overload
        - condition: state
          entity_id: binary_sensor.any_device_high_power
          state: 'on'
        - condition: template
          value_template: '{{ now() - states.input_text.last_script_trigger.last_reported
            >= timedelta(seconds=15) }}'
      - condition: and
        alias: 'Surplus: step at most every 10 s'
        conditions:
        - condition: trigger
          id:
          - tick_fast
          - surplus
        - condition: state
          entity_id: binary_sensor.any_device_high_power
          state: 'off'
        - condition: state
          entity_id: binary_sensor.battery_charge_and_export_power_limit
          state: 'on'
        - condition: template
          value_template: '{{ now() - states.input_text.last_script_trigger.last_reported
            >= timedelta(seconds=15) }}'
    actions:
    - action: script.power_load_cascade_step
      data: {}
    mode: single

script:
  power_load_cascade_step:
    alias: Power load cascade step
    icon: mdi:solar-power-variant-outline
    description: >-
      One step of the power load cascade. Overload sheds the first load that
      can go (heating, export, boiler one step down, 6kW charge one step down,
      ACs), otherwise surplus adds the first one that can come (6kW charge one
      step up, boiler one step up, export, ACs). The boiler and the 6kW charge
      are ladders: one rung per run.
    sequence:
      - variables:
          charge: "{{ states('input_number.charge_power_deye_6kw') | float(0) }}"
          # Unknown SOC blocks the steps that need it below a level
          soc6: "{{ states('sensor.deye_6kw_battery') | float(100) }}"
          # Up to 2.25 kW; down never to 2.25 (more than 1.5, e.g. the 3 kW
          # of a grid loss, goes straight to 1.5)
          charge_steps_up: [0.75, 1.5, 2.25]
          charge_steps_down: [0, 0.75, 1.5]
          # Winter with a Save mode: the 6kW charge stays >= 1.5 kW
          charge_floor: "{{ 1.5 if is_state('binary_sensor.deye_6kw_winter_charge', 'on') else 0 }}"
          charge_down: "{{ charge_steps_down | select('<', charge) | max | default(none) }}"
          charge_up: "{{ charge_steps_up | select('>', charge) | min | default(none) }}"
          b08: "{{ is_state('switch.1560_boiler_ten_0_8_kwh', 'on') }}"
          b12: "{{ is_state('switch.1561_boiler_ten_1_2_kwh', 'on') }}"
          # Boiler ladder: 0 -> 0.8 -> 1.2 -> 2.0 kW, as (0.8 TEN, 1.2 TEN)
          boiler: "{{ ((0.8 if b08 else 0) + (1.2 if b12 else 0)) | round(1) }}"
          boiler_rungs:
            "0.0": [false, false]
            "0.8": [true, false]
            "1.2": [false, true]
            "2.0": [true, true]
          boiler_down: "{{ {2.0: 1.2, 1.2: 0.8, 0.8: 0.0}.get(boiler) }}"
          boiler_up: "{{ {0.8: 1.2, 1.2: 2.0}.get(boiler) }}"
          # Export 5.5kW before the boiler (and shed after it)
          export_first: "{{ is_state('input_select.cascade_model', 'Ba0.75->Ba1.5->Ba2.25->Ex5.5->Bo0.8->Bo1.2->Bo2') }}"
          # Export can still be raised to 5.5kW (same test as its Enable step);
          # never without the grid, so a grid loss still feeds the boiler
          export_up_ok: >-
            {{ states('input_number.export_deye_5kw_power') | float(0) < 5500
               and states('input_number.export_deye_5kw_power_base') | float(0) > 1000
               and not is_state('binary_sensor.deye_5kw_grid', 'off') }}
          no_battery_6kw: "{{ is_state('select.deye_6kw_battery_operation_mode', 'No Battery') }}"
          charged_6kw: "{{ states('binary_sensor.battery_deye_6kw_charged') }}"
          grid_off_fast: "{{ is_state('binary_sensor.grid_off_and_deye_6kw_charging_fast', 'on') }}"
          surplus: "{{ is_state('binary_sensor.battery_charge_and_export_power_limit', 'on') }}"
          surplus_30: >-
            {{ surplus and now() - states.binary_sensor.battery_charge_and_export_power_limit.last_changed
               >= timedelta(seconds=30) }}
          pv1: "{{ is_state('binary_sensor.pv1_5kw_lower_than_6kw', 'on') }}"
          pv1_15: >-
            {{ pv1 and now() - states.binary_sensor.pv1_5kw_lower_than_6kw.last_changed
               >= timedelta(seconds=15) }}
          pv1_30: >-
            {{ pv1 and now() - states.binary_sensor.pv1_5kw_lower_than_6kw.last_changed
               >= timedelta(seconds=30) }}
          # Shed in this order on overload (off_below: 6kW SOC), added in the
          # reverse order on surplus
          acs:
            - climate: climate.big_bedroom_ac
              select: input_select.big_bedroom_ac
              label: Big Bedroom
              off_below: 71
            - climate: climate.bedroom_ac
              select: input_select.bedroom_ac
              label: Bedroom
              off_below: 51
          ac_off: >-
            {% set ns = namespace(r=none) %}
            {% for a in acs if ns.r is none and not is_state(a.climate, 'off')
                              and not is_state(a.select, 'off') and soc6 < a.off_below %}
              {% set ns.r = a %}
            {% endfor %}
            {{ ns.r }}
          ac_on: >-
            {% set ns = namespace(r=none) %}
            {% for a in acs | reverse if ns.r is none and is_state(a.climate, 'off')
                                        and not is_state(a.select, 'off') %}
              {% set ns.r = a %}
            {% endfor %}
            {{ ns.r }}
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.any_device_high_power
                state: "on"
            sequence:
              - choose:
                  # Electric heating is only switched on by hand (Home, Heating
                  # row); any of its relays on means it goes down first.
                  - alias: "Disable: Turn off Heating"
                    conditions:
                      - condition: or
                        conditions:
                          - condition: state
                            entity_id: switch.1562_heating_main
                            state: "on"
                          - condition: state
                            entity_id: switch.1563_heating_ten_1_5_kwh
                            state: "on"
                          - condition: state
                            entity_id: switch.1564_heating_ten_3_kwh
                            state: "on"
                    sequence:
                      - action: script.energy_log
                        data:
                          message: "Disable: Heating OFF"
                      - action: switch.turn_off
                        target:
                          entity_id:
                            - switch.1562_heating_main
                            - switch.1563_heating_ten_1_5_kwh
                            - switch.1564_heating_ten_3_kwh
                  # Export first model: the boiler goes down first, export after it
                  - alias: "Disable: Export back to state value"
                    conditions:
                      - condition: template
                        value_template: >-
                          {{ states('input_number.export_deye_5kw_power') | float(0)
                             > states('input_number.export_deye_5kw_power_base') | float(0)
                             and (not export_first or boiler_down is none) }}
                    sequence:
                      - action: script.energy_log
                        data:
                          message: >-
                            Disable: Export -> {{ states('input_number.export_deye_5kw_power_base') | int(0) }}W
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.export_deye_5kw_power
                        data:
                          value: "{{ states('input_number.export_deye_5kw_power_base') | float(0) }}"
                  - alias: "Disable: Boiler one step down"
                    conditions:
                      - condition: template
                        value_template: "{{ boiler_down is not none }}"
                    sequence:
                      - action: script.energy_log
                        data:
                          message: >-
                            Disable: Boiler {{ boiler }}{{ ' OFF' if boiler_down == 0 else ' -> ' ~ boiler_down }}
                      - action: script.boiler_set
                        data:
                          rung: "{{ boiler_rungs[boiler_down | string] }}"
                  - alias: "Disable: 6kW charge one step down"
                    conditions:
                      - condition: template
                        value_template: >-
                          {{ soc6 < 95 and charge_down is not none and charge_down >= charge_floor }}
                    sequence:
                      - action: script.energy_log
                        data:
                          message: >-
                            {{ 'Disable: Charge to 0kW' if charge_down == 0
                               else 'Disable: Reducing Charge to ' ~ charge_down ~ 'kW' }}
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.charge_power_deye_6kw
                        data:
                          value: "{{ charge_down }}"
                  - alias: "Disable: AC OFF (6kW battery low)"
                    conditions:
                      - condition: template
                        value_template: "{{ ac_off is not none }}"
                    sequence:
                      - action: script.energy_log
                        data:
                          message: >-
                            Disable: {{ ac_off.label }} AC OFF (Battery <= {{ ac_off.off_below - 1 }}%)
                      - action: climate.turn_off
                        target:
                          entity_id: "{{ ac_off.climate }}"
          - conditions:
              - condition: state
                entity_id: binary_sensor.any_device_high_power
                state: "off"
            sequence:
              - choose:
                  - alias: "Enable: 6kW charge one step up"
                    conditions:
                      - condition: template
                        value_template: >-
                          {{ charge_up is not none and charged_6kw == 'off' and soc6 < 95
                             and not no_battery_6kw and (pv1_30 or surplus) }}
                    sequence:
                      - action: script.energy_log
                        data:
                          message: "Enable: Charge {{ charge_up }}kW"
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.charge_power_deye_6kw
                        data:
                          value: "{{ charge_up }}"
                  # First rung reacts at once to a sudden surplus, the next
                  # ones wait 30 s to see what the inverter did; pv1 curtailment
                  # is the other way round (30 s, then 15 s)
                  - alias: "Enable: Boiler 0.8kW ON"
                    conditions:
                      - condition: template
                        value_template: >-
                          {{ boiler == 0 and not (export_first and export_up_ok)
                             and (grid_off_fast or pv1_30 or (surplus and not no_battery_6kw)) }}
                    sequence:
                      - action: script.energy_log
                        data:
                          message: "Enable: Boiler 0.8kW ON"
                      - action: script.boiler_set
                        data:
                          rung: "{{ boiler_rungs['0.8'] }}"
                  - alias: "Enable: Boiler one step up (1.2 / 2.0 kW)"
                    conditions:
                      - condition: template
                        value_template: >-
                          {{ boiler_up is not none and not (export_first and export_up_ok)
                             and (grid_off_fast or (surplus_30 and not no_battery_6kw) or pv1_15) }}
                    sequence:
                      - action: script.energy_log
                        data:
                          message: "Enable: Boiler {{ boiler_up }}kW ON"
                      - action: script.boiler_set
                        data:
                          rung: "{{ boiler_rungs[boiler_up | string] }}"
                  - alias: "Enable: Export 5.5kW"
                    conditions:
                      - condition: numeric_state
                        entity_id: input_number.export_deye_5kw_power
                        below: 5500
                      - condition: numeric_state
                        entity_id: input_number.export_deye_5kw_power_base
                        above: 1000
                      - condition: template
                        value_template: "{{ surplus_30 or pv1_30 }}"
                    sequence:
                      - action: script.energy_log
                        data:
                          message: "Enable: Export 5.5kW"
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.export_deye_5kw_power
                        data:
                          value: 5500
                  - alias: "Enable: AC ON (6kW battery full)"
                    conditions:
                      - condition: template
                        value_template: >-
                          {{ ac_on is not none and charged_6kw == 'on' and (surplus_30 or pv1_30) }}
                    sequence:
                      - action: script.energy_log
                        data:
                          message: "Enable: {{ ac_on.label }} AC ON"
                      - action: climate.set_hvac_mode
                        target:
                          entity_id: "{{ ac_on.climate }}"
                        data:
                          hvac_mode: "{{ 'heat' if is_state(ac_on.select, 'heating') else 'cool' }}"
