# Librus Synergia (school e-diary) - see configuration/librus/.
#
# The integration's own polling (every 20 min, dozens of Librus requests
# each time, around the clock) got the HA server's IP blocked by Librus on
# 2026-09-24. So its polling is switched off (config entry system option
# "Enable polling updates" = off) and Librus is refreshed only three times a
# day: around 07:00, 13:00 and 18:00 Polish time - each run starts at a
# random moment within +-20 min of that, so the requests don't hit Librus
# at the same second every day. On Saturdays and Sundays (no school) only
# the evening refresh runs - the Sunday one also brings the weekly data
# (see librus/apply_local_patches.py patch 6). HA runs on Kyiv time, which is
# one hour ahead of Warsaw all year (both switch DST on the same EU dates).
# Between refreshes the next/current lesson and next exam sensors recompute
# "now" every minute from the cached data (local patch 4 in
# librus/apply_local_patches.py) - no Librus request.
#
# No entity ids here on purpose - they carry the child's name and this repo
# is public.
automation:
  - id: librus_scheduled_refresh
    alias: "Librus - refresh 3x a day"
    description: Fetch fresh data from Librus around 07:00, 13:00 and 18:00
      Polish time (08:00/14:00/19:00 Kyiv), each at a random moment within
      +-20 min - one refresh of every loaded Librus entry (the integration's
      own refresh service, debounced).
    triggers:
      - trigger: time
        at: "07:40:00"
        id: morning
      - trigger: time
        at: "13:40:00"
        id: midday
      - trigger: time
        at: "18:40:00"
        id: evening
    conditions:
      - condition: or
        conditions:
          - condition: trigger
            id: evening
          - condition: time
            weekday: [mon, tue, wed, thu, fri]
    actions:
      # School free days (holidays, breaks - whatever the school entered in
      # Librus; the integration's free-days calendar, read from the data it
      # already has - no Librus request) get only the evening run, like
      # weekends. The calendar is looked up by its suffix - its entity id
      # carries the child's name.
      - if:
          - condition: template
            value_template: "{{ trigger.id != 'evening' }}"
        then:
          - action: calendar.get_events
            target:
              entity_id: >-
                {{ states.calendar | map(attribute='entity_id')
                   | select('search', '_free_days$') | list }}
            data:
              duration:
                minutes: 1
            response_variable: free_days
          - condition: template
            value_template: >-
              {{ free_days.values() | map(attribute='events') | sum(start=[]) | count == 0 }}
      # 0-40 min random wait -> the refresh lands 20 min before to 20 min after
      - delay:
          seconds: "{{ range(0, 2400) | random }}"
      - action: librus_synergia.refresh
    mode: single

  - id: librus_route_changed_notify
    alias: "Librus - route changed (Telegram)"
    description: Every Librus refresh fires a `librus_route` event with the route
      it used - "direct" (from this server, Ukraine) or "rpi5" (the fallback
      proxy on raspberrypi5 in Poland, local patch 5/6). When it differs from
      the last one (input_select.librus_route), tell Yurii and Kateryna on
      Telegram - only on a change. Not notify_all - that one also goes to
      Nataliya.
    triggers:
      - trigger: event
        event_type: librus_route
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.route in ['direct', 'rpi5']
             and trigger.event.data.route != states('input_select.librus_route') }}
    actions:
      - variables:
          route: "{{ trigger.event.data.route }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.librus_route
        data:
          option: "{{ route }}"
      - action: telegram_bot.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.yurii_p
            - notify.kateryna
        data:
          title: Librus
          message: |-
            {% if route == 'direct' -%}
            🕐 {{ now().strftime('%H:%M') }} ✅ Librus знову доступний з України
            Маршрут: напряму з rpi4
            {%- else -%}
            🕐 {{ now().strftime('%H:%M') }} ⚠️ Librus недоступний з України
            Маршрут: через rpi5 (Польща)
            {%- endif %}
    mode: queued

  - id: librus_refreshed_mark
    alias: "Librus - remember last successful refresh"
    description: Every successful Librus refresh fires `librus_refreshed` (local
      patch 6); keep its time for the stale-data alert below.
    triggers:
      - trigger: event
        event_type: librus_refreshed
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.librus_last_refresh
        data:
          timestamp: "{{ now().timestamp() }}"
    mode: queued

  - id: librus_stale_data_alert
    alias: "Librus - stale data alert (Telegram)"
    description: The dashboard keeps showing cached data when a refresh fails
      (local patch 6), so a failure is silent. Every evening after the last
      scheduled refresh, if none succeeded for over 30 h (weekends have only
      the evening run, ~24 h apart), tell Yurii and Kateryna.
    triggers:
      - trigger: time
        at: "20:00:00"
    conditions:
      - condition: template
        value_template: >-
          {{ now().timestamp() - (state_attr('input_datetime.librus_last_refresh', 'timestamp') or 0) > 30 * 3600 }}
    actions:
      - action: telegram_bot.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.yurii_p
            - notify.kateryna
        data:
          title: Librus
          message: |-
            🕐 {{ now().strftime('%H:%M') }} ⚠️ Librus не оновлюється!!!
            Останнє оновлення: {{ as_datetime(state_attr('input_datetime.librus_last_refresh', 'timestamp')) | as_local
            | as_timestamp | timestamp_custom('%d.%m %H:%M') if state_attr('input_datetime.librus_last_refresh', 'timestamp') else 'невідомо' }}
    mode: single

  - id: librus_news_notify
    alias: "Librus - new grades and messages (Telegram)"
    description: >-
      After each successful refresh the integration fires
      `librus_news` with the grades and inbox messages that were not there
      before (local patch 6; compared with the previous data, so restarts
      re-announce nothing). Grades - one Telegram message. Letters - one
      message each with the full text, then its attachments as documents
      (saved under /config/librus/attachments by the patch). To Yurii and
      Kateryna only (not notify_all - that one also goes to Nataliya).
    triggers:
      - trigger: event
        event_type: librus_news
    actions:
      - variables:
          grades: "{{ trigger.event.data.grades | default([]) }}"
          messages: "{{ trigger.event.data.messages | default([]) }}"
      - if:
          - condition: template
            value_template: "{{ grades | count > 0 }}"
        then:
          - action: telegram_bot.send_message
            continue_on_error: true
            target:
              entity_id:
                - notify.yurii_p
                - notify.kateryna
            data:
              title: Librus
              parse_mode: plain_text
              message: |-
                🕐 {{ now().strftime('%H:%M') }} ⭐ {{ 'Нова оцінка' if grades | count == 1 else 'Нові оцінки (' ~ grades | count ~ ')' }}!!!
                {%- for g in grades %}
                {{ g.subject }}: {{ g.value }}
                {%- endfor %}
      # one Telegram message per letter (full text), then its attachments
      - repeat:
          for_each: "{{ messages }}"
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              target:
                entity_id:
                  - notify.yurii_p
                  - notify.kateryna
              data:
                title: Librus
                parse_mode: plain_text
                message: |-
                  🕐 {{ now().strftime('%H:%M') }} ✉️ Новий лист!!!
                  {{ repeat.item.sender }}: {{ repeat.item.topic }}{{ (' 📎 ' ~ repeat.item.files | count) if repeat.item.files else '' }}


                  {{ repeat.item.content }}
                inline_keyboard:
                  - "🇺🇦 Переклад:/librus_translate"
            - repeat:
                for_each: "{{ repeat.item.files }}"
                sequence:
                  - action: telegram_bot.send_document
                    continue_on_error: true
                    target:
                      entity_id:
                        - notify.yurii_p
                        - notify.kateryna
                    data:
                      file: "{{ repeat.item }}"
    mode: queued

  - id: librus_translate_button
    alias: "Librus - translate a letter on tap (Telegram)"
    description: >-
      A tap on "🇺🇦 Переклад" under a letter (callback "/librus_translate")
      translates the letter (the lines after "Новий лист") from Polish to
      Ukrainian via rest_command.librus_translate and appends it to the same
      Telegram message; the edit drops the button. If Polish + Ukrainian don't
      fit Telegram's 4096-char limit, the translation comes as a reply
      instead. Only the tapped letter is sent to the translator.
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: /librus_translate
    actions:
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Перекладаю…"
      - variables:
          original: "{{ trigger.event.data.message.text | default('') }}"
          body: >-
            {%- set lines = original.split('\n') -%}
            {%- set ns = namespace(start=0) -%}
            {%- for l in lines -%}{%- if ns.start == 0 and 'Новий лист' in l -%}{%- set ns.start = loop.index -%}{%- endif -%}{%- endfor -%}
            {{ lines[ns.start:] | join('\n') | trim }}
      - action: rest_command.librus_translate
        continue_on_error: true
        response_variable: tr
        data:
          text: "{{ body }}"
      - variables:
          translation: >-
            {%- set c = tr.content if tr is defined and tr.status == 200 else none -%}
            {{ (c[0] if c is not string and c is not none else '') | trim }}
      - choose:
          - conditions: "{{ translation == '' }}"
            sequence:
              - action: telegram_bot.send_message
                continue_on_error: true
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  reply_to_message_id: "{{ trigger.event.data.message.message_id }}"
                  parse_mode: plain_text
                  message: "⚠️ Не вдалося перекласти, спробуй ще раз пізніше"
          - conditions: "{{ (original | length) + (translation | length) + 20 <= 4096 }}"
            sequence:
              - action: telegram_bot.edit_message
                data:
                  chat_id: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id }}"
                  parse_mode: plain_text
                  message: |-
                    {{ original }}

                    🇺🇦 Переклад:
                    {{ translation }}
        default:
          - action: telegram_bot.edit_replymarkup
            continue_on_error: true
            data:
              chat_id: "{{ trigger.event.data.chat_id }}"
              message_id: "{{ trigger.event.data.message.message_id }}"
              inline_keyboard: []
          - action: telegram_bot.send_message
            data:
              chat_id: "{{ trigger.event.data.chat_id }}"
              reply_to_message_id: "{{ trigger.event.data.message.message_id }}"
              parse_mode: plain_text
              message: |-
                🇺🇦 Переклад:
                {{ translation[:4000] }}
    mode: queued

  - id: librus_update_available_notify
    alias: "Librus - HACS update available (Telegram)"
    description: A new version of the Librus integration or its cards showed up
      in HACS. Installing it wipes our local patches (librus/apply_local_patches.py)
      - remind Yurii what to do after the update.
    triggers:
      - trigger: state
        entity_id:
          - update.librus_synergia_unofficial_update
          - update.librus_synergia_cards_update
        from: "off"
        to: "on"
    actions:
      - action: telegram_bot.send_message
        continue_on_error: true
        target:
          entity_id: notify.yurii_p
        data:
          title: Librus
          parse_mode: plain_text
          message: |-
            🕐 {{ now().strftime('%H:%M') }} 🆕 Оновлення {{ state_attr(trigger.entity_id, 'friendly_name') | regex_replace(' [Uu]pdate$', '') }}: {{ state_attr(trigger.entity_id, 'installed_version') }} → {{ state_attr(trigger.entity_id, 'latest_version') }}
            Після встановлення: apply_local_patches.py + перезапуск HA
    mode: queued

  - id: librus_local_patches_missing_notify
    alias: "Librus - local patches missing (Telegram)"
    description: sensor.librus_local_patches lists the integration/cards files
      that lost our patch markers - i.e. a HACS update replaced them. Without
      the patches the integration polls Librus every 20 min (the reason Librus
      blocked us) and has no rpi5 fallback route. Tell Yurii to re-run
      librus/apply_local_patches.py.
    triggers:
      - trigger: state
        entity_id: sensor.librus_local_patches
        for:
          minutes: 5
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['ok', 'unknown', 'unavailable'] }}
    actions:
      - action: telegram_bot.send_message
        continue_on_error: true
        target:
          entity_id: notify.yurii_p
        data:
          title: Librus
          parse_mode: plain_text
          message: |-
            🕐 {{ now().strftime('%H:%M') }} ⚠️ Librus без наших правок: {{ trigger.to_state.state }}
            Запусти apply_local_patches.py і перезапусти HA
    mode: single

  - id: gurtki_reminder_notify
    alias: "Гуртки - reminder 30 min before (Telegram)"
    description: Activities outside Librus (music etc.) that Yurii/Kateryna add
      to the HA Local Calendar "Гуртки" (shown on the Librus dashboard's
      Calendar tab) - remind both on Telegram 30 minutes before each one. The
      school is in Poland, so the start time is given in Polish time (Kyiv
      minus 1 h all year).
    triggers:
      - trigger: calendar
        entity_id: calendar.gurtki
        event: start
        offset: "-0:30:00"
    actions:
      - action: telegram_bot.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.yurii_p
            - notify.kateryna
        data:
          title: Гуртки
          parse_mode: plain_text
          message: |-
            🕐 {{ now().strftime('%H:%M') }} 🎵 Через 30 хвилин: {{ trigger.calendar_event.summary }}
            Початок о {{ (as_timestamp(trigger.calendar_event.start) - 3600) | timestamp_custom('%H:%M') }} за Польщею{{ (' · ' ~ trigger.calendar_event.location) if trigger.calendar_event.location else '' }}
    mode: queued

# Polish -> Ukrainian for the "Переклад" button (librus_translate_button).
# Google's Chrome-extension endpoint: no key; the plain translate.googleapis
# "gtx" one answers this IP with 429. Response: ["<translation>"].
rest_command:
  librus_translate:
    url: "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=pl&tl=uk"
    method: post
    content_type: application/x-www-form-urlencoded
    payload: "q={{ text | urlencode }}"
    timeout: 30

input_select:
  librus_route:
    # Last route a Librus refresh used - kept by librus_route_changed_notify.
    name: "Librus route"
    options:
      - direct
      - rpi5
    icon: mdi:routes

input_datetime:
  librus_last_refresh:
    # Time of the last successful Librus refresh - kept by librus_refreshed_mark.
    name: "Librus last refresh"
    has_date: true
    has_time: true
    icon: mdi:update

command_line:
  - sensor:
      # "ok", or the Librus integration/cards files that have fewer
      # "homeControll local patch" markers than expected - a HACS update
      # replaced them. Expected counts = markers after apply_local_patches.py;
      # update them when a patch is added or dropped. Local files only, no
      # Librus request.
      name: "Librus local patches"
      unique_id: librus_local_patches
      icon: mdi:bandage
      command: >-
        m=""; for e in custom_components/librus_synergia/__init__.py:1
        custom_components/librus_synergia/calendar.py:1
        custom_components/librus_synergia/coordinator.py:8
        custom_components/librus_synergia/sensor.py:3
        custom_components/librus_synergia/services.py:1
        custom_components/librus_synergia/librus_api/client.py:1
        www/community/ha-librus-synergia-cards/librus-synergia-cards.js:2;
        do f=${e%:*}; n=$(grep -c "homeControll local patch" "/config/$f" 2>/dev/null);
        [ "${n:-0}" -ge "${e##*:}" ] || m="$m ${f##*/}"; done; echo "${m:-ok}"
      value_template: "{{ value | trim }}"
      scan_interval: 1800
