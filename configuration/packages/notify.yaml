# Backs the notifications list on the Overview "Other" tab (custom:notify-log-card,
# www/notify-log-card.js): the full history of Telegram notifications, each with a
# delete button (script.delete_notification_slot) that removes the message for
# everyone while it is younger than Telegram's ~48h limit. Data written by
# notify/notify_log.py via the notify_log_append/notify_log_remove shell_commands.
command_line:
  - sensor:
      name: "Telegram Notify Log"
      unique_id: telegram_notify_log
      command: "cat /config/notify/notify_log.json"
      value_template: "{{ value_json.rows | count }}"
      json_attributes:
        - rows
      scan_interval: 3600

recorder:
  exclude:
    entities:
      # The whole history sits in its attributes; nothing to graph.
      - sensor.telegram_notify_log

shell_command:
  notify_log_append: 'python3 /config/notify/notify_log.py append "{{ payload_b64 }}"'
  notify_log_remove: 'python3 /config/notify/notify_log.py remove {{ slot }}'

script:
  notify_all:
    alias: Notify (Telegram)
    description: Sends the same notification to Telegram recipients (default
      the family - Yurii, Kateryna, Nataliya) and logs the sent chat/message IDs
      into notify/notify_log.json (full history, newest first) so any of them can be
      deleted for everyone from the "Сповіщення" dashboard tab or
      script.delete_notification_slot / script.delete_last_notification.
      Recipients and groups are defined only here.
    fields:
      title:
        description: Notification title
        example: Boiler
      message:
        description: Notification text
        example: Boiler is heated
      to:
        description: >-
          A group (family, parents, parents_and_daughter, yurii_only) or a
          list of people (yurii, kateryna, nataliya, daughter); default family
        example: parents
      parse_mode:
        description: Telegram parse mode (default the bot's, Markdown)
        example: plain_text
    mode: parallel
    variables:
      people:
        yurii: notify.yurii_p
        kateryna: notify.kateryna
        nataliya: notify.nataliya
        daughter: notify.daughter
      groups:
        family: [yurii, kateryna, nataliya]
        parents: [yurii, kateryna]
        # Librus grades, Гуртки
        parents_and_daughter: [yurii, kateryna, daughter]
        yurii_only: [yurii]
    sequence:
    - variables:
        names: >-
          {% set t = to | default('family') %}
          {{ groups[t] if t is string and t in groups else [t] if t is string else t }}
        targets: >-
          {% set ns = namespace(l=[]) %}
          {% for n in names if n in people %}{% set ns.l = ns.l + [people[n]] %}{% endfor %}
          {{ ns.l }}
    - action: telegram_bot.send_message
      continue_on_error: true
      target:
        entity_id: '{{ targets }}'
      data: >-
        {{ dict(title=title, message=message,
                **({'parse_mode': parse_mode} if parse_mode is defined else {})) }}
      response_variable: send_result
    - action: script.notify_log_record
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        chats: '{{ send_result.chats | default([]) if send_result is defined else [] }}'

  notify_log_record:
    alias: Log a sent Telegram notification
    description: Adds a sent notification to notify/notify_log.json so it shows on
      the "Сповіщення" dashboard tab and can be deleted for everyone. Call it right
      after any telegram_bot.send_* that bypasses script.notify_all, passing the
      `chats` list from its response_variable (for several messages that belong
      together, e.g. a letter and its attachments, pass all of their chats in one
      list - one row, one delete). Does nothing for an empty list.
    fields:
      title:
        description: Notification title
        example: Librus
      message:
        description: Notification text, as shown in the log
        example: New grade
      chats:
        description: '[{chat_id, message_id}, ...] from the send response'
        example: '[{"chat_id": 612533502, "message_id": 123}]'
      keep_single:
        description: Log it even if it went to one chat only (default false)
        example: true
      replaces:
        description: '[{chat_id, message_id}, ...] of a deleted predecessor whose
          row is dropped'
        example: '[]'
    mode: queued
    max: 50
    sequence:
    - if:
      - condition: template
        value_template: '{{ chats is defined and chats | count > 0 }}'
      then:
      - action: shell_command.notify_log_append
        data:
          payload_b64: "{{ ({'ts': now().strftime('%Y-%m-%d %H:%M:%S'), 'title': title,
            'message': message, 'chats': chats, 'keep_single': keep_single | default(false),
            'replaces': replaces | default([])} | tojson) | base64_encode }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.telegram_notify_log
        data: {}
  delete_notification_slot:
    alias: Delete Telegram notification (all recipients)
    description: Deletes, for everyone, the notification at the given row of
      notify/notify_log.json (slot 1 = most recent), then removes that row from
      the log. Used by the per-row delete button on the "Сповіщення" dashboard
      tab. Only works while the message is less than ~48h old (Telegram Bot API
      limit) and hasn't been deleted already.
    fields:
      slot:
        description: Row number, 1 = most recent notification
        example: 1
    mode: queued
    sequence:
    - variables:
        rows: "{{ state_attr('sensor.telegram_notify_log', 'rows') or [] }}"
        entry: "{{ rows[slot | int - 1] if (slot | int - 1) < (rows | count) else none }}"
    - if:
      - condition: template
        value_template: '{{ entry is not none }}'
      then:
      - repeat:
          for_each: '{{ entry.chats }}'
          sequence:
          - action: telegram_bot.delete_message
            continue_on_error: true
            data:
              chat_id: '{{ repeat.item.chat_id }}'
              message_id: '{{ repeat.item.message_id }}'
      - action: shell_command.notify_log_remove
        data:
          slot: '{{ slot }}'
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.telegram_notify_log
        data: {}
  delete_last_notification:
    alias: Delete last Telegram notification (all recipients)
    description: Convenience alias for script.delete_notification_slot with slot 1
      - deletes the most recently sent notification for everyone.
    mode: single
    sequence:
    - action: script.delete_notification_slot
      data:
        slot: 1
