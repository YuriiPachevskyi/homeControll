# Backs the "Сповіщення" dashboard tab: last 10 Telegram notifications sent via
# script.notify_all, each with a per-row delete button (script.delete_notification_slot)
# that removes the message for everyone. Data written by notify/notify_log.py via the
# notify_log_append/notify_log_remove shell_commands (configuration.yaml).
command_line:
  - sensor:
      name: "Telegram Notify Log"
      unique_id: telegram_notify_log
      command: "cat /config/notify/notify_log.json"
      value_template: "{{ value_json.rows | count }}"
      json_attributes:
        - rows
      scan_interval: 3600

template:
  # Row name = message text as sent (newlines flattened), state = send date
  # (the message itself already starts with the time), title in attribute.
  - sensor:
      - name: >-
          {% set rows = state_attr('sensor.telegram_notify_log', 'rows') or [] %}
          {{ (rows[0].message | replace('\n', ' · '))[:120] if rows | count >= 1 else '—' }}
        unique_id: telegram_notify_1
        icon: mdi:message-text-outline
        state: >-
          {% set rows = state_attr('sensor.telegram_notify_log', 'rows') or [] %}
          {% if rows | count >= 1 %}{% set ts = rows[0].ts %}{{ ts[8:10] ~ '.' ~ ts[5:7] }}{% else %}—{% endif %}
        attributes:
          title: "{{ (state_attr('sensor.telegram_notify_log', 'rows') or [])[0].title if (state_attr('sensor.telegram_notify_log', 'rows') or []) | count >= 1 else '' }}"
          message: "{{ (state_attr('sensor.telegram_notify_log', 'rows') or [])[0].message if (state_attr('sensor.telegram_notify_log', 'rows') or []) | count >= 1 else '' }}"
      - name: >-
