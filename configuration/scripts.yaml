power_load_disable_device_duplicate:
  alias: Power load. Disable device CASCADE WORK
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.any_device_high_power
        state: 'on'
      sequence:
      - choose:
        - alias: 'High Power Step 1: Turn off Heating'
          conditions:
          - condition: state
            entity_id: switch.1562_heating_main
            state:
            - 'on'
          sequence:
          - action: switch.turn_off
            metadata: {}
            target:
              entity_id:
              - switch.1562_heating_main
              - switch.1563_heating_ten_1_5_kwh
              - switch.1564_heating_ten_3_kwh
            data: {}
        - alias: 'High Power Step 2: Boiler 1.2 -> 0.8'
          conditions:
          - condition: state
            entity_id: switch.1561_boiler_ten_1_2_kwh
            state: 'on'
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'High Power: Boiler 1.2 -> 0.8 ({{ now().strftime(''%H:%M:%S'')
                }})'
          - action: switch.turn_off
            target:
              entity_id: switch.1561_boiler_ten_1_2_kwh
          - action: switch.turn_on
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
        - alias: 'High Power Step 3: Reduce Charge to 1kW'
          conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            above: 1.7
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'High Power: Reducing Charge to 1kW ({{ now().strftime(''%H:%M:%S'')
                }})'
          - action: input_number.set_value
            data:
              value: 1
            target:
              entity_id: input_number.charge_power_deye_6kw
        - alias: 'High Power Step 4: Boiler 0.8 OFF'
          conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'on'
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'High Power: Boiler 0.8 OFF ({{ now().strftime(''%H:%M:%S'')
                }})'
          - action: switch.turn_off
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
        - alias: 'High Power Step 5: Charge to 0kW'
          conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            above: 0.95
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'High Power: Charge to 0kW ({{ now().strftime(''%H:%M:%S'') }})'
          - action: input_number.set_value
            data:
              value: 0
            target:
              entity_id: input_number.charge_power_deye_6kw
        - alias: 'High Power Step 6: Big Bedroom AC OFF'
          conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: climate.big_bedroom_ac
              state: 'off'
          - condition: not
            conditions:
            - condition: state
              entity_id: input_select.big_bedroom_ac
              state: 'off'
          - condition: numeric_state
            entity_id: sensor.deye_6kw_battery
            below: 91
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'High Power: Big Bedroom AC OFF (Battery <= 70%) ({{ now().strftime(''%H:%M:%S'')
                }})'
          - action: climate.turn_off
            target:
              entity_id: climate.big_bedroom_ac
        - alias: 'High Power Step 7: Bedroom AC OFF'
          conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: climate.bedroom_ac
              state: 'off'
          - condition: not
            conditions:
            - condition: state
              entity_id: input_select.bedroom_ac
              state: 'off'
          - condition: numeric_state
            entity_id: sensor.deye_6kw_battery
            below: 51
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'High Power: Bedroom AC OFF (Battery <= 50%) ({{ now().strftime(''%H:%M:%S'')
                }})'
          - action: climate.turn_off
            target:
              entity_id: climate.bedroom_ac
    - conditions:
      - condition: state
        entity_id: binary_sensor.any_device_high_power
        state: 'off'
      sequence:
      - choose:
        - alias: 'Restore Step 1: Charge Power 1kW'
          conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            below: 1
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state: 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'Restore: Charge 1kW ({{ now().strftime(''%H:%M:%S'') }})'
          - action: input_number.set_value
            data:
              value: 1
            target:
              entity_id: input_number.charge_power_deye_6kw
        - alias: 'Restore Step 2: Boiler 0.8kW ON'
          conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.grid_off_and_deye_5kw_high_battery
              state: 'on'
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'Restore: Boiler 0.8kW ON ({{ now().strftime(''%H:%M:%S'') }})'
          - action: switch.turn_on
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
            data: {}
        - alias: 'Restore Step 3: Charge Power 2kW'
          conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            below: 1.75
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state:
            - 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'Restore: Charge 1.75kW ({{ now().strftime(''%H:%M:%S'') }})'
          - action: input_number.set_value
            data:
              value: 1.75
            target:
              entity_id: input_number.charge_power_deye_6kw
        - alias: 'Restore Step 4: Boiler 1.2kW ON (Switch from 0.8)'
          conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'on'
          - condition: state
            entity_id: switch.1561_boiler_ten_1_2_kwh
            state: 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.grid_off_and_deye_5kw_high_battery
              state: 'on'
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'Restore: Boiler 1.2kW ON ({{ now().strftime(''%H:%M:%S'') }})'
          - action: switch.turn_on
            target:
              entity_id: switch.1561_boiler_ten_1_2_kwh
          - action: switch.turn_off
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
        - alias: 'Restore Step 5: Bedroom AC ON'
          conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: input_select.bedroom_ac
              state: 'off'
          - condition: state
            entity_id: climate.bedroom_ac
            state: 'off'
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state: 'on'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'Restore: Bedroom AC ON ({{ now().strftime(''%H:%M:%S'') }})'
          - action: climate.set_hvac_mode
            data:
              hvac_mode: '{{ ''heat'' if is_state(''input_select.bedroom_ac'', ''heating'')
                else ''cool'' }}'
            target:
              entity_id: climate.bedroom_ac
        - alias: 'Restore Step 6: Big Bedroom AC ON'
          conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: input_select.big_bedroom_ac
              state: 'off'
          - condition: state
            entity_id: climate.big_bedroom_ac
            state: 'off'
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state: 'on'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.last_script_trigger
            data:
              value: 'Restore: Big Bedroom AC ON ({{ now().strftime(''%H:%M:%S'')
                }})'
          - action: climate.set_hvac_mode
            data:
              hvac_mode: '{{ ''heat'' if is_state(''input_select.big_bedroom_ac'',
                ''heating'') else ''cool'' }}'
            target:
              entity_id: climate.big_bedroom_ac
  icon: mdi:solar-power-variant-outline
  description: ''
