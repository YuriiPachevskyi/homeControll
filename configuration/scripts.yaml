power_load_disable_device_duplicate:
  alias: Power load. Disable device CASCADE WORK
  sequence:
  - if:
    - condition: or
      conditions:
      - type: is_power
        condition: device
        device_id: f6c638d30b7111c48069aa655490cd8a
        entity_id: 2a7890bbd223fafe420a3ed792187ddd
        domain: sensor
        above: 300
      - type: is_power
        condition: device
        device_id: f6c638d30b7111c48069aa655490cd8a
        entity_id: 208069ecbf43d1c4d2a5d5d78c319f87
        domain: sensor
        above: 600
      - type: is_power
        condition: device
        device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
        entity_id: 0124cde1985f8caf83b525ca9de4902c
        domain: sensor
        above: 600
    then:
    - if:
      - condition: and
        conditions:
        - condition: state
          entity_id: switch.1562_heating_main
          state: 'on'
        - condition: state
          entity_id: switch.1564_heating_ten_3_kwh
          state: 'on'
        - condition: state
          entity_id: switch.1563_heating_ten_1_5_kwh
          state: 'on'
      then:
      - data: {}
        target:
          entity_id: switch.1563_heating_ten_1_5_kwh
        action: switch.turn_off
      else:
      - if:
        - condition: and
          conditions:
          - condition: state
            entity_id: switch.1562_heating_main
            state: 'on'
          - condition: state
            entity_id: switch.1564_heating_ten_3_kwh
            state: 'on'
        then:
        - data: {}
          target:
            entity_id: switch.1564_heating_ten_3_kwh
          action: switch.turn_off
        - data: {}
          target:
            entity_id:
            - switch.1563_heating_ten_1_5_kwh
            - switch.1561_boiler_ten_1_2_kwh
          action: switch.turn_on
        else:
        - if:
          - condition: and
            conditions:
            - condition: state
              entity_id: switch.1562_heating_main
              state: 'on'
            - condition: state
              entity_id: switch.1563_heating_ten_1_5_kwh
              state: 'on'
          then:
          - data: {}
            target:
              entity_id:
              - switch.1563_heating_ten_1_5_kwh
              - switch.1562_heating_main
            action: switch.turn_off
          else:
          - if:
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'on'
            - condition: not
              conditions:
              - condition: and
                conditions:
                - condition: state
                  entity_id: switch.boiler_night_charge
                  state: 'on'
                - condition: time
                  after: '14:00:00'
                  before: 06:30:00
            then:
            - data: {}
              target:
                entity_id: switch.1561_boiler_ten_1_2_kwh
              action: switch.turn_off
            - data: {}
              target:
                entity_id: switch.1560_boiler_ten_0_8_kwh
              action: switch.turn_on
            else:
            - if:
              - condition: state
                entity_id: switch.1560_boiler_ten_0_8_kwh
                state: 'on'
              - condition: not
                conditions:
                - condition: and
                  conditions:
                  - condition: state
                    entity_id: switch.boiler_night_charge
                    state: 'on'
                  - condition: time
                    after: '14:00:00'
                    before: 06:30:00
              then:
              - action: switch.turn_off
                target:
                  entity_id: switch.1560_boiler_ten_0_8_kwh
                data: {}
              else:
              - action: climate.turn_off
                metadata: {}
                data: {}
    else:
    - if:
      - condition: and
        conditions:
        - condition: state
          entity_id: switch.1560_boiler_ten_0_8_kwh
          state: 'off'
        - condition: or
          conditions:
          - type: is_power
            condition: device
            device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
            entity_id: 7a81724199b50ca52edb0f7f533bf6e9
            domain: sensor
            below: -900
          - type: is_power
            condition: device
            device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
            entity_id: 0124cde1985f8caf83b525ca9de4902c
            domain: sensor
            below: -900
            enabled: true
          - condition: and
            conditions:
            - condition: state
              entity_id: switch.boiler_night_charge
              state: 'on'
            - condition: time
              after: '14:00:00'
              before: 06:30:00
      then:
      - data: {}
        target:
          entity_id: switch.1560_boiler_ten_0_8_kwh
        action: switch.turn_on
      else:
      - if:
        - condition: and
          conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'on'
            enabled: true
          - condition: state
            entity_id: switch.1561_boiler_ten_1_2_kwh
            state: 'off'
          - condition: or
            conditions:
            - type: is_power
              condition: device
              device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
              entity_id: 7a81724199b50ca52edb0f7f533bf6e9
              domain: sensor
              below: -900
            - type: is_power
              condition: device
              device_id: 8c2a1798adbb65abd52f2ee5becc2a5a
              entity_id: 0124cde1985f8caf83b525ca9de4902c
              domain: sensor
              below: -1200
              enabled: true
          - condition: and
            conditions:
            - condition: state
              entity_id: switch.boiler_night_charge
              state: 'on'
            - condition: time
              after: '14:00:00'
              before: 06:30:00
        then:
        - data: {}
          target:
            entity_id:
            - switch.1561_boiler_ten_1_2_kwh
          action: switch.turn_on
        else:
        - if:
          - condition: and
            conditions:
            - condition: state
              entity_id: switch.heating_enabled
              state: 'on'
            - condition: state
              entity_id: switch.1561_boiler_ten_1_2_kwh
              state: 'on'
              enabled: true
            - condition: state
              entity_id: switch.1563_heating_ten_1_5_kwh
              state: 'off'
            - type: is_voltage
              condition: device
              device_id: f6c638d30b7111c48069aa655490cd8a
              entity_id: 3836aaef5495726a7509ee2fe16175d9
              domain: sensor
              above: 375
          then:
          - data: {}
            target:
              entity_id:
              - switch.1562_heating_main
              - switch.1563_heating_ten_1_5_kwh
            action: switch.turn_on
          else:
          - if:
            - condition: and
              conditions:
              - condition: state
                entity_id: switch.heating_enabled
                state: 'on'
              - condition: state
                entity_id: switch.1561_boiler_ten_1_2_kwh
                state: 'on'
                enabled: true
              - type: is_voltage
                condition: device
                device_id: f6c638d30b7111c48069aa655490cd8a
                entity_id: 3836aaef5495726a7509ee2fe16175d9
                domain: sensor
                above: 375
              - condition: state
                entity_id: switch.1563_heating_ten_1_5_kwh
                state: 'on'
              - condition: state
                entity_id: switch.1564_heating_ten_3_kwh
                state: 'off'
            then:
            - data: {}
              target:
                entity_id:
                - switch.1562_heating_main
                - switch.1564_heating_ten_3_kwh
              action: switch.turn_on
            - data: {}
              target:
                entity_id: switch.1563_heating_ten_1_5_kwh
              action: switch.turn_off
  icon: mdi:solar-power-variant-outline
  mode: restart
  description: ''
