power_load_disable_device_duplicate:
  alias: Power load. Disable device CASCADE WORK
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.any_device_high_power
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.1561_boiler_ten_1_2_kwh
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.1561_boiler_ten_1_2_kwh
          - action: switch.turn_on
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
        - conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            above: 1.7
          sequence:
          - action: input_number.set_value
            data:
              value: 1
            target:
              entity_id: input_number.charge_power_deye_6kw
        - conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
        - conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            above: 0.95
          sequence:
          - action: input_number.set_value
            data:
              value: 0
            target:
              entity_id: input_number.charge_power_deye_6kw
        - conditions:
          - condition: state
            entity_id: climate.2_nd_room_conditioner
            state:
            - heat
            - cool
          - condition: numeric_state
            entity_id: sensor.deye_6kw_battery
            below: 50
          sequence:
          - action: climate.turn_off
            target:
              device_id: be55afc0f88f5ce38043ce63a5d08b6f
            data: {}
    - conditions:
      - condition: state
        entity_id: binary_sensor.any_device_high_power
        state: 'off'
      sequence:
      - choose:
        - alias: 'Restore Step 1: Charge Power 1kW'
          conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            below: 1
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state: 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: input_number.set_value
            data:
              value: 1
            target:
              entity_id: input_number.charge_power_deye_6kw
        - alias: 'Restore Step 3: Boiler 0.8kW ON'
          conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.grid_off_and_deye_5kw_high_battery
              state: 'on'
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
            data: {}
        - alias: 'Restore Step 2: Charge Power 2kW'
          conditions:
          - condition: numeric_state
            entity_id: input_number.charge_power_deye_6kw
            below: 1.75
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state:
            - 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: input_number.set_value
            data:
              value: 1.75
            target:
              entity_id: input_number.charge_power_deye_6kw
        - alias: 'Restore Step 4: Boiler 1.2kW ON (Switch from 0.8)'
          conditions:
          - condition: state
            entity_id: switch.1560_boiler_ten_0_8_kwh
            state: 'on'
          - condition: state
            entity_id: switch.1561_boiler_ten_1_2_kwh
            state: 'off'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.grid_off_and_deye_5kw_high_battery
              state: 'on'
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state:
              - 'on'
            - condition: state
              entity_id: binary_sensor.grid_voltage_trigger_limit
              state:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 30
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.1561_boiler_ten_1_2_kwh
          - action: switch.turn_off
            target:
              entity_id: switch.1560_boiler_ten_0_8_kwh
        - alias: 'Restore Step 5: Climate -> Heat'
          conditions:
          - condition: state
            entity_id: input_boolean.my_flag2
            state: 'on'
          - condition: state
            entity_id: switch.1561_boiler_ten_1_2_kwh
            state: 'on'
          - condition: state
            entity_id: binary_sensor.battery_deye_6kw_charged
            state:
            - 'on'
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.battery_charge_and_export_power_limit
              state: 'on'
              for:
                seconds: 30
            - condition: state
              entity_id: binary_sensor.pv_5kw_15_lower_than_6kw
              state: 'on'
              for:
                seconds: 30
          sequence:
          - action: climate.set_hvac_mode
            data:
              hvac_mode: heat
            target:
              device_id: be55afc0f88f5ce38043ce63a5d08b6f
  icon: mdi:solar-power-variant-outline
  description: ''
