# Object/bill topology for the Payments pipeline (sync.py).
#
# An "object" is a real-estate property; a "bill" is one payable line under
# it. One object can have several bills from different sources - e.g.
# Квартира 197 has two Oselya accounts (utility management + concierge,
# billed by two different legal entities). Adding a new object or bill here
# is all that's needed for sync.py/build_dashboard.py to pick it up.
#
# object.icon: mdi:* icon shown in the dashboard section heading (optional).
#
# bill.source:
#   oselya             - scraped from oselya.com.ua/cabinet; needs account_id
#                        (see ~/.secrets/oselya_cabinet for the site login)
#   koec_mail          - electricity bill PDF from KOEC/ONDO, read from Gmail
#                        over IMAP (read-only); needs account_id (checked
#                        against the PDF), sender and mail_credentials (a
#                        host-only file: address + Google app password)
#   koec_cabinet       - KOEC/ONDO household cabinet (ok.koec.com.ua): history
#                        from its bill/charge/payment tables, PDF for the
#                        latest bill only; paid status from its payment
#                        history. Needs account_id and credentials (a
#                        host-only JSON file: email, password, url)
#   brovk_water        - КП "Броваритепловодоенергія" (debt.crewingcrm.com/brovk),
#                        no login - address + account_id open the account, so
#                        the address lives in `credentials` (host-only JSON:
#                        address {settlement, street, house, apartment} as the
#                        site spells them, print_name printed on the bill PDF)
#   manual_fixed_rate  - no scraping; the tariffs live in rates.yaml (edited
#                        from the dashboard's "Тарифи" tab, see rates.py) -
#                        sync.py synthesizes one row/month at the rate; the
#                        to-do checkbox is the only source of "paid" for
#                        these (there's no ledger to poll)

objects:
  apartment_197:
    label: "Квартира 197"
    icon: mdi:home-city
    bills:
      utility:
        label: "Комунальні"
        source: oselya
        account_id: "03014197"
      concierge:
        label: "Консьєрж"
        source: oselya
        account_id: "os303014197"
      electricity:
        label: "Електроенергія"
        source: koec_mail
        account_id: "000401151496"
        sender: rahunok@sender.koec.com.ua
        mail_credentials: ~/.secrets/yurii_mail
      water:
        label: "Вода"
        source: brovk_water
        account_id: "591479"
        credentials: ~/.secrets/brovk_water_197
      trash:
        label: "Вивіз сміття"
        source: manual_fixed_rate
  apartment_177:
    label: "Квартира 177"
    icon: mdi:home-city
    bills:
      electricity:
        label: "Електроенергія"
        source: koec_cabinet
        account_id: "000400941038"
        credentials: ~/.secrets/koec_cabinet_177
      water:
        label: "Вода"
        source: brovk_water
        account_id: "575651"
        credentials: ~/.secrets/brovk_water_177
      trash:
        label: "Вивіз сміття"
        source: manual_fixed_rate
      housing:
        label: "ЖЕК"
        source: manual_fixed_rate
  storage_39k:
    label: "Комірка 39k"
    icon: mdi:package-variant-closed
    bills:
      utility:
        label: "Комунальні"
        source: oselya
        account_id: "03014039k"
  parking_277:
    label: "Машиномісце 277"
    icon: mdi:car
    bills:
      utility:
        label: "Комунальні"
        source: oselya
        account_id: "0309277"
  parking_79:
    label: "Машиномісце 79"
    icon: mdi:car
    bills:
      utility:
        label: "Комунальні"
        source: oselya
        account_id: "0179079"
