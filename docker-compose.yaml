version: '3.8'

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./configuration:/config
      - /home/yurii/.ssh:/ssh:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

